# Repo defaults so a production run needs no flag soup:
#   uv run ansible-playbook ansible/site.yml --limit fpgas.online,pi
# The vault password is NOT configured here (CI has no vault and Ansible
# refuses to start if a configured vault file is missing); export
# ANSIBLE_VAULT_PASSWORD_FILE=~/.config/fpgas-online/vault-pass (or pass
# --vault-password-file) for hosts with vaulted vars (fpgas.online).
# The CI harness (tests/vm/run_tests.py) passes -i/--become explicitly and is
# unaffected.
[defaults]
inventory = ansible/inventory
# Per-task wall-clock timing (and a slowest-tasks summary at the end of the
# run) so hardware runs and CI runs can be compared for pathological tasks —
# same callback the hetzner-ansible repo uses. ansible.posix is already in
# requirements.yml.
callbacks_enabled = ansible.posix.profile_tasks
retry_files_enabled = False
interpreter_python = auto_silent
# The Pi chroot host (piroot) and a freshly reinstalled server both present
# new host keys; accept-new avoids interactive prompts without disabling
# verification.
host_key_checking = True

[ssh_connection]
# All SSH client behaviour (including the dedicated known_hosts file that
# survives host reinstalls independent of /etc/ssh/ssh_known_hosts) lives in
# ansible/ssh.cfg. -F is relative to the repo root, where runs happen.
ssh_args = -F ansible/ssh.cfg
# Without pipelining every loop item pays a full put/exec round-trip: the
# 148-item vlan-ports walks measured ~2 s/item (4m54s for one task) on the
# tweed rebuild (B1-4). Requires !requiretty sudoers (Debian default).
pipelining = True
# Retry transient connection failures: a multiplexed ControlMaster channel
# occasionally fails with "PTY allocation request failed on channel 0",
# marking the host UNREACHABLE mid-run (tweed rebuild B1-10; hetzner-ansible
# runs the same setting).
retries = 3

[privilege_escalation]
become = True
