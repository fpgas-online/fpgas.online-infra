name: Lint

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ansible-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        # Pinned to a specific tag because astral-sh/setup-uv only
        # publishes floating major tags up to v7; v8 has no major ref.
        uses: astral-sh/setup-uv@v8.1.0

      # ansible-lint and yamllint are pinned in pyproject.toml's dev group
      # (uv.lock), so CI and `uv run ansible-lint` locally report the same
      # violations; bump them deliberately.
      - name: Install linters
        run: uv sync

      # Same cache as the VM test. Without the pinned collections
      # ansible-lint fails syntax-check on ansible.posix modules and silently
      # skips linting those playbooks.
      - name: Cache Ansible collections
        uses: actions/cache@v5
        with:
          path: ~/.ansible/collections
          key: ansible-collections-${{ hashFiles('requirements.yml') }}

      - name: Install Ansible collections
        run: uv run ansible-galaxy collection install -r requirements.yml

      - name: Run yamllint
        run: uv run yamllint -c .yamllint.yml ansible/

      # Blocking: the tree is lint-clean, keep it that way. Fix the
      # violation; use a scoped `# noqa: <rule>` with a reason only when
      # the flagged construct is deliberate.
      - name: Run ansible-lint
        working-directory: ansible
        run: uv run ansible-lint

  # The harness and CI tooling's unit tests (tests/test_*.py), e.g. the
  # guard that the image's inputs key covers every file the build reads.
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install dependencies
        run: uv sync
      # attr: setfattr/getfattr for the split-image round trip
      # (tests/test_nfsroot_layers_podman.py, which needs sudo + podman).
      # dnsmasq-base, dhcpcd-base, iproute2, iputils-ping, util-linux: a
      # board taking its port's IPv6 address from a real dnsmasq, in network
      # namespaces (tests/test_board_ipv6_netns.py, which needs sudo).
      - name: Install the round-trip and board IPv6 tests' tools
        run: >-
          sudo apt-get install -y --no-install-recommends
          attr dnsmasq-base dhcpcd-base iproute2 iputils-ping util-linux
      - name: Run the unit tests
        env:
          NFSROOT_PODMAN_TEST: "1"
          # Being unable to run the board IPv6 namespace test is a failure
          # here, not a skip.
          BOARD_IPV6_NETNS_TEST: "1"
        run: uv run pytest -q tests
