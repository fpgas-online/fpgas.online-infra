# Build the provisioned Pi NFS root and publish it to GHCR (issue #34;
# design in docs/superpowers/specs/2026-08-31-ci-nfsroot-build-design.md).
# Runs the same Ansible roles as site.yml's build path against a chroot on
# an arm64 runner (native AArch32, spike PR #40), verifies per-model boot
# material, and pushes ghcr.io/fpgas-online/nfsroot (rolling tag only from
# main; dated pinnable tag always). Scheduled runs keep main's image current
# with the package repositories (see `on.schedule`).
name: nfsroot build

# No push trigger: every push/PR builds via the VM test workflow, which
# calls this one and then boots the freshly built image (workflow_call
# output `image` = the dated tag). The schedules below rebuild main's image
# between merges, so it picks up new debs from the package repositories.
on:
  workflow_dispatch:
    inputs:
      from_scratch:
        description: "Build from RasPiOS instead of converging main's latest image"
        type: boolean
        default: true
  # Hourly: a warm build of main (~5 min), so the rolling tag -- what
  # production pulls -- is never more than an hour behind the package
  # repositories. Daily: a build from scratch (~10 min), which proves the
  # clean build still works and drops anything a chain of warm builds has
  # left behind. SCRATCH_CRON below must match the daily entry.
  schedule:
    - cron: "47 * * * *"
    - cron: "17 2 * * *"
  workflow_call:
    inputs:
      extra_tag:
        description: "Also push this tag (the VM test picks it before the build starts)"
        type: string
        default: ""
      from_scratch:
        description: "Build from RasPiOS instead of converging main's latest image"
        type: boolean
        default: false
    outputs:
      image:
        description: "GHCR ref of the image this run pushed (dated tag)"
        value: ${{ jobs.build.outputs.image }}

permissions:
  contents: read
  packages: write

env:
  SCRATCH_CRON: "17 2 * * *"

concurrency:
  group: nfsroot-build-${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    outputs:
      image: ${{ steps.reuse.outputs.image || steps.publish.outputs.image }}
    steps:
      - uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # An image built from exactly these inputs (tests/ci/nfsroot_inputs.py:
      # the build roles, playbook, inventory and tooling, plus the UTC hour)
      # is retagged instead of rebuilt; the steps below then skip. Every
      # change to an image input gets a fresh build of this checkout.
      - name: Reuse an image built from the same inputs
        id: reuse
        env:
          NFSROOT_EXTRA_TAG: ${{ inputs.extra_tag }}
        run: python3 tests/ci/nfsroot_publish.py --reuse

      - uses: astral-sh/setup-uv@v5
        if: steps.reuse.outputs.reused != 'true'
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Cache Ansible collections
        if: steps.reuse.outputs.reused != 'true'
        uses: actions/cache@v5
        with:
          path: ~/.ansible/collections
          key: ansible-collections-arm-${{ hashFiles('requirements.yml') }}

      - name: Install ansible and collections
        if: steps.reuse.outputs.reused != 'true'
        run: |
          uv sync
          uv run ansible-galaxy collection install -r requirements.yml

      # downloads.raspberrypi.org can crawl (2026-09-03: 14.5 min for the
      # 524 MB image vs the usual 16 s). Cache the download; the img role's
      # get_url (force: false) skips it on a hit. Keyed on srv.yml so a new
      # image release busts the cache. The dir must be runner-writable for
      # actions/cache's tar restore/save (the download itself runs as root).
      - name: Prepare image cache dir
        if: steps.reuse.outputs.reused != 'true'
        id: cachedirs
        run: |
          sudo install -d -o "$(id -un)" /var/cache/pib /var/cache/nfsroot-debs
          echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Cache the RasPiOS base image
        if: steps.reuse.outputs.reused != 'true'
        uses: actions/cache@v5
        with:
          path: /var/cache/pib
          key: raspios-${{ hashFiles('ansible/inventory/group_vars/all/srv.yml') }}

      # apt's downloads from earlier builds (inventory-ci-nfsroot's
      # nfsroot_build_deb_cache, bind-mounted into the root during the
      # build and never packed into the image). One entry per UTC day,
      # seeded from the newest earlier one, so it tracks the archive without
      # a GB-sized entry (~760 MB) per run crowding out the other caches in
      # the repo's cache quota. apt checks every deb against the signed
      # indexes: a stale one is re-downloaded.
      - name: Restore the build's deb cache
        if: steps.reuse.outputs.reused != 'true'
        id: debcache
        uses: actions/cache/restore@v5
        with:
          path: /var/cache/nfsroot-debs
          key: nfsroot-debs-${{ steps.cachedirs.outputs.day }}
          restore-keys: nfsroot-debs-

      # PR and push builds converge the image main last published (the roles
      # are idempotent; their apt runs are then mostly no-ops): ~3 min
      # instead of ~10. The daily schedule and a dispatch build from
      # RasPiOS, so the from-scratch path keeps running and a warm chain is
      # never more than a day old. See tests/ci/nfsroot_warm.py.
      - name: Start from main's latest image (warm build)
        if: >-
          steps.reuse.outputs.reused != 'true'
          && github.event.schedule != env.SCRATCH_CRON
          && !inputs.from_scratch
        id: warm
        run: python3 tests/ci/nfsroot_warm.py ghcr.io/fpgas-online/nfsroot:bookworm-armhf /srv/nfs/rpi/bookworm

      - name: Build the NFS root (same roles as site.yml, chroot connection)
        if: steps.reuse.outputs.reused != 'true'
        working-directory: ansible
        run: >-
          sudo env "ANSIBLE_COLLECTIONS_PATH=$HOME/.ansible/collections"
          "ANSIBLE_CALLBACKS_ENABLED=ansible.posix.profile_tasks"
          "$(pwd)/../.venv/bin/ansible-playbook"
          -i inventory-ci-nfsroot/hosts ci-nfsroot.yml
          --skip-tags pipw,keys
          -e nfsroot_warm=${{ steps.warm.outputs.warm == 'true' }}

      # apt leaves its root-only lock file and partial/ dir in the cache
      # (the save's tar failed on them): keep only the debs, runner-owned.
      - name: Tidy the build's deb cache for saving
        if: steps.reuse.outputs.reused != 'true' && steps.debcache.outputs.cache-hit != 'true'
        run: |
          sudo find /var/cache/nfsroot-debs -mindepth 1 -maxdepth 1 ! -name '*.deb' -exec rm -rf {} +
          sudo chown -R "$(id -un)" /var/cache/nfsroot-debs
          du -sh /var/cache/nfsroot-debs

      - name: Save the build's deb cache
        if: steps.reuse.outputs.reused != 'true' && steps.debcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: /var/cache/nfsroot-debs
          key: nfsroot-debs-${{ steps.cachedirs.outputs.day }}

      - name: Write nfsroot manifest (packages, boot hashes, configs)
        if: steps.reuse.outputs.reused != 'true'
        run: |
          sudo .venv/bin/python tests/ci/nfsroot_manifest.py \
            /srv/nfs/rpi/bookworm manifest

      - uses: actions/upload-artifact@v4
        if: steps.reuse.outputs.reused != 'true'
        with:
          name: nfsroot-manifest
          path: manifest/

      - name: Publish to GHCR
        if: steps.reuse.outputs.reused != 'true'
        id: publish
        env:
          NFSROOT_EXTRA_TAG: ${{ inputs.extra_tag }}
        run: |
          # skopeo pushes the zstd OCI layout nfsroot_publish.py writes
          # (both ship on the runner images; installed if one ever does not)
          command -v skopeo && command -v zstd \
            || { sudo apt-get update && sudo apt-get install -y skopeo zstd; }
          uv run tests/ci/nfsroot_publish.py
