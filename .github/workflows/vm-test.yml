---
name: VM Integration Tests

on:
  push:
    branches: [main]
  pull_request:
    # nfsroot-pull is in the list so PRs stacked on the phase-3 branch get
    # full CI; harmless once that branch is gone.
    branches: [main, nfsroot-pull]
  workflow_dispatch:

concurrency:
  group: vm-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Build the Pi NFS root image from THIS checkout and publish it (dated
  # tag; rolling tag only on main). The VM test below then pulls exactly
  # this image, so a PR's role changes are baked into the root its own
  # virtual Pi boots. ~13 min on a native-AArch32 arm64 runner (issue #34).
  nfsroot:
    uses: ./.github/workflows/nfsroot-build.yml
    permissions:
      contents: read
      packages: write

  vm-test:
    name: Server + Pi PXE Boot
    needs: nfsroot
    runs-on: ubuntu-latest
    # Run inside a Debian trixie container so qemu-rpi-system-arm (built
    # for trixie) can be installed via APT. The package depends on
    # libcapstone5, libfdt1 >= 1.7.2, and libglib2.0-0t64 >= 2.83.0, which
    # are newer than what Ubuntu 24.04 ships. node:22-trixie provides
    # trixie + the Node.js binary that GitHub Actions' JavaScript actions
    # (checkout, setup-uv, cache, upload-artifact) need to run.
    #
    # --device=/dev/kvm exposes the runner's KVM device to the container
    # so QEMU can use hardware acceleration when available.
    container:
      image: node:22-trixie
      options: --device=/dev/kvm
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        # Pinned to a specific tag because astral-sh/setup-uv only
        # publishes floating major tags up to v7; v8 has no major ref.
        uses: astral-sh/setup-uv@v8.1.0

      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            qemu-system-x86 \
            qemu-utils \
            cloud-image-utils \
            systemd-container \
            openssh-client \
            ca-certificates

      - name: Install qemu-rpi packages
        run: |
          echo "deb [trusted=yes] https://fpgas-online.github.io/rpi-qemu trixie main" \
            > /etc/apt/sources.list.d/qemu-rpi.list
          apt-get update -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/qemu-rpi.list -o Dir::Etc::sourceparts=/dev/null
          apt-get install -y qemu-rpi-system-arm qemu-rpi-pxeboot

      - name: Enable KVM (if available)
        run: |
          if [ -e /dev/kvm ]; then
            echo "KVM_AVAILABLE=true" >> "$GITHUB_ENV"
            chmod 666 /dev/kvm
            echo "KVM acceleration enabled"
          else
            echo "KVM_AVAILABLE=false" >> "$GITHUB_ENV"
            echo "KVM not available, using TCG (slower)"
          fi

      - name: Install Python dependencies
        run: uv sync

      - name: Cache VM images
        uses: actions/cache@v5
        with:
          path: tests/vm/images
          key: vm-images-bookworm-v2

      - name: Run VM integration tests (server + Pi PXE boot)
        env:
          NFSROOT_IMAGE: ${{ needs.nfsroot.outputs.image }}
        run: uv run tests/vm/run_tests.py --phase all --nfsroot-image "$NFSROOT_IMAGE"

      # Belt and braces with the artifact below: on a failure, put the log
      # tails straight into the job log — a crashed teardown has produced
      # runs where the artifact upload "succeeded" with nothing matching
      # (if-no-files-found: ignore masks it).
      - name: Show serial log tails
        if: failure()
        run: |
          for f in tests/vm/workdir/*-serial.log*; do
            echo "===== $f ====="
            tail -n 200 "$f" || true
          done

      - name: Upload serial logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: serial-logs
          path: tests/vm/workdir/*-serial.log*
          if-no-files-found: ignore
