---
name: VM Integration Tests

on:
  push:
    branches: [main]
  pull_request:
    # nfsroot-pull is in the list so PRs stacked on the phase-3 branch get
    # full CI; harmless once that branch is gone.
    branches: [main, nfsroot-pull]
  workflow_dispatch:
    inputs:
      from_scratch:
        description: "Rebuild the RasPiOS stages from the download and build the image on them, instead of converging main's latest image"
        type: boolean
        default: false
  # Rebuild main's Pi root between merges so it picks up new debs from the
  # package repositories, and test it like any other build before it can
  # become the rolling tag production pulls (the promote job below).
  # Hourly: refresh the upgraded RasPiOS stage (tests/ci/nfsroot_stages.py)
  # and warm-build main, so the rolling tag is at most about an hour behind
  # the repositories. Daily: rebuild both stages from the RasPiOS download
  # and build on them, which proves the clean build still works and drops
  # anything a chain of warm builds has left behind. The daily entry must
  # match SCRATCH_CRON in nfsroot-build.yml (tests check it).
  schedule:
    - cron: "47 * * * *"
    - cron: "17 2 * * *"

# PRs: a new push supersedes the run in progress. main (pushes, schedules,
# dispatches): runs never overlap and are never cancelled mid-run, so the
# rolling tag is promoted in order and a merge is never left untested by a
# schedule that started after it (a queued run is superseded by a newer
# one, which tests a checkout that includes it).
concurrency:
  group: vm-test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Build the Pi NFS root image from THIS checkout and publish it (dated
  # tag, plus ci-<run_id>). The VM test below pulls exactly this image, so
  # a PR's role changes are baked into the root its own virtual Pi boots.
  # ~15 min on a native-AArch32 arm64 runner (issue #34).
  nfsroot:
    uses: ./.github/workflows/nfsroot-build.yml
    with:
      extra_tag: ci-${{ github.run_id }}
      from_scratch: ${{ github.event_name == 'workflow_dispatch' && inputs.from_scratch }}
    permissions:
      contents: read
      packages: write

  vm-test:
    name: Server + Pi PXE Boot
    # No `needs: nfsroot`: the two jobs run concurrently. The server phase
    # spends its first minutes on roles that do not touch the root, and
    # the img role's pull retries (tests/inventory/host_vars/test-vm.yml)
    # until the build above has pushed ci-<run_id>.
    runs-on: ubuntu-latest
    # Run inside a Debian trixie container so qemu-rpi-system-arm (built
    # for trixie) can be installed via APT. The package depends on
    # libcapstone5, libfdt1 >= 1.7.2, and libglib2.0-0t64 >= 2.83.0, which
    # are newer than what Ubuntu 24.04 ships. node:22-trixie provides
    # trixie + the Node.js binary that GitHub Actions' JavaScript actions
    # (checkout, setup-uv, cache, upload-artifact) need to run.
    #
    # --device=/dev/kvm exposes the runner's KVM device to the container
    # so QEMU can use hardware acceleration when available.
    container:
      image: node:22-trixie
      options: --device=/dev/kvm
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        # Pinned to a specific tag because astral-sh/setup-uv only
        # publishes floating major tags up to v7; v8 has no major ref.
        uses: astral-sh/setup-uv@v8.1.0

      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            qemu-system-x86 \
            qemu-utils \
            cloud-image-utils \
            systemd-container \
            openssh-client \
            ca-certificates \
            curl

      # rpi-qemu's signed flat repo (its README). The version floor keeps
      # out builds before 2:0.1+95, which have the GENET TX index-wrap
      # freeze (rpi-qemu#16): the virtual Pi stopped dead after its 65536th
      # TX descriptor, ~30 tasks into verify-pi.
      - name: Install qemu-rpi packages
        run: |
          install -d -m0755 /etc/apt/keyrings
          curl -fsSL https://fpgas.online/rpi-qemu/rpi-qemu.gpg -o /etc/apt/keyrings/rpi-qemu.gpg
          echo "deb [signed-by=/etc/apt/keyrings/rpi-qemu.gpg] https://fpgas.online/rpi-qemu/trixie/ ./" \
            > /etc/apt/sources.list.d/rpi-qemu.list
          apt-get update -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/rpi-qemu.list -o Dir::Etc::sourceparts=/dev/null
          apt-get install -y qemu-rpi-system-arm qemu-rpi-pxeboot
          v=$(dpkg-query -W -f='${Version}' qemu-rpi-system-arm)
          echo "qemu-rpi-system-arm $v"
          dpkg --compare-versions "$v" ge "2:0.1+95" \
            || { echo "qemu-rpi-system-arm $v predates the GENET TX freeze fix (rpi-qemu#16)"; exit 1; }
          # The pxeboot firmware must clear its TFTP prefix when
          # <serial>/start4.elf is missing, like a real Pi (rpi-qemu#18):
          # the per-port-VLAN sites serve one boot dir with no serial dirs.
          p=$(dpkg-query -W -f='${Version}' qemu-rpi-pxeboot)
          echo "qemu-rpi-pxeboot $p"
          dpkg --compare-versions "$p" ge "2:0.1+100" \
            || { echo "qemu-rpi-pxeboot $p predates the TFTP prefix fallback (rpi-qemu#18)"; exit 1; }

      - name: Enable KVM (if available)
        run: |
          if [ -e /dev/kvm ]; then
            echo "KVM_AVAILABLE=true" >> "$GITHUB_ENV"
            chmod 666 /dev/kvm
            echo "KVM acceleration enabled"
          else
            echo "KVM_AVAILABLE=false" >> "$GITHUB_ENV"
            echo "KVM not available, using TCG (slower)"
          fi

      - name: Install Python dependencies
        run: uv sync

      # The pinned collections (requirements.yml); the harness installs any
      # that are missing (it took 46 s to download them all on every run).
      - name: Cache Ansible collections
        uses: actions/cache@v5
        with:
          path: ~/.ansible/collections
          key: ansible-collections-${{ hashFiles('requirements.yml') }}

      - name: Cache VM images
        uses: actions/cache@v5
        with:
          path: tests/vm/images
          key: vm-images-trixie-v1

      - name: Run VM integration tests (server + Pi PXE boot)
        env:
          NFSROOT_IMAGE: ghcr.io/fpgas-online/nfsroot:ci-${{ github.run_id }}
        run: uv run tests/vm/run_tests.py --phase all --nfsroot-image "$NFSROOT_IMAGE"

      # Belt and braces with the artifact below: on a failure, put the log
      # tails straight into the job log — a crashed teardown has produced
      # runs where the artifact upload "succeeded" with nothing matching
      # (if-no-files-found: ignore masks it).
      - name: Show serial log tails
        if: failure()
        run: |
          for f in tests/vm/workdir/*-serial.log*; do
            echo "===== $f ====="
            tail -n 200 "$f" || true
          done

      - name: Upload serial logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: serial-logs
          path: tests/vm/workdir/*-serial.log*
          if-no-files-found: ignore

  # Point the rolling tag (what production pulls unless a deploy pins
  # another, ansible/roles/img/defaults/main.yml) at the image the virtual
  # Pi above has just netbooted and registered with. Main only, and only
  # when both jobs passed: a failed or cancelled run leaves production's
  # tag on the last image that passed. ci-<run_id> is this run's own tag
  # (the dated tag is shared by every build of a commit on a day).
  promote:
    name: Promote to bookworm-armhf
    needs: [nfsroot, vm-test]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Point bookworm-armhf at the tested image
        run: python3 tests/ci/nfsroot_publish.py --promote ghcr.io/fpgas-online/nfsroot:ci-${{ github.run_id }}
