---

img_host: http://downloads.raspberrypi.org
dir_date: 2026-06-19
# release_date is the date in the image filename; it can lag dir_date by a day
release_date: 2026-06-18
dist: trixie

img_path: "raspios_lite_armhf/images/raspios_lite_armhf-{{ dir_date }}"
base_name: "{{ release_date }}-raspios-{{ dist }}-armhf-lite"
img_name: "{{ base_name }}.img"
zip_name: "{{ img_name }}.xz"

user: pi

nfs_root: "/srv/nfs/rpi/{{ dist }}"

# TFTP root served by dnsmasq. Per-port VLAN hosts (switches defined) serve
# the Pi boot partition directly: the RPi 4 bootloader asks for
# <serial>/<file> first and, if start4.elf is not there, "the prefix is
# cleared" (TFTP_PREFIX, Raspberry Pi bootloader docs) and every file comes
# from the root -- so no per-Pi serial registration is needed. Legacy
# MAC-table hosts keep /srv/tftp with per-serial symlinks from switch.nos.
tftp_root: "{{ (nfs_root ~ '/boot') if switches is defined else '/srv/tftp' }}"
