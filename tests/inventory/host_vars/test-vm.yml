---
# Network interfaces — must match QEMU NIC configuration
eth_uplink_mac_address: "52:54:00:aa:bb:01"
# Named, owned and addressed like tweed's (static, networkd, eth-uplink /
# eth-local): the netif role renames the fresh VM's enp0s2/enp0s3 by MAC,
# moves the uplink off ifupdown and reboots once -- the path a new tweed
# takes. QEMU user-net's addressing is fixed: the guest is 10.0.2.15/24,
# the gateway 10.0.2.2 and its DNS proxy 10.0.2.3.
eth_uplink: eth-uplink
eth_uplink_static: true
eth_uplink_static_address: 10.0.2.15
eth_uplink_static_netmask: 24
eth_uplink_static_gateway: 10.0.2.2
eth_uplink_dns_server: 10.0.2.3

eth_local: eth-local
eth_local_mac_address: "52:54:00:aa:bb:02"
eth_local_address: 10.21.0.1
# /16, not /24: in the per-port VLAN scheme the local net is the whole
# 10.21.0.0/16 supernet -- Pi IPs are 10.21.<switch>.<port> (e.g. sw1 p1 =
# 10.21.1.1), which fall outside 10.21.0.0/24. This netmask feeds the NFS
# export (roles/nfs/templates/exports.j2) and the camera publish ACL, both
# of which must admit every port's Pi. The eth-local trunk interface address
# itself stays /24 (hardcoded in vlan_ports/templates/eth-local.network.j2).
eth_local_netmask: 16
# dhcp_range intentionally absent: this host defines `switches` (per-port
# addressing), so dnsmasq-base.conf.j2 skips the bare pool range and every
# port gets its own dhcp-range from ports.conf.j2 instead -- mirrors
# ansible/inventory/host_vars/fpgas.online.yml (tweed).

pib_network: "10.21"
pib_network6_base: "2001:db8:a137:21"  # RFC 3849 doc range; test only
pib_domain: test.fpgas.online

firewall_internal_networks: [10.21.0.0/24]

user_name: testuser

conference_name: test
room_name: test

time_zone: UTC

common_name: test.fpgas.online
subject_alt_names: []

streaming_frontend_aliases: []
streaming_frontend_hostname: test.fpgas.online
domain_name: "{{ streaming_frontend_hostname }}"

# The real welland fixture, shipped inside the installed fpgas-online-site
# package -- so the VM test exercises the production seeding path end to end.
# (Was `test.json`, a fixture that never existed: the old role silently
# skipped missing fixtures, which is the outage this PR fixes.)
fixture_path: fpgas.online.json

# Fleet self-registration (fpgas.online-infra#47): the VM test covers the
# broker + consumer wiring (and the Pi agent, once the fleet-enabled
# fpgas-online-setup-pi deb reaches the apt repo).
fleet_broker: true
fleet_site: test

switch_base: base

# `nos`/`mpi_port`/`mpi_ip` removed: those are the legacy MAC-table scheme's
# fields (see ansible/roles/site/tasks/snmp.yml, ansible/roles/fixpi), dropped
# in Task 10 for hosts with `switches:` defined -- mirrors tweed's switch:
# block (ansible/inventory/host_vars/fpgas.online.yml), kept here only for
# the SNMP monitoring env vars.
switch:
  mac: "00:00:00:00:00:00"
  oid: iso.3.6.1.2.1.105.1.1.1.3.1
  host: "10.21.0.200"
  SNMP_SWITCH_SECURITY_LEVEL: authNoPriv
  SNMP_SWITCH_AUTH_PROTOCOL: SHA512
  SNMP_SWITCH_PRIV_PROTOCOL: AES128
  SNMP_SWITCH_USERNAME: test_snmp_user
  SNMP_SWITCH_AUTHKEY: test_auth_key
  SNMP_SWITCH_PRIVKEY: test_priv_key

# Single switch, one access port -- the VM harness's AccessPortSwitch(2101)
# emulates switch 1 port 1 (see tests/vm/vswitch.py, tests/vm/run_tests.py).
# switches_manage: false skips only the SNMP converge step of the switch_vlans
# role (no real switch here); the CLI install + config render still run.
switches:
  - index: 1
    model: s3300
    mgmt_host: 127.0.0.1
    access_ports: 1
    gateway_trunk_port: 49
    downstream_trunk_ports: []
    house_uplink_port: 52
switches_manage: false

# The pi user's PLAINTEXT shared password. roles/fixpi hashes it into the NFS
# root's /etc/shadow; roles/site hands it (base64) to the web terminal, which
# is why it cannot be a hash. tests/vm/run_tests.py logs in with it.
pi_pw: "fpgas-test-pi"

# tinytapeout.fpgas.online in the VM test: the live FPGA slot is the virtual
# Pi's own port (switch 1 port 1), so the designs API route is exercised as
# on tweed; the rest are unwired. No public DNS => no certbot.
tt_boards:
  - {slug: fpga-1, switch: 1, port: 1, kind: fpga, title: "FPGA (the virtual Pi)"}
  # commander: legacy exercises the catalogue key end to end (template render,
  # daemon tolerance, ttsite_loadboards) and the legacy embed bundle.
  - {slug: tt03p5, port: null, kind: asic, shuttle: tt03p5, title: "TT 3.5 (unwired)", commander: legacy}
  - {slug: tt06, port: null, kind: asic, shuttle: tt06, title: "Tiny Tapeout 6 (unwired)"}
  - {slug: kianv-1, port: null, kind: kianv, title: "KianV (unwired)"}
ttsite_certbot: false
# The Commander embed bundles tweed pins (ansible/inventory/host_vars/fpgas.online.yml).
tt_commander_embed_version: "0.2.0"
tt_commander_embed_sha256: "e4e6d71b4acd52a9a0dcbdf869b7928a74d130250d1a25cde546fee7a1b06b39"
tt_commander_legacy_embed_version: "0.1.0"
tt_commander_legacy_embed_sha256: "1e8e992cf017911bcf964e50a018a5d463c7ff4c5158594f73d869f0cad62ec2"
# The VM test runs concurrently with the nfsroot build that produces the
# image it pulls (.github/workflows/vm-test.yml): wait up to 45 min for it.
# Polled every 10 s: when the build is on the critical path (a from-scratch
# build), every second between its push and the pull is added to the run.
img_pull_retries: 270
img_pull_delay: 10

# Orange Pi netboot rendering (fixpi/sunxi.yml): publishes the armmp kernel
# the pulled image carries (baked in by the CI build, fixpi/sunxi-image.yml).
sunxi_default_dtb: sun8i-h3-orangepi-pc.dtb
# hat_uuid + mac identify the physical board; switch/port/usb/host are its
# current placement (see the production host_vars). Its FEL-boot hub host is
# a Pi this test does not boot (the virtual Pi is pi-sw1-p1), so verify-pi's
# hub-host and DT-model-gated checks do not apply to the virtual Pi.
sunxi_boards:
  - {hat_uuid: "00000000-0000-0000-0000-000000000000", mac: "02:81:00:00:00:01", model: orangepi-pc, switch: 1, port: 2, usb: "1-1.2.2", host: pi-sw1-p9}

# Authoritative DNS for a delegated zone, and the off-net resolver allowed to
# query it (tweed: fpgas.welland.mithis.com on eth-uplink for ten64 at
# 10.99.21.1). The same dnsmasq auth-zone/auth-server and nftables rules
# render and load here, on the VM's uplink with QEMU's user-net gateway as
# the delegating resolver.
dnsmasq_auth_zone: fpgas.test.fpgas.online
dnsmasq_auth_glue: gw.fpgas.test.fpgas.online
dnsmasq_auth_subnet: 10.21.0.0/16
dnsmasq_auth_interface: eth-uplink
firewall_dns_query_sources:
  - 10.0.2.2

# WebRTC/WHEP (roles/cam/webrtc): converge + verify in CI. The advertised
# candidate is the TEST-NET uplink address; no browser reaches it in CI.
webrtc_media_port: 8189
webrtc_additional_hosts: ["203.0.113.1"]
