---
# Server-side verification — checks the x86 server is correctly configured
# for Pi network booting. Run BEFORE Pis boot.
#
# Usage:
#   uv run ansible-playbook ansible/verify-server.yml
#   uv run ansible-playbook ansible/verify-server.yml --limit nbp

- name: Verify server roles (nbp)
  hosts: nbp
  become: true
  tasks:
    - name: Verify apt-client
      ansible.builtin.include_role:
        name: apt_client
        tasks_from: verify/main.yml

    - name: Verify automation-user
      ansible.builtin.include_role:
        name: automation_user
        tasks_from: verify/main.yml
      when: automation_user_manage | default(false) | bool

    - name: Verify operators
      ansible.builtin.include_role:
        name: operators
        tasks_from: verify/main.yml

    - name: Verify jump
      ansible.builtin.include_role:
        name: jump
        tasks_from: verify/main.yml

    - name: Verify sshd
      ansible.builtin.include_role:
        name: sshd
        tasks_from: verify/main.yml

    - name: Verify lldp
      ansible.builtin.include_role:
        name: lldp
        tasks_from: verify/main.yml

    - name: Verify firewall
      ansible.builtin.include_role:
        name: firewall
        tasks_from: verify/main.yml

    - name: Verify nfs
      ansible.builtin.include_role:
        name: nfs
        tasks_from: verify/main.yml

    - name: Verify img
      ansible.builtin.include_role:
        name: img
        tasks_from: verify/main.yml

    - name: Verify fixpi
      ansible.builtin.include_role:
        name: fixpi
        tasks_from: verify/main.yml

    # The NFS root's kernel set, which grows between rebuilds and turns the
    # next one into a two-hour emulated initramfs marathon if nobody looks.
    - name: Verify nspawn-pi
      ansible.builtin.include_role:
        name: nspawn_pi
        tasks_from: verify/main.yml

    - name: Verify pxe
      ansible.builtin.include_role:
        name: pxe
        tasks_from: verify/main.yml

    - name: Verify netconsole
      ansible.builtin.include_role:
        name: netconsole
        tasks_from: verify/main.yml

    - name: Verify apt-cache
      ansible.builtin.include_role:
        name: apt_cache
        tasks_from: verify/main.yml

    # VLAN-per-port scheme verification — only applies to hosts with
    # `switches:` defined (tweed). Hosts on the legacy MAC-table scheme
    # (ps1.fpgas.online, CI test-vm) don't have per-port
    # networkd/dnsmasq/nft config, so these are skipped there.
    - name: Check networkctl list for a per-port VLAN interface
      ansible.builtin.command: networkctl list
      changed_when: false
      register: verify_networkctl_list
      when: switches is defined

    # Diagnostic: surface the actual networkd state in the log so a
    # missing v* interface can be diagnosed without another CI round trip.
    - name: Gather networkd diagnostics
      ansible.builtin.command: "{{ item }}"
      changed_when: false
      failed_when: false
      loop:
        - systemctl is-active systemd-networkd
        - journalctl -u systemd-networkd --no-pager -n 40
      register: verify_networkd_diag
      when: switches is defined

    - name: Show networkd diagnostics
      ansible.builtin.debug:
        msg: "{{ verify_networkctl_list.stdout_lines + (verify_networkd_diag.results | map(attribute='stdout_lines') | list) }}"
      when: switches is defined

    - name: Assert networkctl list shows a v* per-port VLAN interface
      ansible.builtin.assert:
        that: verify_networkctl_list.stdout | regex_search('\\bv[0-9]+\\b') is not none
        fail_msg: "networkctl list does not show a v* per-port VLAN interface"
      when: switches is defined

    - name: Check dnsmasq config is valid
      ansible.builtin.command: dnsmasq --test
      changed_when: false
      register: verify_dnsmasq_test
      failed_when: false
      when: switches is defined

    - name: Assert dnsmasq --test exits 0
      ansible.builtin.assert:
        that: verify_dnsmasq_test.rc == 0
        fail_msg: "dnsmasq --test failed: {{ verify_dnsmasq_test.stderr }}"
      when: switches is defined

    - name: Get nft forward chain
      ansible.builtin.command: nft list chain inet filter forward
      changed_when: false
      register: verify_nft_forward_chain
      when: switches is defined

    - name: Assert nft forward chain has policy drop
      ansible.builtin.assert:
        that: "'policy drop' in verify_nft_forward_chain.stdout"
        fail_msg: "nft chain inet filter forward missing 'policy drop'"
      when: switches is defined

    # A per-board DNAT rule without the uplink interface match lets one board
    # reach another through the gateway's uplink address: the forward chain
    # accepts DNATed connections ahead of its board-to-board drop (#204).
    - name: Get nft prerouting chain
      ansible.builtin.command: nft list chain ip nat prerouting
      changed_when: false
      register: verify_nft_prerouting_chain
      when: switches is defined

    - name: Assert every per-board DNAT rule is limited to the uplink interface
      ansible.builtin.assert:
        that:
          - verify_nft_dnat_rules | length > 0
          - verify_nft_dnat_rules | reject('search', 'iifname "' ~ eth_uplink ~ '"') | list | length == 0
        fail_msg: >-
          DNAT rules that do not match the uplink interface ({{ eth_uplink }}):
          {{ verify_nft_dnat_rules | reject('search', 'iifname "' ~ eth_uplink ~ '"') | list }}
      vars:
        verify_nft_dnat_rules: "{{ verify_nft_prerouting_chain.stdout_lines | select('search', ' dnat to ') | list }}"
      when: switches is defined

    - name: Get nft IPv6 prerouting chain
      ansible.builtin.command: nft list chain ip6 nat prerouting
      changed_when: false
      register: verify_nft6_prerouting_chain
      when: switches is defined and pib_network6_base is defined

    - name: Assert the IPv6 per-board DNAT rules are there and limited to the uplink interface
      ansible.builtin.assert:
        that:
          - verify_nft6_dnat_rules | length == 2 * (switches | port_vlan_map(pib_network, pib_network6_base) | length)
          - verify_nft6_dnat_rules | reject('search', 'iifname "' ~ eth_uplink ~ '"') | list | length == 0
        fail_msg: >-
          Expected one IPv6 DNAT rule per board port for ssh and aux, each limited to {{ eth_uplink }}; got:
          {{ verify_nft6_dnat_rules }}
      vars:
        verify_nft6_dnat_rules: "{{ verify_nft6_prerouting_chain.stdout_lines | select('search', ' dnat ') | list }}"
      when: switches is defined and pib_network6_base is defined

    - name: Check /etc/dnsmasq.d/ports.conf exists
      ansible.builtin.stat:
        path: /etc/dnsmasq.d/ports.conf
      register: verify_ports_conf_stat
      when: switches is defined

    - name: Assert /etc/dnsmasq.d/ports.conf exists
      ansible.builtin.assert:
        that: verify_ports_conf_stat.stat.exists
        fail_msg: "/etc/dnsmasq.d/ports.conf not found"
      when: switches is defined

    # NFS root package verification — check the packages the pulled
    # prebuilt image is supposed to carry (baked in by the CI build).
    - name: Check overlayroot installed in NFS root
      ansible.builtin.command: dpkg --root={{ nfs_root }}/root -l overlayroot
      changed_when: false
      register: verify_overlayroot
      failed_when: false

    - name: Assert overlayroot installed in NFS root
      ansible.builtin.assert:
        that: verify_overlayroot.rc == 0
        fail_msg: "overlayroot not installed in NFS root"

    # The hardware identity probe fpgas-verify runs on the boards, and the
    # i2c-tools it needs (roles/onpi, apt source roles/fpgas_apt).
    - name: Check python3-rpi-hwid installed in NFS root
      ansible.builtin.command: dpkg-query --admindir={{ nfs_root }}/root/var/lib/dpkg -W -f=${db:Status-Status} python3-rpi-hwid i2c-tools
      changed_when: false
      register: verify_nfsroot_rpi_hwid
      failed_when: false

    - name: Assert python3-rpi-hwid installed in NFS root
      ansible.builtin.assert:
        that: verify_nfsroot_rpi_hwid.stdout == "installedinstalled"
        fail_msg: >-
          python3-rpi-hwid and i2c-tools not both installed in the NFS root
          (got {{ verify_nfsroot_rpi_hwid.stdout }}, rc
          {{ verify_nfsroot_rpi_hwid.rc }}: {{ verify_nfsroot_rpi_hwid.stderr }})

    # Stale-NFS-root watchdog: the boards' half (nfsroot-watchdog, roles/onpi)
    # must be in the root, the server's half (nfsroot-watchdog-server,
    # roles/nfsroot_generation) on this host, and a finished site.yml run
    # must have released the update lock, or every board holds forever.
    - name: Check nfsroot-watchdog installed in NFS root
      ansible.builtin.command: dpkg-query --admindir={{ nfs_root }}/root/var/lib/dpkg -W -f=${db:Status-Status} nfsroot-watchdog busybox-static
      changed_when: false
      register: verify_nfsroot_watchdog
      failed_when: false

    - name: Assert nfsroot-watchdog installed in NFS root
      ansible.builtin.assert:
        that: verify_nfsroot_watchdog.stdout == "installedinstalled"
        fail_msg: >-
          nfsroot-watchdog and busybox-static not both installed in the NFS
          root (got {{ verify_nfsroot_watchdog.stdout }}, rc
          {{ verify_nfsroot_watchdog.rc }}: {{ verify_nfsroot_watchdog.stderr }})

    - name: Check nfsroot-watchdog-server installed on the server
      ansible.builtin.command: dpkg-query -W -f=${db:Status-Status} nfsroot-watchdog-server
      changed_when: false
      register: verify_nfsroot_watchdog_server
      failed_when: false

    - name: Assert nfsroot-watchdog-server installed on the server
      ansible.builtin.assert:
        that: verify_nfsroot_watchdog_server.stdout == "installed"
        fail_msg: "nfsroot-watchdog-server is not installed ({{ verify_nfsroot_watchdog_server.stderr }})"

    - name: Check the NFS root update lock
      ansible.builtin.stat:
        path: "{{ nfs_root }}/root/etc/nfsroot-watchdog/update.lock"
      register: verify_nfsroot_lock

    - name: Assert the NFS root update lock was released
      ansible.builtin.assert:
        that: not verify_nfsroot_lock.stat.exists
        fail_msg: >-
          {{ nfs_root }}/root/etc/nfsroot-watchdog/update.lock still exists:
          the last site.yml run did not finish, and no netbooted board will
          reboot itself for a stale root until one does.

    - name: Check nfs-common installed in NFS root
      ansible.builtin.command: dpkg --root={{ nfs_root }}/root -l nfs-common
      changed_when: false
      register: verify_nfs_common
      failed_when: false

    - name: Assert nfs-common installed in NFS root
      ansible.builtin.assert:
        that: verify_nfs_common.rc == 0
        fail_msg: "nfs-common not installed in NFS root"

    # NFS root config verification
    - name: Check pi user exists in NFS root
      ansible.builtin.command: "grep ^{{ user }}: {{ nfs_root }}/root/etc/passwd"
      changed_when: false
      register: verify_pi_user
      failed_when: false

    - name: Assert pi user exists in NFS root
      ansible.builtin.assert:
        that: verify_pi_user.rc == 0
        fail_msg: "User '{{ user }}' not found in NFS root /etc/passwd"

    - name: Check Pi authorized_keys exists
      ansible.builtin.stat:
        path: "{{ nfs_root }}/root/home/{{ user }}/.ssh/authorized_keys"
      register: verify_pi_authkeys

    - name: Assert Pi authorized_keys exists
      ansible.builtin.assert:
        that: verify_pi_authkeys.stat.exists
        fail_msg: "Pi authorized_keys not found at {{ nfs_root }}/root/home/{{ user }}/.ssh/authorized_keys"

    # The site layer fixpi applies on top of the pulled image (the image has
    # no site identity): without these the Pis boot but never register with
    # this site's fleet broker.
    - name: Check the site layer's files in the NFS root
      ansible.builtin.stat:
        path: "{{ nfs_root }}/root/etc/fpgas-online/{{ item }}"
      register: verify_site_layer
      loop: >-
        {{ ['fleet.toml'] if fleet_broker | default(false) else [] }}

    - name: Assert the site layer's files are in the NFS root
      ansible.builtin.assert:
        that: item.stat.exists
        fail_msg: "{{ nfs_root }}/root/etc/fpgas-online/{{ item.item }} missing -- fixpi's site layer did not run"
      loop: "{{ verify_site_layer.results }}"
      loop_control:
        label: "{{ item.item }}"

    # The onboard radios must be disabled in the read-only netboot image so the
    # setting is re-applied on every boot (see fixpi/tasks/tweeks.yml). On Pi 5
    # the firmware auto-remaps disable-wifi -> disable-wifi-pi5.
    - name: Check config.txt disables onboard Wi-Fi in NFS root
      ansible.builtin.command: grep -Fxq 'dtoverlay=disable-wifi' {{ nfs_root }}/boot/config.txt
      changed_when: false
      register: verify_disable_wifi
      failed_when: false

    - name: Assert config.txt disables onboard Wi-Fi in NFS root
      ansible.builtin.assert:
        that: verify_disable_wifi.rc == 0
        fail_msg: "dtoverlay=disable-wifi missing from {{ nfs_root }}/boot/config.txt — onboard Wi-Fi would not be disabled"

    # The bootloader EEPROM must be write-protected in the read-only netboot
    # image so the setting is re-applied on every boot (see fixpi/tasks/tweeks.yml
    # and docs/superpowers/runbooks/2026-08-31-eeprom-write-protect.md).
    - name: Check config.txt write-protects the EEPROM in NFS root
      ansible.builtin.command: grep -Fxq 'eeprom_write_protect=1' {{ nfs_root }}/boot/config.txt
      changed_when: false
      register: verify_eeprom_wp
      failed_when: false

    - name: Assert config.txt write-protects the EEPROM in NFS root
      ansible.builtin.assert:
        that: verify_eeprom_wp.rc == 0
        fail_msg: "eeprom_write_protect=1 missing from {{ nfs_root }}/boot/config.txt — bootloader EEPROM would be writable"

    # Full USB current on a Pi 5 on every port (fixpi tweeks.yml): the setup
    # port's tree, derived from this file, is checked to keep it below.
    - name: Read the fleet's config.txt
      ansible.builtin.slurp:
        src: "{{ nfs_root }}/boot/config.txt"
      register: verify_fleet_config

    - name: Assert a Pi 5 boots with its full USB current
      ansible.builtin.assert:
        that: "'[pi5]\nusb_max_current_enable=1\n[all]' in (verify_fleet_config.content | b64decode)"
        fail_msg: "{{ nfs_root }}/boot/config.txt does not set usb_max_current_enable=1 for [pi5]: a Pi 5 limits its USB to 600 mA"

    # The setup / config port's boot tree (roles/fixpi setup-port.yml,
    # docs/pi/setup-port.md): the fleet's, with the radios on, the EEPROM
    # unprotected and fpgas.setup_port=1, served to that port alone.
    - name: Read the setup port's boot tree
      ansible.builtin.slurp:
        src: "{{ setup_port_tftp_root }}/{{ item }}"
      loop: [config.txt, cmdline.txt, cmdline-pi5.txt]
      register: verify_setup_port_files
      when: setup_port is defined

    - name: Assert the setup port's boot tree lifts the restrictions
      ansible.builtin.assert:
        that:
          - "'eeprom_write_protect=0' in config"
          - "'eeprom_write_protect=1' not in config"
          - "'dtoverlay=disable-wifi' not in config"
          - "'dtoverlay=disable-bt' not in config"
          - "'dtparam=spi=on' in config"
          - "'dtparam=i2c_arm=on' in config"
          - "'usb_max_current_enable=1' in config"
          - "'fpgas.setup_port=1' in cmdline.split()"
          - "'fpgas.setup_port=1' in cmdline_pi5.split()"
          - "'systemd.restore_state=0' in cmdline.split()"
          - "'systemd.restore_state=0' in cmdline_pi5.split()"
        fail_msg: "{{ setup_port_tftp_root }} does not lift the fleet's restrictions"
      vars:
        config: "{{ (verify_setup_port_files.results[0].content | b64decode).splitlines() }}"
        cmdline: "{{ verify_setup_port_files.results[1].content | b64decode }}"
        cmdline_pi5: "{{ verify_setup_port_files.results[2].content | b64decode }}"
      when: setup_port is defined

    # Names, links and contents: the setup tree is the fleet's but for the three
    # files it derives (diff exits 1 when trees differ, 2 on trouble).
    - name: Compare the setup port's boot tree with the fleet's
      ansible.builtin.command: diff -rq --no-dereference {{ tftp_root }} {{ setup_port_tftp_root }}
      register: verify_setup_port_diff
      changed_when: false
      failed_when: >-
        verify_setup_port_diff.rc not in [0, 1]
        or (verify_setup_port_diff.stdout_lines | sort) != ([
          'Files ' ~ tftp_root ~ '/cmdline-pi5.txt and ' ~ setup_port_tftp_root ~ '/cmdline-pi5.txt differ',
          'Files ' ~ tftp_root ~ '/cmdline.txt and ' ~ setup_port_tftp_root ~ '/cmdline.txt differ',
          'Files ' ~ tftp_root ~ '/config.txt and ' ~ setup_port_tftp_root ~ '/config.txt differ'] | sort)
      when: setup_port is defined

    - name: Read dnsmasq's per-port config
      ansible.builtin.slurp:
        src: /etc/dnsmasq.d/ports.conf
      register: verify_setup_port_dnsmasq
      when: setup_port is defined

    # Exactly the setup port's VLAN of each switch, and no other port.
    - name: Assert dnsmasq serves the setup port alone its boot tree, on every switch
      ansible.builtin.assert:
        that: served == wanted
        fail_msg: "ports.conf serves {{ setup_port_tftp_root }} on {{ served }}, not on {{ wanted }}"
      vars:
        served: >-
          {{ (verify_setup_port_dnsmasq.content | b64decode).splitlines()
             | select('match', '^tftp-root=') | list | sort }}
        wanted: >-
          {{ switches | port_vlan_map(pib_network, pib_network6_base)
             | selectattr('port', 'equalto', setup_port)
             | map(attribute='iface') | map('regex_replace', '^', 'tftp-root=' ~ setup_port_tftp_root ~ ',')
             | list | sort }}
      when: setup_port is defined


- name: Verify uhubctl
  hosts: uhubctl
  become: true
  tasks:
    - name: Verify uhubctl
      ansible.builtin.include_role:
        name: uhubctl
        tasks_from: verify/main.yml

- name: Verify web roles (pig)
  hosts: pig
  become: true
  tasks:
    - name: Verify server_user
      ansible.builtin.include_role:
        name: server_user
        tasks_from: verify/main.yml

    - name: Verify site
      ansible.builtin.include_role:
        name: site
        tasks_from: verify/main.yml

    - name: Verify ttsite
      ansible.builtin.include_role:
        name: ttsite
        tasks_from: verify/main.yml
      when: tt_boards is defined

    - name: Verify wssh
      ansible.builtin.include_role:
        name: wssh
        tasks_from: verify/main.yml

    - name: Verify stream_server
      ansible.builtin.include_role:
        name: stream_server
        tasks_from: verify/main.yml

    - name: Verify webrtc
      ansible.builtin.include_role:
        name: webrtc
        tasks_from: verify/main.yml
      when: webrtc_additional_hosts is defined
