# --- tinytapeout.fpgas.online (ttsite role; spec in docs/superpowers/specs) --
# Board catalogue rendered to /etc/fpgas-online/tt-boards.yaml on tweed (read
# by `manage.py ttsite_loadboards`) and into the Pi NFS root (read by the
# fpgas-tt daemon).  Network identity is DERIVED from (switch, port):
# Pi = 10.21.<switch>.<port>, hostname pi-sw<switch>-p<port>.  The Tiny
# Tapeout slots are the S3300 (switch index 2) ports 1-10: port N carries TTN
# (pi-sw2-pN <-> ttN, Tim 2026-08-23).  Slots without a Pi are enabled: false
# ("coming soon") until one is plugged in.
tt_boards:
  - {slug: tt01, switch: 2, port: 1, kind: asic, shuttle: tt01, title: "Tiny Tapeout 1", enabled: false}
  - {slug: tt02, switch: 2, port: 2, kind: asic, shuttle: tt02, title: "Tiny Tapeout 2", enabled: false}
  # pi-sw2-p3's demo board boots MicroPython 1.22.2 but the TT SDK does not come
  # up (`tt` is None, no read_rom) -- the Commander cannot drive it; disabled
  # until its firmware is fixed (2026-08-23).
  - {slug: tt03, switch: 2, port: 3, kind: asic, shuttle: tt03, title: "Tiny Tapeout 3", enabled: false,
     blurb: "TT03 (sky130) on a demo board", pcb: "TT demo board (RP2040)",
     description: "Present but its demo-board firmware does not initialise the TT SDK yet; coming back once reflashed."}
  - {slug: tt04, switch: 2, port: 4, kind: asic, shuttle: tt04, title: "Tiny Tapeout 4",
     blurb: "TT04 (sky130) on a demo board", pcb: "TT demo board (RP2040)"}
  - {slug: tt05, switch: 2, port: 5, kind: asic, shuttle: tt05, title: "Tiny Tapeout 5",
     blurb: "TT05 (sky130) on a demo board", pcb: "TT demo board (RP2040)"}
  - {slug: tt06, switch: 2, port: 6, kind: asic, shuttle: tt06, title: "Tiny Tapeout 6",
     blurb: "TT06 (sky130) on a demo board", pcb: "TT demo board (RP2040)"}
  - {slug: tt07, switch: 2, port: 7, kind: asic, shuttle: tt07, title: "Tiny Tapeout 7",
     blurb: "TT07 (sky130) on a demo board", pcb: "TT demo board (RP2040)"}
  - {slug: tt08, switch: 2, port: 8, kind: asic, shuttle: tt08, title: "Tiny Tapeout 8",
     blurb: "TT08 (sky130) on a demo board", pcb: "TT demo board (RP2040)"}
  - {slug: tt09, switch: 2, port: 9, kind: asic, shuttle: tt09, title: "Tiny Tapeout 9", enabled: false}
  - {slug: tt10, switch: 2, port: 10, kind: asic, shuttle: tt10, title: "Tiny Tapeout 10", enabled: false}
  - {slug: kianv-1, port: null, kind: kianv, shuttle: tt06, title: "KianV uLinux SoC (TT06)",
     blurb: "Boots Linux on the TT06 KianV RISC-V SoC", sort_order: 20,
     pmods: [{name: "QSPI Pmod", url: "https://github.com/mole99/qspi-pmod", note: "flash + PSRAM"}],
     links: [{label: "Project page", url: "https://tinytapeout.com/chips/tt06/tt_um_kianV_rv32ima_uLinux_SoC/"}]}
  - {slug: kianv-2, port: null, kind: kianv, shuttle: "", title: "KianV RISC-V (second board)", sort_order: 21}
  # The four FPGA emulation boards sit on S3300 ports 33-36 (pi-sw2-p33..p36):
  # TT demo board v3 (RP2350) with the FabricFox FPGA breakout.  Reflashed to
  # SDK 3.1.0 on 2026-08-23 (the shipped ttdbv3 build stalled at boot); with
  # 3.1.0 the SDK comes up in FPGA mode and the Commander connects (REPL /
  # Interact / pinout; the project list is empty until the FPGA shuttle index
  # and bitstream loading land in phase 2).
  - {slug: fpga-1, switch: 2, port: 33, kind: fpga, title: "TT FPGA emulation board 1", sort_order: 30,
     description: "TT demo board v3 (RP2350, SDK 3.1.0) with the FabricFox FPGA breakout (S3300 port 33).
       Bitstream loading arrives in phase 2; the Commander talks to the FPGA's factory-test design today.",
     blurb: "iCE40UP5K ASIC simulator on a demo board", pcb: "TT FPGA breakout (iCE40UP5K) on TT demo board"}
  - {slug: fpga-2, switch: 2, port: 34, kind: fpga, title: "TT FPGA emulation board 2", sort_order: 31,
     description: "TT demo board v3 (RP2350, SDK 3.1.0) with the FabricFox FPGA breakout (S3300 port 34).
       Bitstream loading arrives in phase 2; the Commander talks to the FPGA's factory-test design today.",
     blurb: "iCE40UP5K ASIC simulator on a demo board", pcb: "TT FPGA breakout (iCE40UP5K) on TT demo board"}
  - {slug: fpga-3, switch: 2, port: 35, kind: fpga, title: "TT FPGA emulation board 3", sort_order: 32,
     description: "TT demo board v3 (RP2350, SDK 3.1.0) with the FabricFox FPGA breakout (S3300 port 35).
       Bitstream loading arrives in phase 2; the Commander talks to the FPGA's factory-test design today.",
     blurb: "iCE40UP5K ASIC simulator on a demo board", pcb: "TT FPGA breakout (iCE40UP5K) on TT demo board"}
  - {slug: fpga-4, switch: 2, port: 36, kind: fpga, title: "TT FPGA emulation board 4", sort_order: 33,
     description: "TT demo board v3 (RP2350, SDK 3.1.0) with the FabricFox FPGA breakout (S3300 port 36).
       Bitstream loading arrives in phase 2; the Commander talks to the FPGA's factory-test design today.",
     blurb: "iCE40UP5K ASIC simulator on a demo board", pcb: "TT FPGA breakout (iCE40UP5K) on TT demo board"}

