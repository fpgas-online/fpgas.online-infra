eth_uplink_mac_address: 0c:c4:7a:16:3b:4b
eth_uplink_static: false
# for the firewall:
eth_uplink_static_address: 198.0.220.197

# The internal NIC (MAC eth_local_mac_address) is renamed to "eth-local" by a
# MAC-matched systemd .link file on tweed. The vlan-ports / pxe / firewall
# templates reference this interface by the eth_local variable (not a hardcoded
# name) so the same roles work in the QEMU VM test, where the interface is
# enp0s3 (see tests/inventory/host_vars/test-vm.yml).
eth_local: eth-local
eth_local_mac_address: 0c:c4:7a:16:3b:4a
eth_local_address: 10.21.0.1
# /16, not /24: in the per-port VLAN scheme the local net is the whole
# 10.21.0.0/16 supernet -- Pi IPs are 10.21.<switch>.<port> (e.g. sw1 p1 =
# 10.21.1.1), which fall outside 10.21.0.0/24. This netmask feeds the NFS
# export (roles/nfs/templates/exports.j2) and the camera publish ACL, both
# of which must admit every port's Pi. The eth-local trunk interface address
# itself stays /24 (hardcoded in vlan-ports/templates/eth-local.network.j2).
eth_local_netmask: 16
# dhcp_range intentionally absent: this host defines `switches` (per-port
# addressing), so dnsmasq-base.conf.j2 skips the bare pool range and every
# port gets its own dhcp-range from ports.conf.j2 instead. Hosts still on
# the legacy MAC-table scheme (ps1.fpgas.online, tests/inventory/host_vars/
# test-vm.yml) keep their own dhcp_range.

pib_network: "10.21"
pib_network6_base: "2404:e80:a137:21"
pib_domain: fpgas.welland.mithis.com

# Per-port VLAN map source of truth (Tasks 8/9/10 derive networkd/dnsmasq/
# firewall config from this via the port_vlan_map filter). Trunk port
# numbers below are placeholders — Tim confirms exact cabling at hardware
# prototype time (Task 14).
#
# snmp_rw_community: per-switch SNMP write community consumed by the
# switch-vlans role (env FPGAS_SWITCH_COMMUNITY -> fpgas-switch-setup). The
# s3300 and the GSM7252PS use DIFFERENT community strings, so each switch
# gets its own vault var -- never write a real community string in
# plaintext here, this repo is public. Defined (vaulted) below:
#   vault_switch1_snmp_rw_community  (gsm7252ps-s2, index 1, 10.1.5.23 -> "private")
#   vault_switch2_snmp_rw_community  (s3300,        index 2, 10.1.5.11 -> "pib")
# The VM test never evaluates these (switches_manage: false skips the role).
# Trunk/port numbers below are the REAL welland cabling, confirmed 2026-08-22
# from the switches' own LLDP/SNMP (not faceplate guesses):
#   tweed eth-local  -> GSM7252PS-s2 (10.1.5.23) port 1/0/47   [gateway trunk]
#   tweed eth-uplink -> GSM7252PS-s2 port 1/0/48
#   tweed BMC        -> GSM7252PS-s2 port 1/0/46  (kept OUT of access range)
#   GSM7252PS-s2 1/0/50 <-> S3300 1/xg51          [inter-switch trunk]
#   GSM7252PS-s2 1/0/49 & 1/0/51 -> gsm7252ps-s1  (NOT fpgas; never touched)
# The gateway (tweed) attaches to the GSM7252PS-s2, so it is the HEAD switch
# (index 1); the S3300 is downstream (index 2). Ports are the switches' own
# linear 1..52 index (library port_count=52); on the S3300 "1/xg51" = port 51.
switches:
  - index: 1                      # GSM7252PS-s2 — HEAD (tweed eth-local trunks here)
    model: gsm7252ps
    mgmt_host: "10.1.5.23"
    access_ports: 40              # 1/0/1-40 only; 41+ reserved for special items
    gateway_trunk_port: 47        # tweed eth-local
    downstream_trunk_ports: [50]  # -> S3300 (GSM 1/0/50 <-> S3300 1/xg51)
    house_uplink_port: 48         # tweed eth-uplink (informational; not used by plan)
    snmp_rw_community: "{{ vault_switch1_snmp_rw_community }}"
  - index: 2                      # S3300 (gsm7228ps) — downstream
    model: s3300
    mgmt_host: "10.1.5.11"
    access_ports: 48              # kept at 48 for now (Pis on 42-47); recable to 1-40 later
    gateway_trunk_port: 51        # 1/xg51 -> GSM 1/0/50
    downstream_trunk_ports: []
    house_uplink_port: 52
    snmp_rw_community: "{{ vault_switch2_snmp_rw_community }}"

