# --- tinytapeout.fpgas.online (ttsite role; spec in docs/superpowers/specs) --
# Board catalogue rendered to /etc/fpgas-online/tt-boards.yaml on tweed (read
# by `manage.py ttsite_loadboards`) and into the Pi NFS root (read by the
# fpgas-tt daemon).  Network identity is DERIVED from (switch, port):
# Pi = 10.21.<switch>.<port>, hostname pi-sw<switch>-p<port>.  The Tiny
# Tapeout slots are the S3300 (switch index 2) ports 1-10: port N carries TTN
# (pi-sw2-pN <-> ttN, Tim 2026-08-23).  Slots without a Pi are enabled: false
# ("coming soon") until one is plugged in.
tt_boards:
  # pi-sw2-p3 carries a Tiny Tapeout 3.5 chip. Reflashed 2026-08-24 to demo-board
  # firmware v1.2.2 (the newest release supporting tt03p5 -- SDK 2.x dropped it);
  # boots into tt_um_test with the full 27-project mux working over serial.
  # Stays disabled until the Commander fork supports SDK 1.2.x (it currently
  # requires >= 2.0.0RC2 and would offer a firmware "update" that breaks the board).
  - {slug: tt03p5, switch: 2, port: 3, kind: asic, shuttle: tt03p5, title: "Tiny Tapeout 3.5", enabled: false,
     blurb: "TT03p5 (sky130) on a demo board", pcb: "TT demo board (RP2040)",
     description: "TT 3.5 chip on demo-board firmware v1.2.2 (the last release supporting this shuttle).
       The 27-project mux works over the serial REPL; the web Commander needs a compatibility
       update before this board goes live."}
