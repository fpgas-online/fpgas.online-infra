# tinytapeout.fpgas.online is a CNAME for welland.fpgas.online; TLS is
# terminated on tweed (ten64's SNI router lists the name since 2026-08-23 via
# the gdoc2netcfg alias on tweed's row), so certbot runs here (webroot http-01
# through ten64's /.well-known/ passthrough).
ttsite_certbot: true
