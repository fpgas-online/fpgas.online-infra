---

# --- How Ansible reaches tweed (2026-08-23) ---------------------------------
# tweed is NOT publicly addressable by itself: its web interface is published
# by the nginx reverse proxy / SNI router on ten64.welland.mithis.com
# (generated by gdoc2netcfg) under tweed.welland.mithis.com and
# welland.fpgas.online.  Ansible runs from inside the Welland network (ten64)
# and connects to tweed's private uplink address as the dedicated `ansible`
# user (NOPASSWD sudo, key ansible@hetzner-infrastructure), never as root.
ansible_host: 10.99.21.2
ansible_user: ansible
ansible_become: true

eth_uplink_mac_address: 0c:c4:7a:16:3b:4b
eth_uplink_static: false
# for the firewall (DNAT targets) and Django ALLOWED_HOSTS: tweed's uplink
# address on the ten64 <-> tweed link (10.99.21.0/30); ten64 NATs the public
# side. (Was 198.0.220.197, a long-gone public IP.)
eth_uplink_static_address: 10.99.21.2

eth_local_mac_address: 0c:c4:7a:16:3b:4a
eth_local_address: 10.21.0.1
eth_local_netmask: 24
dhcp_range: 10.21.0.128,10.21.0.254,6h

pib_network: 10.21.0

firewall_internal_networks: [10.21.0.0/24]

user_name: videoteam

conference_name: pib
room_name: k207

time_zone: America/Los_Angeles

# Public names of this server's web interface.  Both are served by ten64's
# reverse proxy (HTTP) / SNI passthrough (HTTPS, so tweed terminates TLS with
# its own Let's Encrypt certs; http-01 challenges flow through ten64's
# /.well-known/acme-challenge/ passthrough).  fpgas.online itself points at
# the PS1 site, not here.
common_name: welland.fpgas.online
subject_alt_names:
  - tweed.welland.mithis.com

streaming_frontend_aliases:
  - tweed.welland.mithis.com
  - .tweed.welland.mithis.com   # eth-local./eth-uplink./ipv4./ipv6. variants (Django wildcard)
streaming_frontend_hostname: welland.fpgas.online
domain_name: "{{ streaming_frontend_hostname }}"

fixture_path: fpgas.online.json

