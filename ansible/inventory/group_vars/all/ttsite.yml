---
# tinytapeout.fpgas.online (ttsite role).  Hosts that do not define tt_boards
# skip the role entirely (see ansible/web.yml).
ttsite_domain: tinytapeout.fpgas.online
# Request a Let's Encrypt cert with certbot --nginx (needs the name to reach
# this host on :80 for http-01); the VM test sets this false and serves the
# vhost over plain HTTP.
ttsite_certbot: true
# Commander embed bundle from fpgas-online/tt-commander-app releases
# (tag embed-v<ver>).  Empty version => not deployed; Django shows a notice.
tt_commander_embed_version: ""
tt_commander_embed_sha256: ""
# Legacy Commander embed (tag legacy-embed-v<ver>): the SDK-agnostic build
# for boards whose catalogue row says `commander: legacy` (pre-2.x-firmware
# chips — tt03p5).  Same empty-version semantics as above.
tt_commander_legacy_embed_version: ""
tt_commander_legacy_embed_sha256: ""
