---
# Site identity for the Welland site (gateway host: tweed / fpgas.online).
# Introduced by the tweed split Phase 0 (tweed-split-design
# docs/07-pr-contract.md, PR 2 "split-prep"): site-scoped vars live here in
# group_vars so the future gateway service and web tier can share them;
# host_vars keep the host-specific material (switches, vaulted secrets).
site_id: welland
site_name: "Welland"
site_location: "Welland, South Australia"
site_timezone: Australia/Adelaide
gw_domain_name: gw.welland.fpgas.online

# --- tinytapeout.fpgas.online (ttsite role; spec in docs/superpowers/specs) --
# Board catalogue rendered to /etc/fpgas-online/tt-boards.yaml on tweed (read
# by `manage.py ttsite_loadboards`) and into the Pi NFS root (read by the
# fpgas-tt daemon).  Network identity is DERIVED from (switch, port):
# Pi = 10.21.<switch>.<port>, hostname pi-sw<switch>-p<port>.  The Tiny
# Tapeout slots are the S3300 (switch index 2) ports 1-10: port N carries TTN
# (pi-sw2-pN <-> ttN, Tim 2026-08-23).  Slots without a Pi are enabled: false
# ("coming soon") until one is plugged in.
tt_boards:
  # pi-sw2-p3 carries a Tiny Tapeout 3.5 chip. Reflashed 2026-08-24 to demo-board
  # firmware v1.2.2 (the newest release supporting tt03p5 -- SDK 2.x dropped it);
  # boots into tt_um_test with the full 27-project mux working over serial.
  # Enabled 2026-08-31 (camera-first, Tim): the page is live for the video feed
  # while the Commander still lacks SDK 1.2.x support (it requires >= 2.0.0RC2
  # and must never offer this board its 2.x firmware "update") -- see
  # fpgas-online/tt-commander-app#9 for the legacy-branch port that fixes this.
  - {slug: tt03p5, switch: 2, port: 3, kind: asic, shuttle: tt03p5, title: "Tiny Tapeout 3.5",
     blurb: "TT03p5 (sky130) on a demo board", pcb: "TT demo board (RP2040)",
     description: "TT 3.5 chip on demo-board firmware v1.2.2 (the last release supporting this shuttle).
       The 27-project mux works over the serial REPL; the web Commander does not support this
       firmware generation yet, so for now this page is camera-only."}
  - {slug: tt04, switch: 2, port: 4, kind: asic, shuttle: tt04, title: "Tiny Tapeout 4",
     blurb: "TT04 (sky130) on a demo board", pcb: "TT demo board (RP2040)"}
  - {slug: tt05, switch: 2, port: 5, kind: asic, shuttle: tt05, title: "Tiny Tapeout 5",
     blurb: "TT05 (sky130) on a demo board", pcb: "TT demo board (RP2040)"}
  - {slug: tt06, switch: 2, port: 6, kind: asic, shuttle: tt06, title: "Tiny Tapeout 6",
     blurb: "TT06 (sky130) on a demo board", pcb: "TT demo board (RP2040)"}
  - {slug: tt07, switch: 2, port: 7, kind: asic, shuttle: tt07, title: "Tiny Tapeout 7",
     blurb: "TT07 (sky130) on a demo board", pcb: "TT demo board (RP2040)"}
  - {slug: tt08, switch: 2, port: 8, kind: asic, shuttle: tt08, title: "Tiny Tapeout 8",
     blurb: "TT08 (sky130) on a demo board", pcb: "TT demo board (RP2040)"}
  - {slug: tt09, switch: 2, port: 9, kind: asic, shuttle: tt09, title: "Tiny Tapeout 9", enabled: false}
  - {slug: tt10, switch: 2, port: 10, kind: asic, shuttle: tt10, title: "Tiny Tapeout 10", enabled: false}
  - {slug: ttgf, port: null, kind: asic, shuttle: "", title: "Tiny Tapeout GF",
     blurb: "GF180MCU Tiny Tapeout chips",
     description: "The GlobalFoundries 180MCU Tiny Tapeout runs: ttgf0p1, ttgf0p2, ttgf0p3, ttgf26a and ttgf26b.",
     links: [{label: "ttgf0p2 chip page", url: "https://tinytapeout.com/chips/ttgf0p2/"},
             {label: "ttgf0p3 chip page", url: "https://tinytapeout.com/chips/ttgf0p3/"},
             {label: "ttgf26a chip page", url: "https://tinytapeout.com/chips/ttgf26a/"},
             {label: "ttgf26b chip page", url: "https://tinytapeout.com/chips/ttgf26b/"}]}
  # One box per sky130/GF Tiny Tapeout chip that carries a KianV instance
  # (per index.tinytapeout.com; IHP and ttcad chips intentionally excluded).
  - {slug: kianv-tt05, port: null, kind: kianv, shuttle: tt05, title: "KianV uLinux SoC (TT05)",
     blurb: "Boots Linux on the TT05 KianV RISC-V SoC", sort_order: 20,
     pmods: [{name: "QSPI Pmod", url: "https://github.com/mole99/qspi-pmod", note: "flash + PSRAM"}],
     links: [{label: "Project page", url: "https://tinytapeout.com/chips/tt05/tt_um_kianV_rv32ima_uLinux_SoC/"}]}
  - {slug: kianv-tt06, port: null, kind: kianv, shuttle: tt06, title: "KianV uLinux SoC (TT06)",
     blurb: "Boots Linux on the TT06 KianV RISC-V SoC", sort_order: 21,
     pmods: [{name: "QSPI Pmod", url: "https://github.com/mole99/qspi-pmod", note: "flash + PSRAM"}],
     links: [{label: "Project page", url: "https://tinytapeout.com/chips/tt06/tt_um_kianV_rv32ima_uLinux_SoC/"}]}
  - {slug: kianv-tt07, port: null, kind: kianv, shuttle: tt07, title: "KianV RV32E Baremetal (TT07)",
