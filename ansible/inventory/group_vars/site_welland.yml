  - {slug: kianv-ttgf0p1, port: null, kind: kianv, shuttle: ttgf0p1, title: "KianV uLinux SoC (ttGF0p1)",
     blurb: "Boots Linux on the ttGF0p1 KianV RISC-V SoC", sort_order: 23,
     pmods: [{name: "QSPI Pmod", url: "https://github.com/mole99/qspi-pmod", note: "flash + PSRAM"}],
     links: [{label: "Project page", url: "https://tinytapeout.com/chips/ttgf0p1/tt_um_kianV_rv32ima_uLinux_SoC/"}]}
  - {slug: kianv-ttgf0p2, port: null, kind: kianv, shuttle: ttgf0p2, title: "KianV uLinux SoC (ttGF0p2)",
     blurb: "Boots Linux on the ttGF0p2 KianV RISC-V SoC", sort_order: 24,
     pmods: [{name: "QSPI Pmod", url: "https://github.com/mole99/qspi-pmod", note: "flash + PSRAM"}],
     links: [{label: "Project page", url: "https://tinytapeout.com/chips/ttgf0p2/tt_um_kianV_rv32ima_uLinux_SoC/"}]}
  - {slug: kianv-ttgf0p3, port: null, kind: kianv, shuttle: ttgf0p3, title: "KianV uLinux SoC (ttGF0p3)",
     blurb: "Boots Linux on the ttGF0p3 KianV RISC-V SoC", sort_order: 25,
     pmods: [{name: "QSPI Pmod", url: "https://github.com/mole99/qspi-pmod", note: "flash + PSRAM"}],
     links: [{label: "Project page", url: "https://tinytapeout.com/chips/ttgf0p3/tt_um_kianV_rv32ima_uLinux_SoC/"}]}
  - {slug: kianv-ttsky25a, port: null, kind: kianv, shuttle: ttsky25a, title: "KianV uLinux SoC (ttSky25a)",
     blurb: "Boots Linux on the ttSky25a KianV RISC-V SoC", sort_order: 26,
     pmods: [{name: "QSPI Pmod", url: "https://github.com/mole99/qspi-pmod", note: "flash + PSRAM"}],
     links: [{label: "Project page", url: "https://tinytapeout.com/chips/ttsky25a/tt_um_kianV_rv32ima_uLinux_SoC/"}]}
  - {slug: kianv-ttsky25b, port: null, kind: kianv, shuttle: ttsky25b, title: "KianV trio (ttSky25b)", sort_order: 27,
     blurb: "Three KianV designs: uLinux SoC, RV32E baremetal, and the regfile edition",
     pmods: [{name: "QSPI Pmod", url: "https://github.com/mole99/qspi-pmod", note: "flash + PSRAM"}],
     links: [{label: "uLinux SoC", url: "https://tinytapeout.com/chips/ttsky25b/tt_um_kianV_rv32ima_uLinux_SoC/"},
             {label: "RV32E baremetal", url: "https://tinytapeout.com/chips/ttsky25b/tt_um_kianv_bare_metal/"},
             {label: "regfile edition", url: "https://tinytapeout.com/chips/ttsky25b/tt_um_kianv_rv32_regfile/"}]}
  # The four FPGA emulation boards sit on S3300 ports 33-36 (pi-sw2-p33..p36):
  # TT demo board v3 (RP2350) with the FabricFox FPGA breakout.  Reflashed to
  # SDK 3.1.0 on 2026-08-23 (the shipped ttdbv3 build stalled at boot); with
  # 3.1.0 the SDK comes up in FPGA mode. Phase 2 (2026-08-24): the Pi daemon
  # lists/enables/uploads bitstreams (/designs), the site shows the gallery and
  # the Commander's project list follows the daemon.
  - {slug: fpga-1, switch: 2, port: 33, kind: fpga, title: "TT FPGA emulation board 1", sort_order: 30,
     description: "TT demo board v3 (RP2350, SDK 3.1.0) with the FabricFox FPGA breakout (S3300 port 33).
       Run one of the bundled demo designs or upload your own iCE40UP5K bitstream from this page; the Commander follows the loaded design.",
     blurb: "iCE40UP5K ASIC simulator on a demo board", pcb: "TT FPGA breakout (iCE40UP5K) on TT demo board"}
  - {slug: fpga-2, switch: 2, port: 34, kind: fpga, title: "TT FPGA emulation board 2", sort_order: 31,
     description: "TT demo board v3 (RP2350, SDK 3.1.0) with the FabricFox FPGA breakout (S3300 port 34).
       Run one of the bundled demo designs or upload your own iCE40UP5K bitstream from this page; the Commander follows the loaded design.",
     blurb: "iCE40UP5K ASIC simulator on a demo board", pcb: "TT FPGA breakout (iCE40UP5K) on TT demo board"}
  - {slug: fpga-3, switch: 2, port: 35, kind: fpga, title: "TT FPGA emulation board 3", sort_order: 32,
     description: "TT demo board v3 (RP2350, SDK 3.1.0) with the FabricFox FPGA breakout (S3300 port 35).
       Run one of the bundled demo designs or upload your own iCE40UP5K bitstream from this page; the Commander follows the loaded design.",
     blurb: "iCE40UP5K ASIC simulator on a demo board", pcb: "TT FPGA breakout (iCE40UP5K) on TT demo board"}
  - {slug: fpga-4, switch: 2, port: 36, kind: fpga, title: "TT FPGA emulation board 4", sort_order: 33,
     description: "TT demo board v3 (RP2350, SDK 3.1.0) with the FabricFox FPGA breakout (S3300 port 36).
       Run one of the bundled demo designs or upload your own iCE40UP5K bitstream from this page; the Commander follows the loaded design.",
