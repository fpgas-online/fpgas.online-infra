---
# The server's web interface: Django site, web SSH, camera stream front end
# and (when the host carries Tiny Tapeout boards) tinytapeout.fpgas.online.
# Imported by site.yml; run on its own to (re)deploy just the web tier:
#   uv run ansible-playbook ansible/web.yml --limit fpgas.online
- hosts: pig
  roles:
    - site
    - wssh
    - cam/stream-server
    # fleet self-registration broker (fpgas.online-infra#47): guarded so
    # hosts without fleet vars (CI variants, future sites) skip cleanly
    - {role: mqtt, when: fleet_broker | default(false), tags: [mqtt, fleet]}
    # ttsite deploys INTO the site role's Django install (manage.py, venv),
    # so it carries the django tag as well: `--skip-tags django` (the VM test's
    # default) must skip it too, or it fails on a host with no Django deploy.
    - {role: ttsite, when: tt_boards is defined, tags: [django, ttsite]}
