---
# The server's web interface: Django site, web SSH, camera stream front end
# and (when the host carries Tiny Tapeout boards) tinytapeout.fpgas.online.
# Imported by site.yml; run on its own to (re)deploy just the web tier:
#   uv run ansible-playbook ansible/web.yml --limit fpgas.online
- name: Deploy the web tier
  hosts: pig
  roles:
    # The server's own account (and its rename) before anything that
    # runs as it or reads its key:
    # site here, fixpi in site.yml's last play.
    - server_user
    - site
    - wssh
    - stream_server
    # fleet self-registration broker (fpgas.online-infra#47): guarded so
    # hosts without fleet vars (CI variants, future sites) skip cleanly
    - {role: mqtt, when: fleet_broker | default(false)}
    # WebRTC/WHEP leg (mediamtx). Switched on per host by defining
    # webrtc_additional_hosts (the ICE candidates to advertise); ps1 sits
    # behind CGNAT where the media port cannot be forwarded, so only tweed
    # (and the CI test-vm) define it.
    - {role: webrtc, when: webrtc_additional_hosts is defined}
    # ttsite deploys INTO the site role's Django install (manage.py, venv),
    # so it comes after site.
    - {role: ttsite, when: tt_boards is defined}
