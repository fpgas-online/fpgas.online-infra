---
- hosts: nbp
  roles:
    - netif
    - operators
    - lldp
    - firewall
    - {role: vlan-ports, when: switches is defined}
    - {role: switch-vlans, when: switches is defined}
    - nfs
    - img
    - fixpi
    - pxe

- hosts: uhubctl
  roles:
    - uhubctl

# Web tier (site, wssh, cam/stream-server, ttsite) -- see web.yml.
- import_playbook: web.yml

# The Pi NFS root arrives prebuilt from GHCR via the img role (issue #34):
# CI builds and publishes it (.github/workflows/nfsroot-build.yml), the
# server pulls and extracts it, and fixpi applies the site layer on top.
# The old on-server nspawn/chroot provisioning path was removed with it.
