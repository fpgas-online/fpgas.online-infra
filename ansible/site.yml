---
- hosts: nbp
  roles:
    - netif
    - operators
    - lldp
    - firewall
    - {role: vlan-ports, when: switches is defined}
    - {role: switch-vlans, when: switches is defined}
    - nfs
    - img
    - fixpi
    - pxe

- hosts: uhubctl
  roles:
    - uhubctl

# Web tier (site, wssh, cam/stream-server, ttsite) -- see web.yml.
- import_playbook: web.yml

# Pi NFS root provisioning via nspawn+sshd chroot.
# The server starts a systemd-nspawn container with sshd on the Pi NFS root,
# Pi roles run against it via SSH (qemu-user-static ARM emulation), then the
# container is stopped. This bakes all Pi config into the NFS root so Pis
# boot read-only with everything pre-installed.
- hosts: nbp
  tasks:
    - name: start nspawn+sshd on Pi NFS root
      include_role:
        name: nspawn-pi
        tasks_from: start.yml
      tags: [pi]

- hosts: pi
  roles:
    - role: fpgas-apt
      tags: [fpgas-apt]
    - role: cam/pi
      tags: [cam]
    - role: onpi
      tags: [onpi]

- hosts: nbp
  tasks:
    - name: stop nspawn+sshd
      include_role:
        name: nspawn-pi
        tasks_from: stop.yml
      tags: [pi]

    # The chroot plays above need the SERVER's resolvers baked into the NFS
    # root (fixpi's "ensure DNS resolution works in chroot"), but they must
    # not survive into the booted Pi: trixie's systemd-resolved reads a
    # foreign /etc/resolv.conf as its UPSTREAM DNS config, so the Pi ended
    # up querying the server VM's unreachable resolver (10.0.2.3) and every
    # stray lookup stalled for tens of seconds (CI round 6).  Point it at
    # the server's dnsmasq instead — the same address DHCP advertises.
    - name: point the baked NFS-root resolv.conf at the Pi-network DNS
      copy:
        content: "nameserver {{ eth_local_address | default('10.21.0.1') }}\n"
        dest: "{{ nfs_root }}/root/etc/resolv.conf"
        mode: "0644"
      tags: [pi]
