---
- hosts: nbp
  roles:
    - netif

# The Pi NFS root image is several GB: start pulling it now (after netif,
# which may reboot the server) so the download overlaps everything up to
# the root's extraction below, which waits for it.
# Facts gathered by the first play hold for the rest of the run (netif
# re-gathers them itself after a reboot), so later nbp plays skip gathering.
- hosts: nbp
  gather_facts: false
  tasks:
    - name: start pulling the Pi NFS root image
      include_role:
        name: img
        tasks_from: prefetch.yml
      tags: [img]

- hosts: nbp
  gather_facts: false
  roles:
    - operators
    - jump
    - lldp
    - firewall
    - {role: vlan_ports, when: switches is defined}
    - {role: switch_vlans, when: switches is defined}
    - nfs
    - apt_cache
    # dnsmasq (DHCP/TFTP) before the web tier: site's pistat drops its
    # config into /etc/dnsmasq.d. It serves the root's boot/ dir, which nfs
    # has created (empty on a fresh server) and the last play fills.
    - pxe

- hosts: uhubctl
  roles:
    - uhubctl

# Web tier (site, wssh, cam/stream_server, ttsite) -- see web.yml.
- import_playbook: web.yml

# The Pi NFS root last: every service the Pis boot against is in place
# before the root they boot changes, and the image pull has had the whole
# run to finish.
- hosts: nbp
  gather_facts: false
  tasks:
    # Hold the netbooted boards' self-reboot (nfsroot-watchdog, installed in
    # the root by roles/onpi) from here until nfsroot_generation below:
    # img, apt_cache and fixpi all change the root, and a board must never
    # reboot into it half-built. Tagged always, so a tagged run takes it too.
    # (The background pull started after netif only fills podman's store.)
    - name: take the Pi NFS root update lock
      ansible.builtin.include_role:
        name: nfsroot_generation
        tasks_from: begin.yml
        apply:
          tags: [always]
      tags: [always]

    - name: extract the pulled Pi NFS root
      import_role:
        name: img
      tags: [img]

    # A fresh extract restores the image's upstream apt sources; point
    # them back at this site's cache.
    - name: point the NFS root's apt sources at the site cache
      import_role:
        name: apt_cache
        tasks_from: nfsroot.yml
      tags: [apt-cache]

    - name: apply the site layer to the NFS root
      import_role:
        name: fixpi
      tags: [fixpi]

    # fixpi is the last task that writes into the root: bump the generation
    # if the root changed, then release the lock. The boards then reboot
    # themselves, one stagger slot apart. If anything above failed, the play
    # has stopped for this host and the lock stays: the boards keep running
    # on the old root instead of rebooting into a half-built one.
    - name: publish the new NFS root generation and release the lock
      ansible.builtin.include_role:
        name: nfsroot_generation
        apply:
          tags: [always]
      tags: [always]

# The Pi NFS root arrives prebuilt from GHCR via the img role (issue #34):
# CI builds and publishes it (.github/workflows/nfsroot-build.yml), the
# server pulls and extracts it, and fixpi applies the site layer on top.
# The old on-server nspawn/chroot provisioning path was removed with it.
