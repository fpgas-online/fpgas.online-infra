---
- hosts: nbp
  roles:
    - netif
    - operators
    - jump
    - lldp
    - firewall
    - {role: vlan-ports, when: switches is defined}
    - {role: switch-vlans, when: switches is defined}
    - nfs
    - img
    # After img (a fresh extract restores the stock sources.list) and before
    # fixpi (whose chroot apt runs are the cache's first clients).
    - apt-cache
    - fixpi
    - pxe
    # Board-access gateway (fpgas-online-gw) -- default ON everywhere (CI VM
    # included); the role converges with no switches/Pis/redis events.
    - {role: board-access, tags: [board-access], when: board_access | default(true)}

- hosts: uhubctl
  roles:
    - uhubctl

# Web tier (site, wssh, cam/stream-server, ttsite) -- see web.yml.
- import_playbook: web.yml

# Pi NFS root provisioning via nspawn+sshd chroot.
# The server starts a systemd-nspawn container with sshd on the Pi NFS root,
# Pi roles run against it via SSH (qemu-user-static ARM emulation), then the
# container is stopped. This bakes all Pi config into the NFS root so Pis
# boot read-only with everything pre-installed.
- hosts: nbp
  tasks:
    - name: start nspawn+sshd on Pi NFS root
      include_role:
        name: nspawn-pi
        tasks_from: start.yml
        # Tags on an include_role reach only the include itself; without
        # apply, `--tags pi,fpgas-apt,onpi` (the documented NFS root update)
        # skipped every mount and policy-rc.d task here, and the Pi roles ran
        # in a chroot with no /proc or /dev/pts.
        apply:
          tags: [pi]
      tags: [pi]

- hosts: pi
  roles:
    - role: fpgas-apt
      tags: [fpgas-apt]
    - role: cam/pi
      tags: [cam]
    - role: onpi
      tags: [onpi]

- hosts: nbp
  tasks:
    - name: stop nspawn+sshd
      include_role:
        name: nspawn-pi
        tasks_from: stop.yml
        # Tags on an include_role reach only the include itself; without
        # apply, `--tags pi,fpgas-apt,onpi` (the documented NFS root update)
        # skipped every mount and policy-rc.d task here, and the Pi roles ran
        # in a chroot with no /proc or /dev/pts.
        apply:
          tags: [pi]
      tags: [pi]
