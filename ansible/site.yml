---
- hosts: nbp
  roles:
    - netif
    - operators
    - jump
    - lldp
    - firewall
    - {role: vlan-ports, when: switches is defined}
    - {role: switch-vlans, when: switches is defined}
    - nfs
    - img
    - fixpi
    - pxe

- hosts: uhubctl
  roles:
    - uhubctl

# Web tier (site, wssh, cam/stream-server, ttsite) -- see web.yml.
- import_playbook: web.yml

# Pi NFS root provisioning via nspawn+sshd chroot -- see pi-provision.yml.
# Build mode only: hosts with nfsroot_source: pull get their root prebuilt
# from GHCR via the img role (issue #34 phase 3) and skip the chroot plays.
- import_playbook: pi-provision.yml
  when: hostvars[groups['nbp'][0]].nfsroot_source | default('build') == 'build'
