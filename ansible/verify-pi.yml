---
# Pi-side verification — checks a running Pi (real or virtual) is
# correctly booted and configured. Same playbook for test VMs and
# production hardware.
#
# Usage:
#   uv run ansible-playbook ansible/verify-pi.yml -i tests/inventory/test-hosts --limit pi_live
#   uv run ansible-playbook ansible/verify-pi.yml -i ansible/inventory --limit pi
#   # a live Pi by address (the static inventory has no per-Pi hosts):
#   uv run ansible-playbook ansible/verify-pi.yml -i 10.21.2.33, -u root -e verify_pi_hosts=all
#
# Hardware-dependent checks are tagged so they can be skipped:
#   --skip-tags hw-camera,hw-fpga

- name: Verify running Pi
  hosts: "{{ verify_pi_hosts | default('pi_live:pi') }}"
  become: true
  tasks:
    # Boot infrastructure
    - name: Check NFS mount present
      command: mount
      changed_when: false
      register: verify_pi_mounts

    - name: Assert NFS mount present
      assert:
        that: "'nfs' in verify_pi_mounts.stdout"
        fail_msg: "No NFS mount found on Pi"
      tags: [verify, boot]

    - name: Check overlayfs mount present
      assert:
        that: "'overlay' in verify_pi_mounts.stdout"
        fail_msg: "No overlayfs mount found on Pi (expected overlayroot tmpfs)"
      tags: [verify, boot]

    # Network
    - name: Get IP addresses
      command: ip addr show
      changed_when: false
      register: verify_pi_addrs

    # The per-port address is derived from the Pi's own hostname
    # (pi-sw<S>-p<P> -> 10.21.S.P). The old check hardcoded 10.21.1.1 —
    # correct only for the CI VM's sw1p1 test Pi; it failed on every real
    # Pi on any other port (tweed rebuild D1-1, 2026-08-26).
    - name: derive expected per-port address from hostname
      set_fact:
        verify_pi_expected_ip: >-
          {{ ansible_hostname
             | regex_replace('^pi-sw(\d+)-p(\d+)$', '10.21.\1.\2') }}
      tags: [verify, network]

    - name: Assert per-port address present
      assert:
        that:
          - verify_pi_expected_ip != ansible_hostname
          - verify_pi_expected_ip in verify_pi_addrs.stdout
        fail_msg: >-
          Expected {{ verify_pi_expected_ip }} (from hostname
          {{ ansible_hostname }}) on an interface; not found
      tags: [verify, network]

    - name: Check can reach server
      command: ping -c 1 -W 5 10.21.0.1
      changed_when: false
      tags: [verify, network]

    # System services
    - name: Check SSH service active
      command: systemctl is-active ssh
      changed_when: false
      register: verify_pi_ssh
      failed_when: false

    - name: Assert SSH service is active
      assert:
        that: verify_pi_ssh.stdout == "active"
        fail_msg: "SSH service is not active on Pi"
      tags: [verify, services]

    - name: Check python3 available
      command: python3 --version
      changed_when: false
      tags: [verify, system]

    - name: Get hostname
      command: hostname
      changed_when: false
      register: verify_pi_hostname

    # Same D1-1 class as the address check: the old assertion hardcoded the
    # CI fixture's pi-sw1-p1. Any per-port DHCP hostname of the pi-sw<S>-p<P>
    # shape is correct; name<->port consistency is covered by the address
    # assertion above (10.21.S.P derived from this hostname).
    - name: Assert hostname matches the per-port naming scheme
      assert:
        that: verify_pi_hostname.stdout is match('^pi-sw[0-9]+-p[0-9]+$')
        fail_msg: >-
          Pi hostname is '{{ verify_pi_hostname.stdout }}', expected the
          per-port scheme pi-sw<switch>-p<port>
      tags: [verify, system]

    # Packages
    - name: Check overlayroot package installed
      command: dpkg -l overlayroot
      changed_when: false
      register: verify_pi_overlayroot
      failed_when: false

    - name: Assert overlayroot installed
      assert:
        that: verify_pi_overlayroot.rc == 0
        fail_msg: "overlayroot package not installed on Pi"
      tags: [verify, packages]

    - name: Check lldpd package installed
      command: dpkg -l lldpd
      changed_when: false
      register: verify_pi_lldpd
      failed_when: false

    - name: Assert lldpd installed
      assert:
        that: verify_pi_lldpd.rc == 0
        fail_msg: >-
          lldpd package not installed on Pi (a Pi booted before the NFS
          root gained it needs a reboot to pick it up)
      tags: [verify, packages]

    - name: Check lldpd service active
      command: systemctl is-active lldpd
      changed_when: false
      register: verify_pi_lldpd_active
      failed_when: false

    - name: Assert lldpd service is active
      assert:
        that: verify_pi_lldpd_active.stdout == "active"
        fail_msg: "lldpd is not active on Pi (is-active: {{ verify_pi_lldpd_active.stdout }})"
      tags: [verify, services]

    # Hardware-dependent services (tag-based skip)
    - name: Check fpgas-cam service enabled
      command: systemctl is-enabled fpgas-cam
      changed_when: false
      register: verify_pi_cam
      failed_when: false
      tags: [verify, hw-camera]

    - name: Assert fpgas-cam service enabled
      assert:
        that: verify_pi_cam.stdout == "enabled"
        fail_msg: "fpgas-cam service not enabled"
      tags: [verify, hw-camera]

    # Tiny Tapeout: roles/onpi/tasks/tt.yml bakes the daemon (every Pi, when
    # the site has tt_boards) and the FPGA demo bitstreams into the NFS root.
    # The demos check is fpga-specific (hw-fpga). The daemon comes from the
    # fpgas.online apt repo, so onpi includes tt.yml with tags [tt, fpgas-apt];
    # the service checks carry fpgas-apt too, and are skipped alongside the
    # install (the VM test runs with --skip-tags fpgas-apt).
    - name: Check fpgas-tt service enabled
      command: systemctl is-enabled fpgas-tt
      changed_when: false
      register: verify_pi_tt
      failed_when: false
      tags: [verify, tt, fpgas-apt]

    - name: Assert fpgas-tt service enabled
      assert:
        that: verify_pi_tt.stdout == "enabled"
        fail_msg: "fpgas-tt service not enabled"
      tags: [verify, tt, fpgas-apt]

    - name: Check FPGA demo bitstreams present
      stat:
        path: /usr/share/fpgas-tt/demos/index.json
      register: verify_pi_tt_demos
      tags: [verify, hw-fpga]

    - name: Assert FPGA demo bitstreams present
      assert:
        that: verify_pi_tt_demos.stat.exists
        fail_msg: "/usr/share/fpgas-tt/demos/index.json missing (fpgas-online-tt-demos not installed)"
      tags: [verify, hw-fpga]
