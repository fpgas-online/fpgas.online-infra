---
# Tasks every CI image-build playbook runs first on the arm64 runner
# (ci-nfsroot-base.yml, ci-nfsroot-upgrade.yml, ci-nfsroot.yml), imported
# with import_tasks.
#
# The runners execute armhf natively (AArch32 EL0, spike PR #40), but a
# registered qemu-arm binfmt handler SHADOWS native execution and makes
# every chroot apt run 4-10x slower — runner images have shipped one
# pre-registered (2026-09-03: build ran 40+ min before cancellation,
# all ARM tasks uniformly slow). Disable it for this boot.
- name: List binfmt handlers (diagnostic for future runner-image drift)
  ansible.builtin.command: ls /proc/sys/fs/binfmt_misc
  register: ci_nfsroot_binfmt
  changed_when: false
  failed_when: false  # binfmt_misc not mounted = no handlers = nothing to do

- name: Show binfmt handlers
  ansible.builtin.debug:
    var: ci_nfsroot_binfmt.stdout_lines

- name: Disable the qemu-arm binfmt handler (shadows native AArch32)
  ansible.builtin.shell: echo -1 > /proc/sys/fs/binfmt_misc/qemu-arm
  when: "'qemu-arm' in ci_nfsroot_binfmt.stdout_lines"
