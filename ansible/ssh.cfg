# SSH client config for the ansible tooling (referenced from ansible.cfg's
# ssh_args via -F). Gives ansible its OWN known_hosts file so that:
#   - a reinstalled host's new keys don't collide with entries pinned in the
#     gdoc2netcfg-generated /etc/ssh/ssh_known_hosts (which accept-new cannot
#     override -- tweed rebuild A1-10), and
#   - ansible's host-key state is independent of the operator's ~/.ssh files.
# accept-new still verifies keys once learned; delete the host's line from
# the known_hosts file after a deliberate reinstall.
Host *
    UserKnownHostsFile ~/.config/fpgas-online/ansible_known_hosts
    GlobalKnownHostsFile none
    StrictHostKeyChecking accept-new
    # Pin the agent to the control node's PERSISTENT local agent, never the
    # operator's forwarded-agent mux: a hung forwarded socket stalls every
    # ssh at the session-bind agent query, which looks exactly like an
    # unreachable server (rebuild #2 P2-1). A dead local.sock is non-fatal
    # (ssh falls through to IdentityFile), a hung mux.sock is.
    IdentityAgent ~/.ssh/agent/local.sock
    # On-disk passphrase-less fallback so automation survives an empty or
    # dead agent. Both pubkeys must be in pxe scripts/authorized_keys
    # (baked into fresh installs at preseed time).
    IdentityFile ~/.ssh/fpgas-ansible-control
    ControlMaster auto
    ControlPersist 60s
    ServerAliveInterval 30
