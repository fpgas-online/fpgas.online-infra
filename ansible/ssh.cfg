# SSH client config for the ansible tooling (referenced from ansible.cfg's
# ssh_args via -F). Gives ansible its OWN known_hosts file so that:
#   - a reinstalled host's new keys don't collide with entries pinned in the
#     gdoc2netcfg-generated /etc/ssh/ssh_known_hosts (which accept-new cannot
#     override -- tweed rebuild A1-10), and
#   - ansible's host-key state is independent of the operator's ~/.ssh files.
# accept-new still verifies keys once learned; delete the host's line from
# the known_hosts file after a deliberate reinstall.
Host *
    UserKnownHostsFile ~/.config/fpgas-online/ansible_known_hosts
    GlobalKnownHostsFile none
    StrictHostKeyChecking accept-new
    # Automation authenticates with the fpgas.online-ansible key ONLY -- the
    # single key the preseed authorizes for the ansible user (baked into
    # fresh installs from pxe scripts/ansible_authorized_keys). The private
    # half is vaulted in host_vars/fpgas.online.yml
    # (vault_ansible_ssh_private_key); extract it to ~/.ssh/fpgas.online-ansible
    # (mode 0600). IdentityAgent none keeps ansible independent of operator
    # ssh-agents: a hung forwarded-agent socket stalls every ssh at the
    # session-bind query, which looks exactly like a dead server (rebuild #2
    # P2-1).
    IdentityAgent none
    IdentityFile ~/.ssh/fpgas.online-ansible
    ControlMaster auto
    ControlPersist 60s
    ServerAliveInterval 30
