---
# Human operator accounts created on the server (see
# inventory/group_vars/all/ssh_keys.yml for the actual list). Each entry:
#   - name: <unix user>
#     ssh_import_ids: [gh:<github-user>, ...]
operators_accounts: []

# Static keys deleted from every operator account, and from the legacy
# accounts below where they still exist (see ssh_public_keys_revoked in
# inventory/group_vars/all/ssh_keys.yml). ssh-import-id only ever adds, so a
# key that has left an operator's GitHub account stays until it is revoked.
operators_revoked_public_keys: "{{ ssh_public_keys_revoked | default([]) }}"
# Accounts no role manages any more that earlier converges gave the static
# ssh_public_keys: the old roles/nspawn-pi `piroot` (a chroot shell into the
# NFS root with passwordless sudo for chroot), dropped in 7765f67 without
# deleting the account. Revoked keys are deleted from them if they exist.
operators_legacy_key_accounts:
  - piroot
