---
# Human operator accounts with passwordless sudo. The server's ansible user
# deliberately trusts ONLY the fpgas.online-ansible automation key (rebuild
# #2 P2-1), so operators get their own accounts, keyed from their GitHub
# accounts via ssh-import-id (same pattern onpi uses for the pi user).
- name: Install ssh-import-id
  ansible.builtin.apt:
    name: ssh-import-id
  tags:
    - operators

- name: Create operator accounts
  ansible.builtin.user:
    name: "{{ item.name }}"
    shell: /bin/bash
  loop: "{{ operators_accounts }}"
  loop_control:
    label: "{{ item.name }}"
  tags:
    - operators

- name: Passwordless sudo for operators
  ansible.builtin.copy:
    content: "{{ item.name }} ALL=(ALL) NOPASSWD:ALL\n"
    dest: "/etc/sudoers.d/{{ item.name }}"
    mode: "0440"
    validate: "visudo -cf %s"
  loop: "{{ operators_accounts }}"
  loop_control:
    label: "{{ item.name }}"
  tags:
    - operators

# Tolerate a transient GitHub outage (don't fail a rebuild over it) but
# never SILENTLY leave an operator without keys - the assert below trips
# if the account has no authorized_keys at all.
- name: Import operator ssh keys from GitHub
  ansible.builtin.command: "ssh-import-id {{ item.ssh_import_ids | join(' ') }}"
  become: true
  become_user: "{{ item.name }}"
  loop: "{{ operators_accounts }}"
  loop_control:
    label: "{{ item.name }}"
  changed_when: false
  failed_when: false
  tags:
    - operators

- name: Read the account database
  ansible.builtin.getent:
    database: passwd
  when: operators_revoked_public_keys | length > 0
  tags:
    - operators

# After the imports: authorized_key matches on the key itself, so this
# catches a revoked key whatever comment its line carries (an ssh-import-id
# "# ssh-import-id gh:<user>" copy too).
- name: Delete the revoked static keys
  ansible.posix.authorized_key:
    user: "{{ item.0 }}"
    state: absent
    key: "{{ item.1 }}"
  loop: >-
    {{ (operators_accounts | map(attribute='name')
        + (operators_legacy_key_accounts | select('in', getent_passwd | default({}))))
       | product(operators_revoked_public_keys) | list }}
  loop_control:
    label: "{{ item.0 }}: {{ item.1.split(' ')[2:] | join(' ') }}"
  tags:
    - operators

- name: Check operator authorized_keys exist
  ansible.builtin.stat:
    path: "/home/{{ item.name }}/.ssh/authorized_keys"
  loop: "{{ operators_accounts }}"
  loop_control:
    label: "{{ item.name }}"
  register: operators_authkeys
  tags:
    - operators

- name: Assert every operator has at least one key
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.size > 0
    fail_msg: "operator {{ item.item.name }} has no authorized_keys (ssh-import-id failed?)"
  loop: "{{ operators_authkeys.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  tags:
    - operators
