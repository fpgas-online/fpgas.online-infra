---
# Human operator accounts with passwordless sudo. The server's ansible user
# deliberately trusts ONLY the fpgas.online-ansible automation key (rebuild
# #2 P2-1), so operators get their own accounts, keyed from their GitHub
# accounts (https://github.com/<user>.keys, via roles/ssh_key_fetch).
- name: Create operator accounts
  ansible.builtin.user:
    name: "{{ item.name }}"
    shell: /bin/bash
  loop: "{{ operators_accounts }}"
  loop_control:
    label: "{{ item.name }}"
  register: operators_created
  tags:
    - operators

- name: Passwordless sudo for operators
  ansible.builtin.copy:
    content: "{{ item.name }} ALL=(ALL) NOPASSWD:ALL\n"
    dest: "/etc/sudoers.d/{{ item.name }}"
    mode: "0440"
    validate: "visudo -cf %s"
  loop: "{{ operators_accounts }}"
  loop_control:
    label: "{{ item.name }}"
  tags:
    - operators

# Every operator's keys are downloaded before any is written, and an id
# that yields no key (empty answer, non-200, no answer, after the retries)
# fails the play HERE, naming the account and the URL. Not ssh-import-id:
# its gh: import reads the rate-limited GitHub API, whose empty answers on
# shared CI addresses were swallowed by the old failed_when: false.
- name: Download the operators' ssh keys
  ansible.builtin.include_role:
    name: ssh_key_fetch
    apply:
      tags: [operators]
  vars:
    ssh_key_fetch_requests: >-
      {%- set requests = [] -%}
      {%- for account in operators_accounts -%}
        {%- for id in account.ssh_import_ids | default([]) -%}
          {%- set _ = requests.append({'account': account.name, 'id': id}) -%}
        {%- endfor -%}
      {%- endfor -%}
      {{ requests }}
  tags:
    - operators

# Additive, as ssh-import-id was: a key an operator's account already holds
# stays (the revoked ones go below). Each line is tagged as ssh-import-id
# tagged its own ("# ssh-import-id gh:<user>"); authorized_key matches on
# the key itself, so a key an earlier ssh-import-id run added is not
# duplicated, only its comment brought in line; a key two of an operator's
# ids both publish is taken from the first only, or its comment would flip
# between them on every run. In --check a fresh account
# does not exist yet, so there is nothing to look its keys up in.
- name: Authorize the operators' downloaded keys
  ansible.posix.authorized_key:
    user: "{{ item.item.name }}"
    key: >-
      {%- set lines = [] -%}
      {%- set seen = [] -%}
      {%- for id in item.item.ssh_import_ids | default([]) -%}
        {%- for key in ssh_key_fetch_keys[id] if key.split()[1] not in seen -%}
          {%- set _ = seen.append(key.split()[1]) -%}
          {%- set _ = lines.append(key ~ ' # ssh-import-id ' ~ (id if ':' in id else 'lp:' ~ id)) -%}
        {%- endfor -%}
      {%- endfor -%}
      {{ lines | join('\n') }}
    state: present
  loop: "{{ operators_created.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  when:
    - item.item.ssh_import_ids | default([]) | length > 0
    - not (ansible_check_mode and item is changed)
  tags:
    - operators

# After the downloads: authorized_key matches on the key itself, so this
# catches a revoked key whatever comment its line carries (one tagged
# "# ssh-import-id gh:<user>" too).
- name: Delete the revoked static keys
  ansible.posix.authorized_key:
    user: "{{ item.0 }}"
    state: absent
    key: "{{ item.1 }}"
  loop: "{{ operators_accounts | map(attribute='name') | product(operators_revoked_public_keys) | list }}"
  loop_control:
    label: "{{ item.0 }}: {{ item.1.split(' ')[2:] | join(' ') }}"
  tags:
    - operators

- name: Check operator authorized_keys exist
  ansible.builtin.stat:
    path: "/home/{{ item.name }}/.ssh/authorized_keys"
  loop: "{{ operators_accounts }}"
  loop_control:
    label: "{{ item.name }}"
  register: operators_authkeys
  tags:
    - operators

# A backstop: the download above already failed on an id with no key.
- name: Assert every operator has at least one key
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.size > 0
    fail_msg: "operator {{ item.item.name }} has no authorized_keys (were all its keys revoked?)"
  loop: "{{ operators_authkeys.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  tags:
    - operators

# Retired accounts. Their sudoers files and the files their roles installed
# go first: piroot's sudoers entry is NOPASSWD `sudo chroot`, i.e. root, and
# must not outlive a failed account deletion. No `force` on the account:
# userdel refuses (rc 8, "user ... is currently used by process N") while it
# has a running process, so a live session fails the run loudly instead of
# being killed; end it, then re-run. Every task here is idempotent, so the
# re-run completes whatever the earlier run left.
- name: Delete the retired accounts' sudoers files
  ansible.builtin.file:
    path: "/etc/sudoers.d/{{ item }}"
    state: absent
  loop: "{{ operators_retired_accounts }}"
  tags:
    - operators

- name: Delete the files the retired accounts' roles installed
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ operators_retired_files }}"
  tags:
    - operators

# `remove` deletes the home directory (and authorized_keys) and mail spool.
- name: Delete the retired accounts
  ansible.builtin.user:
    name: "{{ item }}"
    state: absent
    remove: true
  loop: "{{ operators_retired_accounts }}"
  tags:
    - operators

# userdel drops the user's own group itself (USERGROUPS_ENAB); this catches
# one it left, e.g. a group another account still named as supplementary.
- name: Delete the retired accounts' groups
  ansible.builtin.group:
    name: "{{ item }}"
    state: absent
  loop: "{{ operators_retired_accounts }}"
  tags:
    - operators
