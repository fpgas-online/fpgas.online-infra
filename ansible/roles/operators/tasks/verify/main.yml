---
- name: "Verify: operator accounts exist"
  ansible.builtin.getent:
    database: passwd
    key: "{{ item.name }}"
  loop: "{{ operators_accounts }}"
  loop_control:
    label: "{{ item.name }}"

- name: "Verify: operator sudoers files are valid"
  ansible.builtin.command: "visudo -cf /etc/sudoers.d/{{ item.name }}"
  changed_when: false
  loop: "{{ operators_accounts }}"
  loop_control:
    label: "{{ item.name }}"

- name: "Verify: operator authorized_keys are non-empty"
  ansible.builtin.stat:
    path: "/home/{{ item.name }}/.ssh/authorized_keys"
  register: operators_v_keys
  loop: "{{ operators_accounts }}"
  loop_control:
    label: "{{ item.name }}"

- name: "Verify: assert operator keys present"
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.size > 0
    fail_msg: "operator {{ item.item.name }} missing authorized_keys"
  loop: "{{ operators_v_keys.results }}"
  loop_control:
    label: "{{ item.item.name }}"

- name: "Verify: read the account database"
  ansible.builtin.getent:
    database: passwd

- name: "Verify: read the group database"
  ansible.builtin.getent:
    database: group

- name: "Verify: read the operators' authorized_keys"
  ansible.builtin.slurp:
    path: "{{ getent_passwd[item][4] }}/.ssh/authorized_keys"
  register: operators_v_authkeys
  failed_when: false
  loop: "{{ operators_accounts | map(attribute='name') | select('in', getent_passwd) | list }}"
  when: operators_revoked_public_keys | length > 0

- name: "Verify: assert the revoked static keys are gone"
  ansible.builtin.assert:
    that:
      - item.1.split()[1] not in (item.0.content | default('') | b64decode)
    fail_msg: "{{ item.0.item }}'s authorized_keys still holds the revoked key {{ item.1.split()[2:] | join(' ') }}"
  loop: "{{ operators_v_authkeys.results | default([]) | product(operators_revoked_public_keys) | list }}"
  loop_control:
    label: "{{ item.0.item }}: {{ item.1.split()[2:] | join(' ') }}"

- name: "Verify: assert the retired accounts and their groups are gone"
  ansible.builtin.assert:
    that:
      - item not in getent_passwd
      - item not in getent_group
    fail_msg: "retired account {{ item }} (or its group) still exists"
  loop: "{{ operators_retired_accounts }}"

- name: "Verify: stat the retired accounts' files"
  ansible.builtin.stat:
    path: "{{ item }}"
  register: operators_v_retired_files
  loop: >-
    {{ operators_retired_accounts | map('regex_replace', '^', '/etc/sudoers.d/') | list
       + operators_retired_accounts | map('regex_replace', '^', '/home/') | list
       + operators_retired_files }}

- name: "Verify: assert the retired accounts' files are gone"
  ansible.builtin.assert:
    that:
      - not item.stat.exists
    fail_msg: "{{ item.item }} is left over from a retired account"
  loop: "{{ operators_v_retired_files.results }}"
  loop_control:
    label: "{{ item.item }}"
