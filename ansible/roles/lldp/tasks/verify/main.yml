---
- name: Check lldpd package installed
  ansible.builtin.command: dpkg -l lldpd
  changed_when: false
  register: lldp_v_pkg
  failed_when: false

- name: Assert lldpd is installed
  ansible.builtin.assert:
    that: lldp_v_pkg.rc == 0
    fail_msg: "lldpd package is not installed on the server"

# Read-only probe (noqa: command-instead-of-module): systemd_service needs an
# action (state/enabled/masked/daemon_reload), and service_facts reports only
# running/stopped, not the ActiveState string the assert and its message use.
- name: Check lldpd service active  # noqa: command-instead-of-module
  ansible.builtin.command: systemctl is-active lldpd
  changed_when: false
  register: lldp_v_active
  failed_when: false

- name: Assert lldpd service is active
  ansible.builtin.assert:
    that: lldp_v_active.stdout == "active"
    fail_msg: "lldpd is not active on the server (is-active: {{ lldp_v_active.stdout }})"
