---
# End-of-session kernel maintenance for the Pi NFS root.
#
# Runs on the SERVER with the chroot still mounted, after the Pi roles have
# finished their apt runs and after chroot-prep's initramfs suppression has
# been lifted.  Three jobs, all driven by files/nfsroot_kernels.py (which
# carries the full rationale and the safety rules):
#
#   prune              purge kernel packages that are neither served nor the
#                      newest of their flavour, so the root stops accumulating
#   refresh-initramfs  rebuild the initramfs images that are genuinely stale --
#                      normally none, because a new kernel's own postinst hook
#                      already built its image
#   check              fail the run if the kernel set has crept back up, or if
#                      /boot or the suppression was left in a broken state
#
# None of this touches which kernel the fleet boots: the served kernel is
# identified by the sha256 of the TFTP payload and is never a purge candidate,
# and publishing a new payload stays fixpi's netboot.yml's separate,
# deliberate job.

- name: Copy the kernel maintenance helper to the server
  ansible.builtin.copy:
    src: nfsroot_kernels.py
    dest: /usr/local/sbin/nfsroot-kernels
    mode: "0755"

- name: Purge superseded kernel packages from the NFS root
  ansible.builtin.command:
    cmd: >-
      /usr/local/sbin/nfsroot-kernels
      --nfs-root {{ nfs_root }} --tftp-root {{ tftp_root }}
      {{ nspawn_pi_kernel_keep | map('regex_replace', '^', '--keep=') | join(' ') }}
      prune {{ '--dry-run' if nspawn_pi_kernel_prune_dry_run else '' }}
  register: nspawn_pi_kernel_prune_result
  changed_when: "'purged' in nspawn_pi_kernel_prune_result.stdout"
  when: nspawn_pi_kernel_prune | default(true)

# The prune prints what it keeps and what it took out; surface it, because
# "which kernels does this root have and why" is the first question anyone
# debugging a boot failure asks.
- name: Report the NFS root kernel set
  ansible.builtin.debug:
    msg: "{{ nspawn_pi_kernel_prune_result.stdout_lines | default([]) }}"

# Only the images whose inputs changed, and only once -- as opposed to the
# `update-initramfs -u` a package trigger runs, which rebuilds every installed
# kernel's image unconditionally at roughly 6-40 emulated minutes each.
- name: Rebuild stale initramfs images in the NFS root
  ansible.builtin.command:
    cmd: >-
      /usr/local/sbin/nfsroot-kernels
      --nfs-root {{ nfs_root }} --tftp-root {{ tftp_root }}
      refresh-initramfs
  register: nspawn_pi_kernel_initramfs_result
  changed_when: "'rebuilt' in nspawn_pi_kernel_initramfs_result.stdout"

# The interface names are decided in the initramfs, by the .link files
# initramfs-tools' udev hook copies there (fpgas-online-setup-pi's
# 11-eth-uplink.link names the NIC carrying the NFS root eth-uplink, #299).
# Every kernel's image must carry the root's .link files byte for byte, and
# those files must name the onboard NIC of every netbooted model eth-uplink
# (its ID_PATH, nfsroot_kernels.py UPLINK_ID_PATHS): a stale image, or a file
# that lost a model, would boot that model with other names. It checks the
# file against each model's device path; it does not boot one. The VM test
# boots only the Pi 4B, and only boards prove the 3B+, Pi 5 and Orange Pi.
# It reads /boot/initrd.img-<version>, not the copies the boards fetch
# (boot/initramfs*, sunxi/initrd.img).
- name: Assert every initramfs carries the root's .link files
  ansible.builtin.command:
    cmd: >-
      /usr/local/sbin/nfsroot-kernels
      --nfs-root {{ nfs_root }} --tftp-root {{ tftp_root }}
      check-links
  register: nspawn_pi_kernel_links_result
  changed_when: false

- name: Report the initramfs .link check
  ansible.builtin.debug:
    msg: "{{ nspawn_pi_kernel_links_result.stdout_lines }}"

- name: Assert the NFS root kernel set has not drifted back
  ansible.builtin.command:
    cmd: >-
      /usr/local/sbin/nfsroot-kernels
      --nfs-root {{ nfs_root }} --tftp-root {{ tftp_root }}
      check --max-trees {{ nspawn_pi_max_kernel_trees }}
  changed_when: false
