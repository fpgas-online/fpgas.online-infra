---
# Forwarding is asserted first, and deliberately: a gateway with masquerade
# rules but ip_forward=0 looks entirely healthy to every other check in this
# file (package installed, service active, ruleset present) while forwarding
# nothing at all. Assert the sysctl, not just the ruleset.
- name: Check runtime IPv4 forwarding
  ansible.builtin.command: sysctl -n net.ipv4.ip_forward
  changed_when: false
  register: firewall_ip_forward_v4_state
  when: firewall_ip_forward_v4

- name: Assert IPv4 forwarding is enabled
  ansible.builtin.assert:
    that: firewall_ip_forward_v4_state.stdout | trim == "1"
    fail_msg: >-
      net.ipv4.ip_forward is {{ firewall_ip_forward_v4_state.stdout | trim }}, not 1 --
      this gateway will not route the Pi pool, and the nft forward/NAT chains
      will never see a packet.
  when: firewall_ip_forward_v4

- name: Check runtime IPv6 forwarding
  ansible.builtin.command: sysctl -n net.ipv6.conf.all.forwarding
  changed_when: false
  register: firewall_ip_forward_v6_state
  when: firewall_ip_forward_v6

- name: Assert IPv6 forwarding is enabled
  ansible.builtin.assert:
    that: firewall_ip_forward_v6_state.stdout | trim == "1"
    fail_msg: >-
      net.ipv6.conf.all.forwarding is
      {{ firewall_ip_forward_v6_state.stdout | trim }}, not 1 -- this gateway will not
      route IPv6 for the Pi pool.
  when: firewall_ip_forward_v6

# Runtime alone is not enough: a hand-run `sysctl -w` survives until the next
# reboot and then the fault comes back. Assert it is persisted on disk too.
- name: Check the forwarding sysctls are persisted
  ansible.builtin.stat:
    path: "{{ firewall_sysctl_file }}"
  register: firewall_sysctl_file_stat
  when: firewall_ip_forward_v4 or firewall_ip_forward_v6

- name: Assert the forwarding sysctls are persisted
  ansible.builtin.assert:
    that: firewall_sysctl_file_stat.stat.exists
    fail_msg: >-
      {{ firewall_sysctl_file }} is missing -- forwarding may be on now but
      would be lost at the next reboot or rebuild.
  when: firewall_ip_forward_v4 or firewall_ip_forward_v6

- name: Check nftables package installed
  ansible.builtin.command: dpkg -s nftables
  changed_when: false
  register: firewall_dpkg_nftables

- name: Assert nftables is installed
  ansible.builtin.assert:
    that: firewall_dpkg_nftables.rc == 0
    fail_msg: "nftables package is not installed"

- name: Check nftables service active
  ansible.builtin.command: systemctl is-active nftables
  changed_when: false
  register: firewall_nftables_active
  failed_when: false

- name: Assert nftables service is active
  ansible.builtin.assert:
    that: firewall_nftables_active.stdout == "active"
    fail_msg: "nftables service is not active (got: {{ firewall_nftables_active.stdout }})"

- name: Get nft ruleset
  ansible.builtin.command: nft list ruleset
  changed_when: false
  register: firewall_nft_ruleset

- name: Assert nft ruleset has chain input
  ansible.builtin.assert:
    that: "'chain input' in firewall_nft_ruleset.stdout"
    fail_msg: "nft ruleset missing 'chain input'"

- name: Assert nft ruleset has chain internal_networks
  ansible.builtin.assert:
    that: "'chain internal_networks' in firewall_nft_ruleset.stdout"
    fail_msg: "nft ruleset missing 'chain internal_networks'"

- name: Assert nft ruleset has masquerade
  ansible.builtin.assert:
    that: "'masquerade' in firewall_nft_ruleset.stdout"
    fail_msg: "nft ruleset missing 'masquerade'"
