---
# Enable routing BEFORE the ruleset lands: the forward/NAT chains below only
# ever see a packet if the kernel is willing to forward it. Debian ships
# ip_forward=0, so a rebuilt gateway comes up with a perfect ruleset and no
# routing at all -- which is exactly how tweed failed after its 2026-08-26
# rebuild (host-terminated NFS/DHCP/TFTP kept working, so the Pis booted fine
# while every second hop was silently dead).
- name: Enable IPv4 forwarding
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: "1"
    sysctl_file: "{{ firewall_sysctl_file }}"
    sysctl_set: true
    reload: true
    state: present
  when: firewall_ip_forward_v4

# See defaults/main.yml: this also stops the host honouring Router
# Advertisements, which is safe here only because the gateways' IPv6 default
# routes are static.
- name: Enable IPv6 forwarding
  ansible.posix.sysctl:
    name: net.ipv6.conf.all.forwarding
    value: "1"
    sysctl_file: "{{ firewall_sysctl_file }}"
    sysctl_set: true
    reload: true
    state: present
  when: firewall_ip_forward_v6

- name: Install nftables
  ansible.builtin.apt:
    name:
      - nftables
      - nmap

# validate: a ruleset nft cannot parse is never written, so the reload
# below cannot fail on the file.
- name: Write nftables rules
  ansible.builtin.template:
    src: templates/nftables.conf.j2
    dest: /etc/nftables.conf
    mode: "0755"
    validate: nft -c -f %s
  register: firewall_rules

# started, never restarted: Debian's nftables.service stops with
# `nft flush ruleset` and starts with `nft -f`, so a restart on every
# converge left the gateway with no filter and no NAT between the two. On a
# new gateway this starts the service from the file just written.
- name: Enable nftables service
  ansible.builtin.systemd:
    service: nftables.service
    enabled: true
    state: started

# A rule change reaches the kernel here, in the same task list as the write,
# not in a handler: a handler is skipped when a later role fails, and the next
# converge, finding the file unchanged, would never load it. The reload is
# atomic: the template begins with `flush ruleset`, so the flush and the new
# rules are one `nft -f` transaction.
- name: Load changed nftables rules
  ansible.builtin.systemd:
    service: nftables.service
    state: reloaded
  # A task on purpose, see above: a handler would be lost when a later role fails.
  when: firewall_rules is changed  # noqa: no-handler
