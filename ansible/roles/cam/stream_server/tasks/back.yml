---
# hls/ used to be a tmpfs, which was fine for the original 8 s window but
# cannot hold a DVR window: nginx-rtmp's hls_cleanup keeps ~2x the playlist
# window on "disk", so 10 min of 1 s fragments at up to ~2 Mbit/s is
# ~300 MB per stream, ~6 GB for 20 streams - RAM tweed does not have.
# Plain SSD-backed directories handle that write load trivially.
#
# This has to happen BEFORE the content directories are created: while the
# tmpfs is still mounted, creating hls/source makes it inside the tmpfs, and
# the directory nginx-rtmp actually writes to once the tmpfs is gone would
# not exist.
- name: Remove the old hls tmpfs from fstab (HLS DVR window lives on disk)
  ansible.posix.mount:
    path: "{{ streaming.data_root }}/hls"
    state: absent_from_fstab
  tags:
    - streaming

- name: Check whether the old hls tmpfs is still mounted
  # NOT ansible_facts.mounts: the mounts fact leaves tmpfs out altogether (on
  # tweed it lists only / and /boot), so a `when: ... in ansible_facts.mounts`
  # guard can never fire and the unmount below silently never happens - which
  # is exactly what shipped, and left a 10 min DVR window writing into a
  # 3.9 GB RAM disk. findmnt --mountpoint answers for the path itself.
  ansible.builtin.command: findmnt --noheadings --output FSTYPE --mountpoint {{ streaming.data_root }}/hls
  register: stream_server_hls_mount
  changed_when: false
  failed_when: false
  check_mode: false
  tags:
    - streaming

- name: Unmount the old hls tmpfs if it is still mounted
  # Lazy: nginx workers hold fragments open in it. After a lazy unmount new
  # fragment/playlist opens land on the disk directory; writers on the
  # detached tmpfs finish harmlessly and it is freed when they close.
  # Only ever a tmpfs: never detach a real filesystem someone mounted here.
  ansible.builtin.command: umount --lazy {{ streaming.data_root }}/hls
  when: stream_server_hls_mount.stdout | trim == "tmpfs"
  changed_when: true
  tags:
    - streaming

- name: Create nginx content directories
  ansible.builtin.file:
    path: "{{ streaming.data_root }}/{{ item }}"
    state: directory
    owner: www-data
    group: www-data
    mode: "0755"
  with_items:
    - ""
    - "www"
    - "hls"
    - "hls/source"
  tags:
    - streaming

- name: Install nginx streaming backend rtmp configuration
  ansible.builtin.template:
    src: templates/pib.conf.j2
    dest: /etc/nginx/rtmp/pib.conf
  # A reload only gives NEW workers the new config: publishers stay attached
  # to the old worker (and its old application settings) until they
  # reconnect. See the WebRTC runbook's deploy ordering.
  notify: reload nginx
  tags:
    - streaming

- name: Install nginx streaming front configuration
  ansible.builtin.template:
    src: templates/live-hls.conf.j2
    dest: "/etc/nginx/includes/{{ conference_name }}-live-hls.conf"
  tags:
    - streaming
