---
- name: Create mediamtx system user
  ansible.builtin.user:
    name: mediamtx
    system: true
    shell: /usr/sbin/nologin
    home: /var/lib/mediamtx
    create_home: false
  tags:
    - streaming

- name: Create mediamtx directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - /etc/mediamtx
    - "/opt/mediamtx/v{{ mediamtx_version }}"
  tags:
    - streaming

- name: Download mediamtx release tarball
  ansible.builtin.get_url:
    url: "{{ mediamtx_url }}"
    dest: "/opt/mediamtx/{{ mediamtx_tarball }}"
    checksum: "sha256:{{ mediamtx_checksums[ansible_architecture] }}"
    mode: "0644"
  tags:
    - streaming

- name: Unpack mediamtx
  ansible.builtin.unarchive:
    src: "/opt/mediamtx/{{ mediamtx_tarball }}"
    dest: "/opt/mediamtx/v{{ mediamtx_version }}"
    remote_src: true
    creates: "/opt/mediamtx/v{{ mediamtx_version }}/mediamtx"
  tags:
    - streaming

- name: Install mediamtx binary
  ansible.builtin.copy:
    src: "/opt/mediamtx/v{{ mediamtx_version }}/mediamtx"
    dest: /usr/local/bin/mediamtx
    remote_src: true
    mode: "0755"
  notify: Restart mediamtx
  tags:
    - streaming

- name: Install mediamtx configuration
  ansible.builtin.template:
    src: mediamtx.yml.j2
    dest: /etc/mediamtx/mediamtx.yml
    mode: "0644"
  notify: Restart mediamtx
  tags:
    - streaming

- name: Install mediamtx systemd unit
  ansible.builtin.template:
    src: mediamtx.service.j2
    dest: /etc/systemd/system/mediamtx.service
    mode: "0644"
  notify: Restart mediamtx
  tags:
    - streaming

- name: Enable and start mediamtx
  ansible.builtin.systemd:
    name: mediamtx
    enabled: true
    state: started
    daemon_reload: true
  tags:
    - streaming

# WHEP rides the existing HTTPS vhosts: nginx proxies /cam/ to mediamtx's
# local HTTP listener. Both vhost families pick includes up by glob
# (site: includes/<conference>-*.conf, ttsite: includes/<ttsite_domain>-*.conf).
- name: Install WHEP proxy nginx include
  ansible.builtin.template:
    src: whep.conf.j2
    dest: "/etc/nginx/includes/{{ item }}-webrtc.conf"
    mode: "0644"
  loop:
    - "{{ conference_name }}"
    - "{{ ttsite_domain }}"
  notify: Reload nginx
  tags:
    - streaming
