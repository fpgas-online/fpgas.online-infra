---
# The server's own account, named by the per-host `user_name`. It holds
# state other roles depend on:
#   - /home/<user_name>/.ssh/id_rsa, generated by roles/fixpi; its .pub is
#     copied into the Pi NFS root, so every Pi trusts it;
#   - the Django tree, db.sqlite3 and STATIC_ROOT (roles/site), and the
#     User= of the gunicorn/daphne/uvicorn/fleet-consumer units.
#
# Renaming the account: set user_name to the new name and
# server_user_rename_from to the old one. The role then renames the
# account IN PLACE (usermod -l/-d -m, groupmod -n): same uid and gid, so
# every file it owns stays owned, the home (and its keypair) moves to
# /home/<user_name>, and the systemd units that ran as the old name are
# stopped first, rewritten and started again. It is a no-op once the old
# account is gone, and on a fresh host that never had it. Swapping the two
# values back renames it back (the rollback).
server_user_rename_from: ""

# ssh-import-id ids (gh:<github-user>, lp:<launchpad-user>) whose keys are
# added to the account's authorized_keys, and given a login shell. Empty =
# no keys are managed and the shell is left alone (a pure service account).
server_user_ssh_import_ids: []
