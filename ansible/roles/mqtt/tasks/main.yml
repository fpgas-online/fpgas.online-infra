---
# Per-site MQTT broker for fleet self-registration (docs/superpowers/specs/
# 2026-08-31-fleet-self-registration-design.md). The LAN listener is
# anonymous (resolved D-4): per-port VLAN isolation + the firewall are the
# trust boundary, and the firewall's internal_networks chain already
# accepts 10.21.0.0/16 so no new rule is needed. sensors2mqtt shares this
# broker. Everything is guarded by fleet_broker at the play level.
# update_cache: the server's lists can be weeks old (nothing else on the
# gateway refreshes them), and an old list names superseded pool files --
# the first welland converge failed fetching libcjson1 after a security
# update. Same one-day window as the Pi roles.
- name: Install mosquitto
  ansible.builtin.apt:
    name: mosquitto
    state: present
    update_cache: true
    cache_valid_time: 86400

- name: Fleet broker config
  ansible.builtin.template:
    src: fpgas-fleet.conf.j2
    dest: /etc/mosquitto/conf.d/fpgas-fleet.conf
    mode: "0644"
  notify: Restart mosquitto

- name: Enable mosquitto
  ansible.builtin.systemd:
    name: mosquitto
    enabled: true
    state: started
