---
# See defaults/main.yml. Every download is checked where it happens: an
# empty or failed one fails THIS role, naming the account, the id, the URL
# and the answer, instead of leaving an account without keys for a later
# check to trip over.

- name: Check the ssh ids are gh:<user>, lp:<user> or <user>
  ansible.builtin.assert:
    that:
      - item.id is match('^((gh|lp):)?[A-Za-z0-9][A-Za-z0-9._-]*$')
    fail_msg: "{{ item.account }}: '{{ item.id }}' is not a gh:<user>, lp:<user> or <user> ssh id"
    quiet: true
  loop: "{{ ssh_key_fetch_requests }}"
  loop_control:
    label: "{{ item.account }}: {{ item.id }}"

# A read-only GET, so it runs in --check too: a check run then compares
# against the keys really published. Retried until the answer is a 200
# holding at least one key line; failed when the retries run out.
- name: Download the ssh keys
  vars:
    ssh_key_fetch_key_lines: >-
      {{ (ssh_key_fetch_response.content | default('')).splitlines() | map('trim')
         | select('match', '(ssh|ecdsa|sk)-') | list }}
  block:
    - name: Download the ssh keys from GitHub / Launchpad
      ansible.builtin.uri:
        url: >-
          {{ ssh_key_fetch_github_url ~ '/' ~ item.id[3:] ~ '.keys' if item.id is match('gh:')
             else ssh_key_fetch_launchpad_url ~ '/~' ~ (item.id | regex_replace('^lp:', '')) ~ '/+sshkeys' }}
        return_content: true
      register: ssh_key_fetch_response
      until:
        - ssh_key_fetch_response.status | default(-1) == 200
        - ssh_key_fetch_key_lines | length > 0
      retries: "{{ ssh_key_fetch_retries }}"
      delay: "{{ ssh_key_fetch_delay }}"
      failed_when: >-
        ssh_key_fetch_response.status | default(-1) != 200
        or ssh_key_fetch_key_lines | length == 0
      check_mode: false
      loop: "{{ ssh_key_fetch_requests }}"
      loop_control:
        label: "{{ item.account }}: {{ item.id }}"

  rescue:
    - name: Fail on the downloads that gave no ssh keys
      ansible.builtin.fail:
        msg: >-
          {% for r in ansible_failed_result.results | default([]) if r.failed | default(false) -%}
          {% set status = r.status | default(-1) -%}
          {% set said = '(OK) with no key in it' if status == 200 else '(' ~ r.msg | default('no message') ~ ')' -%}
          No ssh keys for {{ r.item.account }} from {{ r.item.id }}:
          {{ r.url | default('the download') }} answered {{ status }} {{ said }}
          after {{ ssh_key_fetch_retries }} retries.
          {% else -%}
          The ssh key download failed: {{ ansible_failed_result.msg | default('no message') }}
          {%- endfor %}

- name: Collect the downloaded keys
  ansible.builtin.set_fact:
    ssh_key_fetch_keys: >-
      {%- set keys = {} -%}
      {%- for r in ssh_key_fetch_response.results | default([]) -%}
        {%- set _ = keys.update({r.item.id: r.content.splitlines() | map('trim')
                                          | select('match', '(ssh|ecdsa|sk)-') | list}) -%}
      {%- endfor -%}
      {{ keys }}
