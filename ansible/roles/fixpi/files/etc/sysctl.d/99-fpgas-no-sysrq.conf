# Managed by fpgas.online-infra (roles/fixpi). Disable the magic SysRq key.
#
# The netboot Pis share their header UART (ttyAMA0 / serial0) with the FPGA
# board's serial pins. Any test bitstream that drives the FPGA serial-TX pin
# feeds the kernel a stream of bytes on that line; with SysRq enabled the
# kernel eventually parses one as a SysRq command (reboot/crash/poweroff) and
# hard-crashes the netbooted host. Dropping the serial console (cmdline.txt.j2)
# closes the SysRq-over-serial path; this is the belt-and-suspenders half.
kernel.sysrq = 0
