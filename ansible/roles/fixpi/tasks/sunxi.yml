---
# Orange Pi H3 (sunxi) netboot, per site: publish the armmp kernel the image
# carries (sunxi-image.yml, CI build) under <tftp_root>/sunxi/ for U-Boot's
# distro-boot PXE. File work only. Only runs on hosts that declare
# sunxi_boards (multi-host guard rule). Spec:
# docs/superpowers/specs/2026-08-28-orange-pi-netboot-design.md
#
# Safe for the Pi fleet: Raspbian's z50-raspi-firmware kernel hook prints
# "Unsupported kernel version (6.1.0-50-armmp) - skipping setup" and leaves
# /boot/firmware alone (verified 2026-08-28 in the spike).

- name: Find the installed armmp kernel
  ansible.builtin.find:
    paths: "{{ nfs_root }}/root/boot"
    patterns: "vmlinuz-*-armmp"
  register: fixpi_sunxi_vmlinuz
  tags: [sunxi]

- name: Derive the armmp kernel version
  ansible.builtin.set_fact:
    fixpi_sunxi_kver: >-
      {{ (fixpi_sunxi_vmlinuz.files | map(attribute='path') | sort | last | basename)
         | regex_replace('^vmlinuz-', '') }}
  when: fixpi_sunxi_vmlinuz.matched > 0
  tags: [sunxi]

- name: Create tftp sunxi directories
  ansible.builtin.file:
    path: "{{ tftp_root }}/{{ item }}"
    state: directory
    mode: "0755"
  loop: [sunxi, sunxi/dtbs, pxelinux.cfg]
  tags: [sunxi]

- name: Publish kernel + initrd to tftp sunxi/
  ansible.builtin.copy:
    remote_src: true
    src: "{{ nfs_root }}/root/boot/{{ item.src }}-{{ fixpi_sunxi_kver }}"
    dest: "{{ tftp_root }}/sunxi/{{ item.dest }}"
    mode: "0644"
  loop:
    - {src: vmlinuz, dest: vmlinuz}
    - {src: initrd.img, dest: initrd.img}
  when: fixpi_sunxi_vmlinuz.matched > 0
  tags: [sunxi]

- name: Publish sunxi DTBs to tftp sunxi/dtbs/
  ansible.builtin.copy:
    remote_src: true
    src: "{{ nfs_root }}/root/usr/lib/linux-image-{{ fixpi_sunxi_kver }}/{{ item }}"
    dest: "{{ tftp_root }}/sunxi/dtbs/{{ item }}"
    mode: "0644"
  loop: "{{ fixpi_sunxi_dtbs }}"
  when: fixpi_sunxi_vmlinuz.matched > 0
  tags: [sunxi]

# fdtget/fdtput for the I2C fixup below.
- name: Install device-tree-compiler on the server
  ansible.builtin.apt:
    name: device-tree-compiler
  tags: [sunxi]

# The copy above refreshes the DTBs from the kernel package on every kernel
# change, so this fixup re-applies right after it. Done at publish time (not
# a U-Boot fdtoverlays line) so nothing depends on the U-Boot build having
# overlay support.
- name: Enable the header I2C controllers in the published sunxi DTBs
  ansible.builtin.shell: |
    set -e
    changed=0
    for node in {{ fixpi_sunxi_i2c_nodes | join(' ') }}; do
      if [ "$(fdtget '{{ tftp_root }}/sunxi/dtbs/{{ item }}' "$node" status)" != okay ]; then
        fdtput -t s '{{ tftp_root }}/sunxi/dtbs/{{ item }}' "$node" status okay
        changed=1
      fi
    done
    echo "changed=$changed"
  register: fixpi_sunxi_i2c
  changed_when: "'changed=1' in fixpi_sunxi_i2c.stdout"
  loop: "{{ fixpi_sunxi_dtbs }}"
  when: fixpi_sunxi_vmlinuz.matched > 0
  tags: [sunxi]

- name: U-Boot PXE config for the sunxi boards
  ansible.builtin.template:
    src: templates/boot/default-arm-sunxi.j2
    dest: "{{ tftp_root }}/pxelinux.cfg/default-arm-sunxi"
    mode: "0644"
  tags: [sunxi]
