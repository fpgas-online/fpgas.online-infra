---
# Server-side fleet agent config for the NFS root (fpgas.online-infra#47).
# The image enables the agent units (onpi/tasks/fleet.yml) but carries no
# site identity; this file is what switches them on, pointing the Pis at
# this site's broker on the server's local address.

- name: Create /etc/fpgas-online in the NFS root
  ansible.builtin.file:
    path: "{{ nfs_root }}/root/etc/fpgas-online"
    state: directory
    mode: "0755"

- name: Bake fleet.toml into the NFS root
  ansible.builtin.template:
    src: "{{ role_path }}/../onpi/templates/fleet.toml.j2"
    dest: "{{ nfs_root }}/root/etc/fpgas-online/fleet.toml"
    mode: "0644"
  vars:
    fleet_broker_address: "{{ eth_local_address | default('10.21.0.1') }}"
