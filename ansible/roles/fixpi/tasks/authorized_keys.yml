---
# The NFS root's /root/.ssh/authorized_keys and /home/pi/.ssh/authorized_keys
# belong to the site, not to the image:
#   - the CI image ships neither file (ci-nfsroot.yml removes them),
#   - the img pull's rsync excludes both, so a pull neither restores an
#     image copy nor --deletes the site's,
#   - and this file builds the complete key list and writes each file once,
#     exclusively, with `copy` (which leaves an identical file alone).
# So a converge with no key change touches neither file. That matters: every
# rewrite is a rename, i.e. a new inode, which the booted boards' overlay
# over NFS answers with ESTALE, and it counts as a root change for
# nfsroot_generation, so the whole fleet reboots. A key dropped from the
# configuration disappears from the root at the next converge.
#
# The keys:
#   - the server user's (user_name) id_rsa.pub, read on the server,
#   - the controller's automation key (ansible_ssh_private_key_file .pub),
#   - the operators' GitHub keys (fixpi_github_key_users), fetched on the
#     server, each tagged with a "gh:<user>" comment,
#   - pi only: the gateway jump account's key (roles/jump), so someone
#     logged in to it can `ssh pi@10.21.S.P` onward.

- name: Read the server user's public key
  ansible.builtin.slurp:
    src: "{{ fixpi_server_user_pubkey }}"
  register: fixpi_server_user_key

# site.yml runs roles/jump (which makes this key) before fixpi.
- name: Read the gateway jump account's public key
  ansible.builtin.slurp:
    src: "{{ fixpi_jump_ssh_pubkey }}"
  register: fixpi_jump_key
  when: fixpi_jump_ssh_pubkey | length > 0

# The current files: where a GitHub fetch fails, that user's keys are kept
# as they are, so an outage neither drops the keys nor rewrites the files.
- name: Read the current authorized_keys
  ansible.builtin.slurp:
    src: "{{ nfs_root }}/root/{{ item }}/.ssh/authorized_keys"
  register: fixpi_current_authkeys
  failed_when: false
  loop: "{{ fixpi_authorized_keys_files | map(attribute='path') | list }}"

- name: Fetch the operators' GitHub keys
  ansible.builtin.uri:
    url: "https://github.com/{{ item }}.keys"
    return_content: true
  register: fixpi_github_fetch
  failed_when: false
  loop: "{{ fixpi_github_key_users }}"

- name: Warn about GitHub keys that could not be fetched
  ansible.builtin.debug:
    msg: >-
      Could not fetch https://github.com/{{ item.item }}.keys
      ({{ item.msg | default('status ' ~ (item.status | default('?'))) }}):
      keeping the gh:{{ item.item }} keys the NFS root already has.
  loop: "{{ fixpi_github_fetch.results | rejectattr('status', 'equalto', 200) | list }}"
  loop_control:
    label: "gh:{{ item.item }}"

- name: Build the NFS root's authorized_keys
  ansible.builtin.set_fact:
    fixpi_authorized_keys: >-
      {%- set current = {} -%}
      {%- for r in fixpi_current_authkeys.results -%}
        {%- set _ = current.update({r.item: (r.content | default('') | b64decode).splitlines()}) -%}
      {%- endfor -%}
      {%- set common = [(fixpi_server_user_key.content | b64decode).strip()] -%}
      {%- if ansible_ssh_private_key_file is defined -%}
        {%- set _ = common.append(lookup('file', ansible_ssh_private_key_file + '.pub').strip()) -%}
      {%- endif -%}
      {%- set files = {} -%}
      {%- for path in fixpi_authorized_keys_files | map(attribute='path') -%}
        {%- set keys = common | list -%}
        {%- for r in fixpi_github_fetch.results -%}
          {%- if r.status | default(0) == 200 -%}
            {%- for line in r.content.splitlines() if line.strip() and not line.startswith('#') -%}
              {%- set _ = keys.append((line.split()[:2] | join(' ')) ~ ' gh:' ~ r.item) -%}
            {%- endfor -%}
          {%- else -%}
            {%- for line in current[path] if line.endswith(' gh:' ~ r.item) -%}
              {%- set _ = keys.append(line) -%}
            {%- endfor -%}
          {%- endif -%}
        {%- endfor -%}
        {%- if path == 'home/pi' and fixpi_jump_key.content is defined -%}
          {%- set _ = keys.append((fixpi_jump_key.content | b64decode).strip()) -%}
        {%- endif -%}
        {%- set _ = files.update({path: keys | unique | join('\n') ~ '\n'}) -%}
      {%- endfor -%}
      {{ files }}

- name: Write the NFS root's authorized_keys (only when the key list changed)
  ansible.builtin.copy:
    content: "{{ fixpi_authorized_keys[item.path] }}"
    dest: "{{ nfs_root }}/root/{{ item.path }}/.ssh/authorized_keys"
    owner: "{{ item.id }}"
    group: "{{ item.id }}"
    mode: "0600"
  loop: "{{ fixpi_authorized_keys_files }}"
  loop_control:
    label: "{{ item.path }}"
