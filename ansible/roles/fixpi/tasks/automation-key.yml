---
# Site layer: authorize the automation key for the NFS root's ansible
# account (created with its sudoers file by the image build, netboot.yml).
# Per-site like the pi/root keys in userconf.yml, so the public image
# carries no site's key; tagged `keys`, which ci-nfsroot.yml skips.

# A root extracted from an image built before the account existed would get
# a key for a user it does not have: fail here instead of shipping a root
# whose automation login silently does not work.
- name: Check the NFS root has the ansible user (built into the image)
  ansible.builtin.command: grep -q "^{{ fixpi_ansible_user }}:x:{{ fixpi_ansible_uid }}:{{ fixpi_ansible_uid }}:" "{{ nfs_root }}/root/etc/passwd"
  changed_when: false
  tags:
    - keys

- name: Create the ansible user's .ssh dir in the NFS root
  ansible.builtin.file:
    path: "{{ nfs_root }}/root/home/{{ fixpi_ansible_user }}/.ssh"
    state: directory
    owner: "{{ fixpi_ansible_uid }}"
    group: "{{ fixpi_ansible_uid }}"
    mode: "0700"
  tags:
    - keys

# Exclusive (as on the server, roles/automation_user): the file is this
# task's alone -- the image ships none and nothing else writes it -- so it
# holds exactly the automation key and a key dropped from the inventory is
# dropped here too.
#
# Inode churn: on a converge with an unchanged image, copy finds identical
# content and leaves the file (and its inode) alone. But every NEW image
# digest's pull (roles/img, rsync -aHAX --delete) deletes home/ansible/.ssh,
# because the image carries none and the path is not in the pull's exclude
# list, so this task recreates it with a new inode -- ESTALE on booted
# boards until they reboot (see the note above the shadow task in
# userconf.yml). A new digest already means a new root and a fleet reboot,
# so this adds no extra reboot; excluding
# /home/ansible/.ssh/authorized_keys from the pull (as PR #140 does for the
# pi and root files) would keep the inode across pulls too.
- name: Authorize the automation key for the ansible user in the NFS root
  ansible.builtin.copy:
    content: "{{ fixpi_ansible_public_key }}\n"
    dest: "{{ nfs_root }}/root/home/{{ fixpi_ansible_user }}/.ssh/authorized_keys"
    owner: "{{ fixpi_ansible_uid }}"
    group: "{{ fixpi_ansible_uid }}"
    mode: "0600"
  tags:
    - keys
