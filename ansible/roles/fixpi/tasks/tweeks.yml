---
- name: avoid [FAILED] Failed to start Set console font and keymap.
  file:
    path: "{{ nfs_root }}/root/etc/systemd/system/multi-user.target.wants/console-setup.service"
    state: absent

- name: avoid Wi-Fi is currently blocked by rfkill.
  file:
    path: "{{ nfs_root }}/root/etc/profile.d/wifi-check.sh"
    state: absent

# FIXME
# - name: avoid [FAILED] Failed to start Hostname Service.
#  file:
#    path: "{{ nfs_root }}/"
#    state: absent
#

- name: remove etc/hostname (dhclient will get hostname from server)
  file:
    path: "{{ nfs_root }}/root/etc/hostname"
    state: absent
  tags:
    - hostname
    - fixpi

# - name: pi etc/hosts
#   lineinfile:
#     path: "{{ nfs_root }}/root/etc/hosts"
#     line: "127.0.1.1 pi{{ item.port }}"
#   with_items: "{{ switch.nos }}"
#   tags:
#   - hostname
#   - fixpi

- name: set pistat_host in /etc/environment
  lineinfile:
    dest: "{{ nfs_root }}/root/etc/environment"
    state: present
    create: true
    line: "pistat_host={{domain_name}}"
  tags:
    - hostname
    - fixpi

- name: etc overrides
  copy:
    src: "files/etc/"
    dest: "{{ nfs_root }}/root/etc/"
  tags:
    - fixpi

- name: resolve.conf
  template:
    src: templates/resolve.conf.j2
    dest: "{{ nfs_root }}/root/etc/resolve.conf"
  tags:
    - fixpi

- name: add time to bash prompt
  lineinfile:
    dest: "{{ nfs_root }}/root/home/pi/.bashrc"
    insertafter: '^unset color_prompt force_color_prompt'
    line: '{% raw %}PS1="\D{%T} $PS1"{% endraw %}'
  when: true
  tags:
    - bashrc
    - fixpi

- name: config.txt disable bluetooth, ensable uart
  ansible.builtin.lineinfile:
    dest: "{{ nfs_root }}/boot/config.txt"
    line: "{{ item }}"
  with_items:
    - dtoverlay=disable-bt
    - enable_uart=1
    - uart_2ndstage=1
  tags:
    - fixpi

# Write-protect the bootloader EEPROM. The EEPROM (SPI flash) is the one piece
# of per-board state that a netbooted Pi does NOT revert on reboot, so it is the
# only place a root user could leave a persistent change (reflash the bootloader,
# change BOOT_ORDER, etc). eeprom_write_protect=1 tells the bootloader to set the
# SPI flash Write Status Register to protect the whole device, which blocks
# rpi-eeprom-update / rpi-eeprom-config from writing it.
#
#   Pi 5 (BCM2712): /WP is pulled low by default, so configuring the Write Status
#     Register makes the protection hardware-enforced immediately -- even root
#     cannot clear it without physically bridging TP14<->TP1. This is a real,
#     tamper-resistant lock.
#   Pi 4 (BCM2711): /WP (TP5) is NOT asserted by default, so this blocks the
#     standard tooling but a determined root user could still clear the Write
#     Status Register. Pull TP5 low to make it hardware-enforced.
#
# To legitimately update an EEPROM later: set eeprom_write_protect=0 in the
# served config.txt, reboot the board, flash, then restore =1. See
# docs/superpowers/runbooks/2026-08-31-eeprom-write-protect.md
- name: config.txt write-protect the bootloader EEPROM
  ansible.builtin.lineinfile:
    dest: "{{ nfs_root }}/boot/config.txt"
    line: eeprom_write_protect=1
  tags:
    - fixpi

# the rest of these tasks config the server to monitor client boot spew

- name: is server pi
  stat:
    path: /boot/firmware/config.txt
  register: is_pi
  tags:
    - ispi

- name: enable /dev/serial0
  ansible.builtin.lineinfile:
    dest: /boot/firmware/config.txt
    # regexp: (^|#\s*)Storage=
    line: "{{ item }}"
  with_items:
    - dtoverlay=disable-bt
  when: is_pi.stat.exists
  tags:
    - ispi

# https://bugs.debian.org/667616
# brltty greedily grabs serial ports, ftdi_sio loses connection
- name: apt remove brltty
  apt:
    name:
      - brltty
    state: absent

- name: install packages on server
  apt:
    name:
      - tio
      - ansible

- name: let tio connect to the tty and see pi boot messages
  ansible.builtin.user:
    name: "{{ user_name }}"
    groups: dialout
    append: true

# don't let getty mess up boot messages over the serial console
- name: disable (mask) getty systemd service
  systemd:
    enabled: false
    masked: true
    state: stopped
    name: serial-getty@ttyAMA0.service
  tags:
    - ispi

- name: Git checkout this repo for safer 2 hour onpi
  ansible.builtin.git:
    repo: 'https://github.com/CarlFK/pici.git'
    dest: "/home/{{ user_name }}/pici"
    depth: 1
    single_branch: true
    accept_hostkey: true
    force: true
    # args:
    # creates: "/home/{{ user_name }}/pici"

