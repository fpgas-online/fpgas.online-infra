---
- name: avoid [FAILED] Failed to start Set console font and keymap.
  file:
    path: "{{ nfs_root }}/root/etc/systemd/system/multi-user.target.wants/console-setup.service"
    state: absent

- name: avoid Wi-Fi is currently blocked by rfkill.
  file:
    path: "{{ nfs_root }}/root/etc/profile.d/wifi-check.sh"
    state: absent

# FIXME
# - name: avoid [FAILED] Failed to start Hostname Service.
#  file:
#    path: "{{ nfs_root }}/"
#    state: absent
#

- name: remove etc/hostname (dhclient will get hostname from server)
  file:
    path: "{{ nfs_root }}/root/etc/hostname"
    state: absent
  tags:
    - hostname
    - fixpi

# - name: pi etc/hosts
#   lineinfile:
#     path: "{{ nfs_root }}/root/etc/hosts"
#     line: "127.0.1.1 pi{{ item.port }}"
#   with_items: "{{ switch.nos }}"
#   tags:
#   - hostname
#   - fixpi

- name: set pistat_host in /etc/environment
  lineinfile:
    dest: "{{ nfs_root }}/root/etc/environment"
    state: present
    create: true
    line: "pistat_host={{domain_name}}"
  tags:
    - hostname
    - fixpi

- name: etc overrides
  copy:
    src: "files/etc/"
    dest: "{{ nfs_root }}/root/etc/"
  tags:
    - fixpi

- name: resolve.conf
  template:
    src: templates/resolve.conf.j2
    dest: "{{ nfs_root }}/root/etc/resolve.conf"
  tags:
    - fixpi

- name: add time to bash prompt
  lineinfile:
    dest: "{{ nfs_root }}/root/home/pi/.bashrc"
    insertafter: '^unset color_prompt force_color_prompt'
    line: '{% raw %}PS1="\D{%T} $PS1"{% endraw %}'
  when: true
  tags:
    - bashrc
    - fixpi

# Disable the onboard radios in the read-only netboot image. Because config.txt
# is served from the (read-only) TFTP root, these lines are re-applied on every
# boot: a user with root can bring a radio up for the life of a session, but the
# change never survives a reboot. On Pi 5 (BCM2712) the firmware auto-remaps
# disable-wifi -> disable-wifi-pi5 and disable-bt -> disable-bt-pi5 via
# overlay_map.dtb, so the same two lines disable both radios on Pi 4 and Pi 5.
#   disable-wifi:  Pi 4 disables &mmc/&mmcnr, Pi 5 disables &sdio2 (WLAN never enumerates)
#   disable-bt:    Pi 4 disables &bt, Pi 5 disables &bluetooth
- name: config.txt disable onboard Wi-Fi and Bluetooth, enable uart
  ansible.builtin.lineinfile:
    dest: "{{ nfs_root }}/boot/config.txt"
    line: "{{ item }}"
  with_items:
    - dtoverlay=disable-wifi
    - dtoverlay=disable-bt
    - enable_uart=1
    - uart_2ndstage=1
  tags:
    - fixpi

# The block above frees the 40-pin header UART on Pi 0-4 only, and does so as a
# side effect: disable-bt.dtbo is compatible="brcm,bcm2835" and its fragment@1
# targets `uart0` with status="okay" + uart0_pins.  On a Pi 5 the firmware
# resolves the same `dtoverlay=disable-bt` to disable-bt-pi5.dtbo
# (compatible="brcm,bcm2712"), whose only fragment targets `bluetooth` -- it
# never touches uart0.  bcm2712-rpi-5-b.dtb ships the RP1 header UART
# (/axi/pcie@1000120000/rp1/serial@30000, alias serial0) as status="disabled",
# so on every Pi 5 it stays off and /dev/ttyAMA0 never appears.  That is the
# whole reason the Acorn CLE-215+ hosts have no serial link to their FPGA
# (fpgas.online-test-designs docs/hardware/acorn-pinmap.md wires the Acorn's P2
# connector to GPIO14/15 and expects /dev/ttyAMA0 at 115200).
#
# `cmdline=` is not cosmetic.  Enabling uart0 makes the firmware resolve
# `console=serial0` to ttyAMA0 -- putting the kernel console, and the getty
# systemd's generator derives from it, directly onto the FPGA's UART.  A design
# driving K2 then feeds the console garbage that SysRq reads as reboot/crash
# (see the acorn-pinmap.md warning).  Pinning the Pi 5s to their dedicated
# debug UART keeps the console off the FPGA AND leaves ttyAMA0 unclaimed.
- name: config.txt enable the 40-pin header UART on Pi 5
  ansible.builtin.blockinfile:
    dest: "{{ nfs_root }}/boot/config.txt"
    marker: "# {mark} ANSIBLE MANAGED BLOCK: pi5 header uart"
    block: |
      [pi5]
      dtoverlay=uart0-pi5
      cmdline=cmdline-pi5.txt
      [all]
  tags:
    - fixpi
    - cmdline
# USB gadget console (fpgas-online-setup-pi usb-console/): the Pi 4 and Pi 5
# USB-C port is a dwc2 OTG controller that the firmware leaves in host mode;
# in peripheral mode a laptop on that port gets the kernel log + a getty.
# Only these models: their USB-A ports hang off separate controllers (VL805 /
# RP1), so nothing is lost, whereas on a Pi 3 or Zero dwc2 IS the only USB
# (Ethernet on the 3B+ included). Fleet nodes are PoE-powered, so the USB-C
# port is free. Orange Pi H3 boards need nothing here (musb autoloads).
- name: config.txt dwc2 peripheral mode on Pi 4 / Pi 5 (USB gadget console)
  ansible.builtin.blockinfile:
    dest: "{{ nfs_root }}/boot/config.txt"
    marker: "# {mark} ANSIBLE MANAGED BLOCK: usb gadget console"
    block: |
      [pi4]
      dtoverlay=dwc2,dr_mode=peripheral
      [pi5]
      dtoverlay=dwc2,dr_mode=peripheral
      [all]
  tags:
    - fixpi

# the rest of these tasks config the server to monitor client boot spew

- name: is server pi
  stat:
    path: /boot/firmware/config.txt
  register: is_pi
  tags:
    - ispi

- name: enable /dev/serial0
  ansible.builtin.lineinfile:
    dest: /boot/firmware/config.txt
    # regexp: (^|#\s*)Storage=
    line: "{{ item }}"
  with_items:
    - dtoverlay=disable-bt
  when: is_pi.stat.exists
  tags:
    - ispi

# https://bugs.debian.org/667616
# brltty greedily grabs serial ports, ftdi_sio loses connection
- name: apt remove brltty
  apt:
    name:
      - brltty
    state: absent

- name: install packages on server
  apt:
    name:
      - tio
      - ansible

- name: let tio connect to the tty and see pi boot messages
  ansible.builtin.user:
    name: "{{ user_name }}"
    groups: dialout
    append: true

# don't let getty mess up boot messages over the serial console
- name: disable (mask) getty systemd service
  systemd:
    enabled: false
    masked: true
    state: stopped
    name: serial-getty@ttyAMA0.service
  tags:
    - ispi

- name: Git checkout this repo for safer 2 hour onpi
  ansible.builtin.git:
    repo: 'https://github.com/CarlFK/pici.git'
    dest: "/home/{{ user_name }}/pici"
    depth: 1
    single_branch: true
    accept_hostkey: true
    force: true
    # args:
    # creates: "/home/{{ user_name }}/pici"

# ssh-keyscan -H remote_host.com >> /etc/ssh/ssh_known_hosts

# ifupdown is unused on the netbooted root (kernel ip=dhcp + NetworkManager):
# networking.service fails on every Pi and ifupdown-pre.service (udevadm
# settle) waits its full 2 min on the Orange Pi H3 before anything else starts
# (spike 2026-08-28: userspace 2 m 16 s, of which ifupdown-pre 2 m 02 s).
- name: mask ifupdown units in NFS root
  file:
    src: /dev/null
    dest: "{{ nfs_root }}/root/etc/systemd/system/{{ item }}"
    state: link
    force: true
  loop:
    - networking.service
    - ifupdown-pre.service
  tags:
    - fixpi
