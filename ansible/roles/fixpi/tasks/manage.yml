---
# fixpi_install_qemu: false skips this on hosts that execute the armhf root
# natively (the CI arm64 runners, issue #34 spike) -- installing
# qemu-user-static there registers binfmt handlers that can shadow the
# faster native AArch32 execution.
- name: install packages on server
  apt:
    name:
      - qemu-user-static
  when: fixpi_install_qemu | default(true)
  tags:
    - qemu

- name: install scripts to manage pi states
  copy:
    src: "scripts/{{ item }}"
    dest: "/usr/local/sbin/{{ item }}"
    mode: preserve
  with_items:
    - maintenance.sh
    - production.sh
    - chroot-mount-pi-fs.bash
  tags:
    - manage
    - qemu

- name: put the pi boot system into maintenance mode
  command: maintenance.sh
  when: false
