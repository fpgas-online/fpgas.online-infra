---
- name: create tftp root directory
  file:
    path: /srv/tftp
    state: directory

- name: link bootcode.bin in tftp root because pi netboot not too smart.
  file:
    src: "{{ nfs_root }}/boot/bootcode.bin"
    dest: "/srv/tftp/bootcode.bin"
    state: link

- name: link pi serial-num to boot dir, cuz that is how it works.
  file:
    src: "{{ nfs_root }}/boot"
    dest: "/srv/tftp/{{ item.sn }}"
    state: link
  # switch.nos is the legacy MAC-table scheme's Pi list; per-port VLAN
  # hosts (switches defined) have no switch.nos, so this is a no-op there.
  with_items:
    "{{ switch.nos | default([]) }}"
  tags:
    - pibs

- name: save the original config.txt, cmdline.txt, fstab
  command: mv "{{ nfs_root }}/{{ item }}" "{{ nfs_root }}/{{ item }}.org"
  args:
    removes: "{{ nfs_root }}/{{ item }}"
    creates: "{{ nfs_root }}/{{ item }}.org"
  with_items:
    # - "boot/config.txt"
    - "boot/cmdline.txt"
    - "boot/user-data"
    - "root/fstab"
  tags:
    - netboot

- name: replace cmdline with netbootie versions
  template:
    src: "templates/boot/{{ item }}.j2"
    dest: "{{ nfs_root }}/boot/{{ item }}"
  with_items:
    - cmdline.txt
  tags:
    - cmdline
    - netboot

- name: fstab - replace local fs to nfs
  template:
    src: "templates/etc/{{ item }}.j2"
    dest: "{{ nfs_root }}/root/etc/{{ item }}"
  with_items:
    - fstab
  tags:
    - cmdline
    - netboot

- name: create pi user in NFS root if missing
  command: >-
    chroot-mount-pi-fs.bash "{{ nfs_root }}" "/tmp/pi"
    "id -u {{ user }} 2>/dev/null || useradd -m -s /bin/bash --uid 1000 {{ user }}"
  tags:
    - netboot
    - qemu

# On stock RPi OS the pi user gets passwordless sudo from the first-boot
# userconf mechanism -- but we create the user directly (above) and mask that
# wizard (userconfig.service is noauto-blind, see below), so nothing grants it
# otherwise. Without this, ansible become over SSH fails on the running Pi with
# "Timeout waiting for privilege escalation prompt" and verify-pi.yml (become:
# true on every task) reports the host UNREACHABLE. 0440 root:root is mandatory
# -- sudo ignores sudoers.d files that are group/world-writable. Matches the
# RPi OS convention (/etc/sudoers.d/010_<user>-nopasswd) and is production-valid
# for a headless appliance the pi user administers.
- name: grant the pi user passwordless sudo in the NFS root
  copy:
    content: "{{ user }} ALL=(ALL) NOPASSWD: ALL\n"
    dest: "{{ nfs_root }}/root/etc/sudoers.d/010_{{ user }}-nopasswd"
    mode: "0440"
  tags:
    - netboot
    - qemu

# Make the Pi's own DHCP-assigned hostname (pi-sw<s>-p<p>) resolve locally, so
# sudo's per-invocation getaddrinfo() of the machine name is instant instead of
# stalling on DNS -- otherwise ansible become trips its ~12s prompt timeout and
# verify-pi.yml reports the Pi UNREACHABLE. See the unit file's own comment.
- name: install self-hostname /etc/hosts service in NFS root
  copy:
    src: files/fpgas-hostname-hosts.service
    dest: "{{ nfs_root }}/root/etc/systemd/system/fpgas-hostname-hosts.service"
    mode: "0644"
  tags:
    - netboot
    - qemu

- name: enable self-hostname /etc/hosts service in NFS root
  file:
    src: /etc/systemd/system/fpgas-hostname-hosts.service
    dest: "{{ nfs_root }}/root/etc/systemd/system/multi-user.target.wants/fpgas-hostname-hosts.service"
    state: link
  tags:
    - netboot
    - qemu

- name: ensure DNS resolution works in chroot
  copy:
    remote_src: true
    src: /etc/resolv.conf
    dest: "{{ nfs_root }}/root/etc/resolv.conf"
    force: false
  tags:
    - netboot

- name: install nfs-common into pi's fs
  command: chroot-mount-pi-fs.bash "{{ nfs_root }}" "/tmp/pi" "{{ item }}"
  with_items:
    - "apt update"
    - "apt install -y nfs-common overlayroot"
  tags:
    - netboot
    - qemu

# The chroot-regenerated initramfs (with overlayroot hooks) is written to
# the rootfs /boot directory, but TFTP serves the FAT partition's initramfs8.
# Copy the newest regenerated initramfs over the FAT one so the Pi boots with
# overlayroot support. On real hardware this copy happens automatically via
# the raspi-firmware hook, but that hook doesn't run correctly in our chroot.
- name: find regenerated v8 initramfs (with overlayroot)
  find:
    paths: "{{ nfs_root }}/root/boot"
    patterns: "initrd.img-*-v8"
  register: fixpi_regenerated_initramfs
  tags:
    - netboot
    - qemu

- name: copy regenerated initramfs to FAT partition TFTP path
  copy:
    remote_src: true
    src: "{{ fixpi_regenerated_initramfs.files[0].path }}"
    dest: "{{ nfs_root }}/boot/initramfs8"
    mode: "0755"
  when: fixpi_regenerated_initramfs.files | length > 0
  tags:
    - netboot
    - qemu

# Enable ssh.service directly in the NFS root. RPi OS ships with ssh.service
# disabled by default, to be enabled on first boot by sshswitch.service which
# looks for /boot/firmware/ssh. But /boot/firmware is mounted noauto in our
# fstab, so sshswitch never finds the file. Enable ssh.service unconditionally
# here since we always want remote access on the Pi.
- name: enable ssh.service in NFS root
  file:
    src: /lib/systemd/system/ssh.service
    dest: "{{ nfs_root }}/root/etc/systemd/system/multi-user.target.wants/ssh.service"
    state: link
  tags:
    - netboot
    - qemu

# Disable regenerate_ssh_host_keys.service — it unconditionally deletes and
# regenerates host keys on first boot via ssh-keygen -A. Under QEMU TCG this
# takes minutes per key (RSA is slowest), delaying sshd startup and blocking
# all Pi test automation. We pre-generate keys in the next task so ssh.service
# has valid host keys to use immediately.
- name: disable regenerate_ssh_host_keys.service in NFS root
  file:
    path: "{{ nfs_root }}/root/etc/systemd/system/multi-user.target.wants/regenerate_ssh_host_keys.service"
    state: absent
  tags:
    - netboot
    - qemu

# The RPi OS first-boot user-config wizard (userconfig.service) runs on tty1
# and applies /boot/firmware/userconf.txt. But our fstab mounts /boot/firmware
# noauto (see fstab.j2 -- the same reason ssh.service is enabled directly
# above), so userconf.txt is never visible at boot: the wizard finds no config
# and drops into an interactive setup that blocks multi-user.target forever.
# Observed in the VM test: the job spins "userconfig.service/start running
# (59min / no limit)" and the Pi never reaches login or starts sshd. We already
# provision the pi user directly (see "create pi user in NFS root"), so this
# wizard must never run -- mask it, same rationale as disabling
# regenerate_ssh_host_keys.service above. Not QEMU-specific: a real headless Pi
# (no display/keyboard) netbooting this NFS root would hang on it identically.
- name: mask userconfig.service (first-boot wizard) in NFS root
  file:
    src: /dev/null
    dest: "{{ nfs_root }}/root/etc/systemd/system/userconfig.service"
    state: link
    force: true
  tags:
    - netboot
    - qemu

# Pre-generate SSH host keys in the NFS root so sshd starts immediately without
# waiting for ssh-keygen (slow under QEMU TCG ARM emulation). Generated here
# on the server (native amd64 ssh-keygen), which is both faster and produces
# valid keys that the Pi's sshd accepts directly.
- name: check if SSH host keys already exist in NFS root
  stat:
    path: "{{ nfs_root }}/root/etc/ssh/ssh_host_ed25519_key"
  register: fixpi_ssh_host_key_stat
  tags:
    - netboot
    - qemu

- name: pre-generate SSH host keys in NFS root
  command: >-
    ssh-keygen -q -N "" -t {{ item.type }}
    -f {{ nfs_root }}/root/etc/ssh/ssh_host_{{ item.type }}_key
  with_items:
    - {type: rsa}
    - {type: ecdsa}
    - {type: ed25519}
  when: not fixpi_ssh_host_key_stat.stat.exists
  tags:
    - netboot
    - qemu
