---
- {name: Install the Pi state management scripts, ansible.builtin.include_tasks: manage.yml}
- {name: Prepare the NFS root and TFTP tree for netboot, ansible.builtin.include_tasks: netboot.yml, tags: [pibs, netboot]}
# sunxi-image.yml bakes the armmp kernel into every image (CI build only);
# sunxi.yml publishes it to TFTP on sites that declare sunxi_boards.
- {name: Bake the Orange Pi armmp kernel into the image, ansible.builtin.include_tasks: sunxi-image.yml, tags: [sunxi], when: fixpi_image_build | bool}
- {name: Publish the Orange Pi kernel and DTBs to TFTP, ansible.builtin.include_tasks: sunxi.yml, tags: [sunxi], when: sunxi_boards is defined}
# Before userconf.yml: its authorized_keys.yml writes the ansible user's key
# into the .ssh dir this prepares.
- {name: Prepare the ansible user's home for its key, ansible.builtin.include_tasks: ansible-home.yml, tags: [keys]}
- {name: "Set the pi user's password and console banner", ansible.builtin.include_tasks: userconf.yml, tags: [pipw, keys]}
- {name: Apply the NFS root tweaks, ansible.builtin.include_tasks: tweeks.yml, tags: [fixpi]}
- {name: Stop the root filesystem resizing and the swap file, ansible.builtin.include_tasks: nogrow.yml, tags: [fixpi]}
# Server-side TT site catalogue (pull-mode roots never see onpi/tt.yml).
- {name: Bake the TT site catalogue into the NFS root, ansible.builtin.include_tasks: tt-site.yml, when: tt_boards is defined}
# Server-side fleet agent config (same reason).
- {name: Bake the fleet agent config into the NFS root, ansible.builtin.include_tasks: fleet-site.yml, when: fleet_broker | default(false)}
