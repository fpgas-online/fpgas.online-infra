---
- {name: Install the Pi state management scripts, ansible.builtin.include_tasks: manage.yml}
- {name: Prepare the NFS root and TFTP tree for netboot, ansible.builtin.include_tasks: netboot.yml}
# sunxi-image.yml bakes the armmp kernel into every image (CI build only);
# sunxi.yml publishes it to TFTP on sites that declare sunxi_boards.
- {name: Bake the Orange Pi armmp kernel into the image, ansible.builtin.include_tasks: sunxi-image.yml, when: fixpi_image_build | bool}
- {name: Publish the Orange Pi kernel and DTBs to TFTP, ansible.builtin.include_tasks: sunxi.yml, when: sunxi_boards is defined}
# The site layer: the pi password, the root's authorized_keys and the pi/root
# keypairs. Never in the CI image build (fixpi_image_build): the published
# image is public and shared by every site, so each gateway applies its own
# after extraction. ci-nfsroot.yml fails the build if the image carries any
# of it anyway. tests/test_fixpi_site_layer.py holds every task that writes
# the password or a key behind this gate.
# Before userconf.yml: its authorized_keys.yml writes the ansible user's key
# into the .ssh dir this prepares.
- {name: Prepare the ansible user's home for its key, ansible.builtin.include_tasks: ansible-home.yml, when: not (fixpi_image_build | bool)}
- {name: "Set the pi user's password and console banner", ansible.builtin.include_tasks: userconf.yml, when: not (fixpi_image_build | bool)}
- {name: Apply the NFS root tweaks, ansible.builtin.include_tasks: tweeks.yml}
- {name: Stop the root filesystem resizing and the swap file, ansible.builtin.include_tasks: nogrow.yml}
# Server-side enablement of the Tiny Tapeout bridge (pull-mode roots never see onpi/tt.yml).
- {name: Enable the Tiny Tapeout bridge in the NFS root, ansible.builtin.include_tasks: tt-site.yml, when: tt_boards is defined}
# Server-side fleet agent config (same reason).
- {name: Bake the fleet agent config into the NFS root, ansible.builtin.include_tasks: fleet-site.yml, when: fleet_broker | default(false)}
- {name: Write the site's IPv6 base prefix into the NFS root, ansible.builtin.include_tasks: ipv6-site.yml, when: not (fixpi_image_build | bool)}
