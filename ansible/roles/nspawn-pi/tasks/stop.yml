---
# Finish the Pi NFS root chroot session: lift the build-time initramfs
# suppression, do the kernel maintenance that needs the chroot, then drop the
# mounts and policy-rc.d.

# Back to the distro's own file before anything below runs update-initramfs,
# and before the root is published or booted: a root left saying
# update_initramfs=no would silently never refresh an initramfs again.
- name: Restore the root's update-initramfs.conf
  ansible.builtin.command:
    cmd: >-
      mv {{ nspawn_root }}/etc/initramfs-tools/update-initramfs.conf.fpgas-build
         {{ nspawn_root }}/etc/initramfs-tools/update-initramfs.conf
    removes: "{{ nspawn_root }}/etc/initramfs-tools/update-initramfs.conf.fpgas-build"

- name: Prune kernels and refresh initramfs images in the NFS root
  ansible.builtin.include_tasks: kernels.yml

- name: Unmount chroot bind mounts
  shell: |
    umount "{{ nspawn_root }}/dev/pts" 2>/dev/null || true
    umount "{{ nspawn_root }}/dev" 2>/dev/null || true
    umount "{{ nspawn_root }}/sys" 2>/dev/null || true
    umount "{{ nspawn_root }}/proc" 2>/dev/null || true
    if mountpoint -q "{{ nspawn_root }}/var/cache/apt/archives"; then
      umount "{{ nspawn_root }}/var/cache/apt/archives"
    fi
  changed_when: false

- name: Remove policy-rc.d
  file:
    path: "{{ nspawn_root }}/usr/sbin/policy-rc.d"
    state: absent

- name: Resume man-db's index rebuilds
  ansible.builtin.command:
    cmd: >-
      mv {{ nspawn_root }}/var/lib/man-db/auto-update.fpgas-build
         {{ nspawn_root }}/var/lib/man-db/auto-update
    removes: "{{ nspawn_root }}/var/lib/man-db/auto-update.fpgas-build"

- name: Remove the build-time dpkg unsafe-io setting
  file:
    path: "{{ nspawn_root }}/etc/dpkg/dpkg.cfg.d/zz-fpgas-build-unsafe-io"
    state: absent
