---
# Make the Pi NFS root safe and cheap to run apt against from outside.
#
# Shared by the production path (start.yml, systemd-nspawn + sshd + qemu
# user emulation on the server) and the CI build (ci-nfsroot.yml, the chroot
# connection plugin on a native arm64 runner), so both get identical chroot
# semantics and neither can drift.

- name: Copy the kernel maintenance helper to the server
  ansible.builtin.copy:
    src: nfsroot_kernels.py
    dest: /usr/local/sbin/nfsroot-kernels
    mode: "0755"

- name: Mount filesystems for chroot
  ansible.builtin.shell: |
    mountpoint -q "{{ nspawn_root }}/proc" || mount --bind /proc "{{ nspawn_root }}/proc"
    mountpoint -q "{{ nspawn_root }}/sys" || mount --bind /sys "{{ nspawn_root }}/sys"
    mountpoint -q "{{ nspawn_root }}/dev" || mount --bind /dev "{{ nspawn_root }}/dev"
    mountpoint -q "{{ nspawn_root }}/dev/pts" || mount --bind /dev/pts "{{ nspawn_root }}/dev/pts"
  changed_when: false

- name: Install policy-rc.d to suppress service starts during apt
  ansible.builtin.copy:
    dest: "{{ nspawn_root }}/usr/sbin/policy-rc.d"
    content: |
      #!/bin/sh
      exit 101
    mode: "0755"

# Raspbian ships update_initramfs=all, which makes a *bare* `update-initramfs
# -u` rebuild an initramfs for EVERY installed kernel.  raspi-firmware's
# postinst runs exactly that on each of its own upgrades, so on tweed
# 2026-09-23 a raspi-firmware point release rebuilt eight initramfs images
# (four 6.12.96 flavours, three 6.12.109, plus the 164 MB Debian armmp tree)
# inside the armhf chroot under qemu-user-static: `cam/pi : apt update/upgrade`
# took 6232 s of the 1 h 53 m run, and produced images nothing had changed.
#
# `no` stops only that blanket rebuild.  The kernel postinst hook
# (/etc/kernel/postinst.d/initramfs-tools) calls `update-initramfs -c -k
# $version`, and create mode does not consult this setting -- so a newly
# installed kernel still gets its initramfs, and raspi-firmware still copies
# it into /boot/firmware.  Anything that went stale without a new kernel is
# rebuilt once at the end of the session, by exactly the versions that need it
# (nspawn-pi/tasks/kernels.yml).
- name: Suppress blanket initramfs regeneration during the chroot apt runs
  when: nfsroot_suppress_initramfs | default(true)
  block:
    # Stashed rather than rewritten from a template so stop.yml can put back
    # the distro's own bytes, whatever they are.
    - name: Stash the root's update-initramfs.conf
      ansible.builtin.command:
        cmd: >-
          mv {{ nspawn_root }}/etc/initramfs-tools/update-initramfs.conf
             {{ nspawn_root }}/etc/initramfs-tools/update-initramfs.conf.fpgas-build
        removes: "{{ nspawn_root }}/etc/initramfs-tools/update-initramfs.conf"
        creates: "{{ nspawn_root }}/etc/initramfs-tools/update-initramfs.conf.fpgas-build"

    - name: Write the build-time update-initramfs.conf
      ansible.builtin.copy:
        dest: "{{ nspawn_root }}/etc/initramfs-tools/update-initramfs.conf"
        content: |
          # Written by fpgas.online-infra roles/nspawn-pi/tasks/chroot-prep.yml
          # for the duration of a chroot provisioning session; stop.yml restores
          # the distro file from update-initramfs.conf.fpgas-build.  See that
          # task's comment for why a blanket rebuild is never wanted here.
          update_initramfs=no
          backup_initramfs=no
        mode: "0644"

# Every kernel in this root arrives as an automatic dependency of a meta
# package, so `apt-get autoremove` (roles/onpi/tasks/apt.yml, every pass)
# deletes the one the fleet is actually booting as soon as the meta package
# moves on -- that is what emptied the four 6.6.31 module trees on tweed on
# 2026-09-23. Marking the served kernels manual makes autoremove leave them
# alone; which kernel that is follows the TFTP payload, so the `netboot` tag
# still owns fleet kernel changes. Must run BEFORE the Pi roles' apt runs.
- name: Protect the kernels the TFTP payload serves from autoremove
  ansible.builtin.command:
    cmd: >-
      /usr/local/sbin/nfsroot-kernels
      --nfs-root {{ nfs_root }} --tftp-root {{ tftp_root }}
      protect
  register: nspawn_kernel_protect
  changed_when: "'set to manually installed' in nspawn_kernel_protect.stdout"
