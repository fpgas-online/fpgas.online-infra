---
# Read-only probe (noqa: command-instead-of-module): see roles/webrtc's verify.
- name: Check the receiver service is active  # noqa: command-instead-of-module
  ansible.builtin.command: systemctl is-active netconsole-recv
  changed_when: false

- name: Check the receiver is enabled  # noqa: command-instead-of-module
  ansible.builtin.command: systemctl is-enabled netconsole-recv
  changed_when: false

- name: List the UDP listeners
  ansible.builtin.command: ss -H -lun
  changed_when: false
  register: netconsole_verify_listeners

- name: Check the receiver listens on its address and port
  ansible.builtin.assert:
    that: >-
      netconsole_verify_listeners.stdout_lines
      | select('search', (netconsole_address ~ ':' ~ netconsole_port) | regex_escape ~ '\s')
      | list | length == 1
    fail_msg: "nothing listens on UDP {{ netconsole_address }}:{{ netconsole_port }}: {{ netconsole_verify_listeners.stdout }}"

- name: Stat the log directory
  ansible.builtin.stat:
    path: "{{ netconsole_dir }}"
  register: netconsole_verify_dir

- name: Check the log directory is the receiver's and readable by others
  ansible.builtin.assert:
    that:
      - netconsole_verify_dir.stat.isdir
      - netconsole_verify_dir.stat.pw_name == netconsole_user
      - netconsole_verify_dir.stat.mode == '0755'

# End to end: a datagram sent to the listening address arrives in a file named for the
# sender (the address the kernel picks as the source, this gateway's own), through the
# firewall's input chain.
- name: Send a probe datagram to the receiver
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - |
        import socket, sys
        s = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
        s.connect((sys.argv[1], int(sys.argv[2])))
        s.send(sys.argv[3].encode())
        print(s.getsockname()[0])
      - "{{ netconsole_address }}"
      - "{{ netconsole_port }}"
      - "netconsole-recv verify probe {{ ansible_date_time.epoch }}"
  changed_when: false
  register: netconsole_verify_probe

- name: Wait for the probe line in the sender's file
  ansible.builtin.command:
    argv:
      - grep
      - -E
      - "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:.]+[+-][0-9]{2}:[0-9]{2} netconsole-recv verify probe {{ ansible_date_time.epoch }}$"
      - "{{ netconsole_dir }}/{{ netconsole_verify_probe.stdout | trim }}.log"
  changed_when: false
  register: netconsole_verify_line
  until: netconsole_verify_line.rc == 0
  retries: 10
  delay: 1

- name: Stat the sender's file
  ansible.builtin.stat:
    path: "{{ netconsole_dir }}/{{ netconsole_verify_probe.stdout | trim }}.log"
  register: netconsole_verify_file

- name: Check the sender's file is readable by others
  ansible.builtin.assert:
    that: netconsole_verify_file.stat.mode == '0644'

- name: Check logrotate accepts the rotation config
  ansible.builtin.command: logrotate --debug /etc/logrotate.d/netconsole
  changed_when: false
