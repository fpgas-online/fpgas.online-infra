---
# A Pi role: runs against the NFS root through the chroot connection plugin in
# ci-nfsroot.yml, so this installs into the image every board boots rather than
# onto one host. A rescue tool that lives on only one Pi is not there when that
# Pi is the one that needs rescuing.

- name: Install Raspberry Pi USB device-boot tooling
  ansible.builtin.apt:
    name: "{{ usbboot_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 86400
  tags: [usbboot]

# Verify the EFFECT rather than that apt was asked. Both checks matter and for
# different reasons: the binary is what the operator runs, and the msd payload
# is what it pushes. A package that installed the tool without its firmware
# directory would look fine to dpkg and fail at the moment it is needed.
#
# These assertions live inside the role, so disabling the role disables them
# too -- unlike ci-nfsroot.yml's dpkg-query loop, which is unconditional and
# would fail the build for anyone who turned the feature off.
- name: Stat the rpiboot binary and its legacy msd payload
  ansible.builtin.stat:
    path: "{{ item }}"
  register: usbboot_paths
  loop:
    - /usr/bin/rpiboot
    - /usr/share/rpiboot/msd/bootcode.bin
  tags: [usbboot]

- name: Assert rpiboot and its msd payload are present in the NFS root
  ansible.builtin.assert:
    that: item.stat.exists
    success_msg: "{{ item.item }} is in the NFS root"
    fail_msg: >-
      {{ item.item }} is missing after installing rpiboot, so a board booting
      this NFS root could not USB-boot a stranded Pi.
  loop: "{{ usbboot_paths.results }}"
  loop_control:
    label: "{{ item.item }}"
  tags: [usbboot]
