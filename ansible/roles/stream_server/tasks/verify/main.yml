---
- name: Check nginx modules-enabled directory exists
  stat:
    path: /etc/nginx/modules-enabled
  register: stream_server_nginx_modules_stat

- name: Assert nginx modules-enabled directory exists
  assert:
    that: stream_server_nginx_modules_stat.stat.exists and stream_server_nginx_modules_stat.stat.isdir
    fail_msg: "/etc/nginx/modules-enabled directory not found"

# The DVR window is sized for disk, not RAM: 10 min of fragments is ~300 MB
# per stream, ~6 GB for 20 streams. It landed on a 3.9 GB tmpfs once already,
# because the guard on the unmount used ansible_facts.mounts, which omits
# tmpfs and so could never fire. Assert the outcome, not the mechanism.
- name: Check what filesystem the hls directory is on
  ansible.builtin.command: findmnt --noheadings --output FSTYPE --target {{ streaming.data_root }}/hls
  register: stream_server_hls_fstype
  changed_when: false
  check_mode: false

- name: Assert the hls DVR directory is not a tmpfs
  assert:
    that: stream_server_hls_fstype.stdout | trim != "tmpfs"
    fail_msg: >-
      {{ streaming.data_root }}/hls is on tmpfs
      ({{ stream_server_hls_fstype.stdout | trim }}): the HLS DVR window would fill RAM.

- name: Check the hls fragment directory exists on that filesystem
  stat:
    path: "{{ streaming.data_root }}/hls/source"
  register: stream_server_hls_source_stat

- name: Assert the hls fragment directory exists
  assert:
    that: stream_server_hls_source_stat.stat.exists and stream_server_hls_source_stat.stat.isdir
    fail_msg: >-
      {{ streaming.data_root }}/hls/source is missing - nginx-rtmp has nowhere
      to write fragments (created inside the tmpfs before it was unmounted?).
