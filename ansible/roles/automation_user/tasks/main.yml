---
# The server's automation account: exists, passwordless sudo, trusts the
# automation key. Human operators get their own accounts (roles/operators).
#
# The password is left alone: the preseed locks it ("!") and
# ansible.builtin.user without `password` neither sets nor unlocks it.
- name: Create the automation account
  ansible.builtin.user:
    name: "{{ automation_user_name }}"
    shell: /bin/bash
    create_home: true
  tags:
    - automation-user

- name: Passwordless sudo for the automation account
  ansible.builtin.copy:
    content: "{{ automation_user_name }} ALL=(ALL) NOPASSWD:ALL\n"
    dest: "/etc/sudoers.d/{{ automation_user_name }}"
    owner: root
    group: root
    mode: "0440"
    validate: "visudo -cf %s"
  tags:
    - automation-user

# Additive, not exclusive: the preseed's authorized_keys is the only other
# writer and serves exactly this key today, but the live file on an
# already-installed server is not audited here, and an exclusive write
# would silently drop any key another automation (hetzner-ansible's
# ansible@hetzner-infrastructure, say) was added with. Converging over an
# unknown file must never lock anything out of the account every play
# connects as.
- name: Authorize the automation key
  ansible.posix.authorized_key:
    user: "{{ automation_user_name }}"
    key: "{{ automation_user_public_key }}"
    state: present
  tags:
    - automation-user
