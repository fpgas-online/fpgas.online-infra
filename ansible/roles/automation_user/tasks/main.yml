---
# The server's automation account: exists, passwordless sudo, trusts the
# fpgas.online-ansible automation key and no other. Human operators get
# their own accounts (roles/operators).
#
# The password is left alone: the preseed locks it ("!") and
# ansible.builtin.user without `password` neither sets nor unlocks it.
- name: Create the automation account
  ansible.builtin.user:
    name: "{{ automation_user_name }}"
    shell: /bin/bash
    create_home: true

- name: Passwordless sudo for the automation account
  ansible.builtin.copy:
    content: "{{ automation_user_name }} ALL=(ALL) NOPASSWD:ALL\n"
    dest: "/etc/sudoers.d/{{ automation_user_name }}"
    owner: root
    group: root
    mode: "0440"
    validate: "visudo -cf %s"

# Exclusive: the account trusts the automation key and nothing else (the
# design since rebuild #2 P2-1, and what tweed's live file held when this
# role took it over: exactly the fpgas.online-ansible key). A key added by
# hand is removed on the next converge instead of lingering unaudited.
#
# An exclusive write of the WRONG key would lock every play out of the
# server, so first prove the public key about to be written is the one the
# controller authenticates with: derive it from the private key itself
# (passphrase-less by design; -P '' fails instead of prompting) and compare.
- name: Derive the public key from the controller's automation private key
  ansible.builtin.command:
    argv: [ssh-keygen, -y, -P, "", -f, "{{ ansible_ssh_private_key_file }}"]
  delegate_to: localhost
  become: false
  changed_when: false
  check_mode: false  # read-only; --check needs the real key for the assert
  register: automation_user_derived_key

- name: Assert the key to authorize is the one ansible connects with
  ansible.builtin.assert:
    that:
      - automation_user_derived_key.stdout.split()[:2] == automation_user_public_key.split()[:2]
    fail_msg: >-
      {{ ansible_ssh_private_key_file }}.pub does not match
      {{ ansible_ssh_private_key_file }}: refusing to make it the only key
      the {{ automation_user_name }} account trusts.

- name: Authorize the automation key, and only it
  ansible.posix.authorized_key:
    user: "{{ automation_user_name }}"
    key: "{{ automation_user_public_key }}"
    exclusive: true
    state: present
