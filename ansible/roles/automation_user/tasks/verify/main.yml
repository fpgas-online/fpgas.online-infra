---
- name: "Verify: automation account exists"
  ansible.builtin.getent:
    database: passwd
    key: "{{ automation_user_name }}"

- name: "Verify: automation account sudoers file is valid"
  ansible.builtin.command: "visudo -cf /etc/sudoers.d/{{ automation_user_name }}"
  changed_when: false

- name: "Verify: read the automation account's authorized_keys"
  ansible.builtin.slurp:
    src: "{{ getent_passwd[automation_user_name][4] }}/.ssh/authorized_keys"
  register: automation_user_v_keys

# Exactly one key, and it is the automation key (tasks/main.yml writes the
# file exclusively).
- name: "Verify: assert the automation key is the only authorized key"
  ansible.builtin.assert:
    that:
      - automation_user_v_key_lines | length == 1
      - automation_user_v_key_lines[0].split()[:2] == automation_user_public_key.split()[:2]
    fail_msg: >-
      {{ getent_passwd[automation_user_name][4] }}/.ssh/authorized_keys should hold
      only the automation key ({{ automation_user_public_key.split()[2] | default('no comment') }});
      it holds {{ automation_user_v_key_lines | map('split') | map('last') | list }}
  vars:
    automation_user_v_key_lines: >-
      {{ (automation_user_v_keys.content | b64decode).splitlines()
         | reject('match', '^\\s*(#|$)') | list }}

# The end-to-end proof: a fresh SSH login as the account with the automation
# key, then sudo with no password (-n fails instead of prompting). Task vars
# outrank the inventory's ansible_user, so this logs in as the automation
# account whatever user the rest of the play connects as (debian on the
# VM test's server). become is off through the variable, not the keyword:
# tweed's host_vars set ansible_become, which outranks the keyword, and a
# become here would make both commands report root.
- name: "Verify: log in as the automation account and sudo without a password"
  ansible.builtin.command:
    argv: [sh, -c, "id -un && sudo -n id -un"]
  vars:
    ansible_user: "{{ automation_user_name }}"
    ansible_become: false
  changed_when: false
  check_mode: false  # read-only; --check needs the real answer
  register: automation_user_v_login

- name: "Verify: assert the login and the passwordless sudo"
  ansible.builtin.assert:
    that:
      - automation_user_v_login.stdout_lines == [automation_user_name, 'root']
    fail_msg: "login as {{ automation_user_name }} + sudo -n gave {{ automation_user_v_login.stdout_lines }}"
