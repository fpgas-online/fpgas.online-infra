---
# How the gateway's own apt reaches the network: through a site caching
# proxy, when the site has one. (The Pi NFS root's apt is roles/apt_cache's:
# it goes through the gateway's own cache.) Both proxy settings empty = apt
# fetches straight from each source.

# The site proxy every source goes through: Acquire::http::Proxy. apt sends
# https sources through it as well, as a CONNECT tunnel -- which
# apt-cacher-ng refuses (403), so with this set an https source only works
# through apt_client_https_cache below. verify fails any that is not.
apt_client_proxy: ""

# The same proxy's https front end, e.g. https://apt-proxy.welland.mithis.com
# (ten64's apt-cacher-ng, mithro/welland-ansible-rpi roles/apt_proxy). It
# caches an https repository only through a remap: the repository is at
# <this>/<remap path>/, and the remap has to exist there first. apt connects
# to this host directly (it cannot tunnel to the proxy through itself), and
# that is the only host it does.
apt_client_https_cache: ""

# How many requests apt sends down one connection before the first answer
# (Acquire::http::Pipeline-Depth; it covers https sources too). With apt's
# default pipelining, a download from deb.debian.org sometimes goes silent
# until apt's 30 s timeout, then apt reconnects. Packet captures in the VM
# test showed the silence on the runner's side of QEMU's network too, so it
# is not the VM: it is the mirror, its CDN or the path. With 0, five VM test runs had
# none of these stalls; 22 of the 25 runs before had 1-5 of them (issue
# #172, which has the measurements).
apt_client_http_pipeline_depth: 0

# apt.conf.d files this role replaced. Removed so apt reads only what the
# variables above configure.
#   50nfsroot-watchdog-direct: hand-placed on tweed 2026-09-25 to fetch
#     https://fpgas.online/nfsroot-watchdog straight from upstream, around
#     the proxy's 403 (the rejected infra #120).
apt_client_retired_confs:
  - 50nfsroot-watchdog-direct
