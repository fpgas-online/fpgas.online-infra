---
# The gateway's apt proxy settings (defaults/main.yml). One file owns them,
# so what the host's apt goes through is in this repo rather than left to
# whatever its installer wrote.

- name: Configure apt's HTTP pipelining
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/02site-pipelining
    content: |
      // roles/apt_client (defaults/main.yml: apt_client_http_pipeline_depth)
      Acquire::http::Pipeline-Depth "{{ apt_client_http_pipeline_depth }}";
    mode: '0644'

- name: Configure the site apt proxy
  ansible.builtin.template:
    src: site-proxy.conf.j2
    dest: /etc/apt/apt.conf.d/01site-proxy
    mode: '0644'
  when: apt_client_proxy | length > 0 or apt_client_https_cache | length > 0

- name: Remove the site apt proxy configuration
  ansible.builtin.file:
    path: /etc/apt/apt.conf.d/01site-proxy
    state: absent
  when: apt_client_proxy | length == 0 and apt_client_https_cache | length == 0

# The Debian installer writes the proxy it was given to /etc/apt/apt.conf,
# which apt reads after apt.conf.d, so it would override 01site-proxy.
- name: Remove the installer's apt proxy line
  ansible.builtin.lineinfile:
    path: /etc/apt/apt.conf
    regexp: '^\s*Acquire::http::Proxy\s'
    state: absent
  when: apt_client_proxy | length > 0

- name: Remove retired apt proxy configuration
  ansible.builtin.file:
    path: "/etc/apt/apt.conf.d/{{ item }}"
    state: absent
  loop: "{{ apt_client_retired_confs }}"
