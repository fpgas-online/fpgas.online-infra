---
# Deploy the packaged Django project (pip package fpgas-online-site, installed
# by fpgas-online-site.yml into {{ django_dir }}/venv).
#
# The wheel ships the `pib` project package (settings.py, urls.py, asgi.py).
# We copy those files OUT of site-packages into {{ django_dir }}/pib so that:
#   - BASE_DIR (and therefore db.sqlite3) resolves to {{ django_dir }};
#   - the Ansible-written pib/local_settings.py sits next to settings.py
#     (pib.settings ends with `from pib.local_settings import *`);
#   - the services' WorkingDirectory={{ django_dir }} puts that copy first on
#     sys.path (gunicorn chdir, daphne's sys.path.insert(0, "."), uvicorn's
#     --app-dir .), shadowing the one in site-packages.
# This is the contract tests/test_packaging.py in fpgas.online-site spells out.
# No manage.py ships in the wheel, so one is generated here; all management
# commands run through it with the venv python (no community.general needed).

- name: site directories
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ user_name }}"
    group: www-data
    mode: "0755"
  loop:
    - "{{ django_dir }}"
    - "{{ django_dir }}/{{ django_project_name }}"
    - "{{ static_dir }}"
  tags:
    - django

- name: locate the installed project package
  command: >-
    {{ django_dir }}/venv/bin/python -c
    "import os, {{ django_project_name }} as p; print(os.path.dirname(p.__file__))"
  register: site_project_pkg
  changed_when: false
  tags:
    - django

- name: install the project files from the wheel (local_settings.py is not in the wheel)
  copy:
    src: "{{ site_project_pkg.stdout }}/{{ item }}"
    dest: "{{ django_dir }}/{{ django_project_name }}/{{ item }}"
    remote_src: true
    owner: "{{ user_name }}"
    group: www-data
    mode: "0644"
  loop:
    - __init__.py
    - settings.py
    - urls.py
    - asgi.py
  notify:
    - restart gunicorn
    - restart daphne
    - restart uvicorn
  tags:
    - django

- name: manage.py
  copy:
    dest: "{{ django_dir }}/manage.py"
    content: |
      #!{{ django_dir }}/venv/bin/python
      # Generated by fpgas.online-infra roles/site (the wheel ships no manage.py).
      import os
      import sys

      if __name__ == "__main__":
          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "{{ django_project_name }}.settings")
          from django.core.management import execute_from_command_line
          execute_from_command_line(sys.argv)
    owner: "{{ user_name }}"
    group: www-data
    mode: "0755"
  tags:
    - django

# A per-host SECRET_KEY, generated once and kept out of the inventory.
- name: generate a SECRET_KEY once
  shell: >-
    umask 077 && {{ django_dir }}/venv/bin/python -c
    "import secrets; print(secrets.token_urlsafe(50))" > {{ django_dir }}/.secret_key
  args:
    creates: "{{ django_dir }}/.secret_key"
  tags:
    - django

- name: read the SECRET_KEY
  slurp:
    src: "{{ django_dir }}/.secret_key"
  register: site_secret_key
  no_log: true
  tags:
    - django

- name: seed local_settings.py (once; individual keys are owned below)
  copy:
    dest: "{{ django_dir }}/{{ django_project_name }}/local_settings.py"
    content: "# Managed by fpgas.online-infra roles/site: the keys below are set by Ansible.\n"
    force: false
    owner: "{{ user_name }}"
    group: www-data
    mode: "0640"
  tags:
    - django

- name: local settings
  lineinfile:
    path: "{{ django_dir }}/{{ django_project_name }}/local_settings.py"
    regexp: "^{{ item.key }} = "
    line: "{{ item.key }} = {{ item.value }}"
  loop:
    - key: DEBUG
      value: "False"
    - key: SECRET_KEY
      value: "{{ (site_secret_key.content | b64decode | trim) | to_json }}"
    - key: ALLOWED_HOSTS
      value: >-
        {{ ([eth_uplink_static_address, domain_name] + (site_extra_allowed_hosts | default([])))
           | unique | to_json }}
    - key: CSRF_TRUSTED_ORIGINS
      value: >-
        {{ (['https://' ~ domain_name] + (site_extra_csrf_origins | default([])))
           | unique | to_json }}
    - key: PI_PW
      value: "'{{ pi_pw | b64encode }}'"
    - key: DOMAIN_NAME
      value: "'{{ domain_name }}'"
    - key: STATIC_ROOT
      value: "'{{ static_dir }}'"
  loop_control:
    label: "{{ item.key }}"
  no_log: "{{ item.key in ['SECRET_KEY', 'PI_PW'] }}"
  notify:
    - restart gunicorn
    - restart daphne
    - restart uvicorn
  tags:
    - django

- name: migrate
  command: "{{ django_dir }}/venv/bin/python manage.py migrate --noinput"
  args:
    chdir: "{{ django_dir }}"
  become_user: "{{ user_name }}"
  register: site_migrate
  changed_when: "'No migrations to apply' not in site_migrate.stdout"
  tags:
    - django

- name: collectstatic
  command: "{{ django_dir }}/venv/bin/python manage.py collectstatic --noinput"
  args:
    chdir: "{{ django_dir }}"
  become_user: "{{ user_name }}"
  register: site_collectstatic
  changed_when: "'0 static files copied' not in site_collectstatic.stdout"
  tags:
    - django

# Legacy MAC-table hosts (ps1) load their pibfpgas.pi rows from a fixture by
# name; per-port VLAN hosts define no fixture_path. (The fixture files live in
# the fpgas.online-site repo; they must be on Django's fixture path to load.)
- name: load the initial data fixture
  command: "{{ django_dir }}/venv/bin/python manage.py loaddata {{ fixture_path }}"
  args:
    chdir: "{{ django_dir }}"
  become_user: "{{ user_name }}"
  when: fixture_path is defined
  changed_when: true
  tags:
    - django
