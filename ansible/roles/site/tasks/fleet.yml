---
# Fleet self-registration consumer (fpgas.online-infra#47): a management
# command that subscribes to the site broker and ingests registrations,
# status beats and boot events into the fleet app. Included from main.yml
# guarded by fleet_broker.
- name: Fleet-consumer systemd unit
  ansible.builtin.template:
    src: templates/fleet-consumer.service.j2
    dest: /etc/systemd/system/fleet-consumer.service
    mode: "0644"
  notify: Restart fleet-consumer

- name: Enable fleet-consumer
  ansible.builtin.systemd:
    service: fleet-consumer.service
    daemon_reload: true
    enabled: true
    state: started
