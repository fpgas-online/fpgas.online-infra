---
# Install the fpgas.online Django site and PoE switch management packages.
# Replaces the per-app pip installs from the old carlfk/pici monorepo.

- name: Install fpgas.online Django site
  ansible.builtin.pip:
    name:
      - "fpgas-online-site @ git+https://github.com/fpgas-online/fpgas.online-site.git"
      - "fpgas-online-poe[cli] @ git+https://github.com/fpgas-online/fpgas.online-poe.git"
    virtualenv: "{{ django_dir }}/venv"
    state: forcereinstall
  # a new wheel means new templates/code: the running gunicorn/daphne keep
  # serving the old ones until restarted (fleet-consumer runs from the same
  # venv; its handler no-ops on hosts without fleet_broker)
  notify:
    - restart django services
    - restart fleet-consumer
  tags:
    - django

# Servers + the Channels redis layer (pib.settings uses channels_redis, which
# the site package does not declare). Installed here, before the unit files
# in gunicorn.yml/uvicorn.yml/daphne.yml, so the first start of gunicorn
# (uvicorn worker class) does not race the uvicorn install.
- name: Install the app servers and channels-redis
  ansible.builtin.pip:
    name:
      - gunicorn
      - uvicorn
      - daphne
      - channels-redis
    virtualenv: "{{ django_dir }}/venv"
  tags:
    - django
