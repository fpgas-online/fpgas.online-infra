---
# pistat - real-time Pi status via WebSocket
# The dnsmasq send_stat.conf hook that used to be deployed here was broken
# on the VLAN-per-port scheme; roles/board-access removes it and installs
# the gateway's dhcp-script hook instead.
# pip install handled by fpgas-online-site.yml
# Pi-side scripts (send.py, send_stat.py) are in the fpgas-online-setup-pi deb

- name: Install redis
  apt:
    name:
      - redis
  tags:
    - pistat
