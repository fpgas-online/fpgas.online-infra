---
# nginx itself: this role writes into /etc/nginx before wssh and
# stream_server (which used to be the only roles installing it) run later
# in the same play. On a fresh host the port-80 vhost task below failed with
# "Destination directory /etc/nginx/sites-enabled does not exist" (main CI,
# 2026-08-24). nginx-extras is what stream_server needs (rtmp/fancyindex
# modules), so install that flavour here rather than plain nginx.
- name: Install nginx
  apt:
    name:
      - nginx-extras

- name: Remove unneeded nginx conf
  file:
    path: "/etc/nginx/{{ item }}"
    state: absent
  with_items:
    - sites-enabled/default
    - sites-enabled/pxe

- name: Create etc/nginx/includes dir
  ansible.builtin.file:
    path: /etc/nginx/includes
    state: directory

# Port 80 catch-all: serve ACME http-01 challenges from the webroot and send
# everything else to https.  Replaces Debian's stock `default` vhost (removed
# above); nginx otherwise picks an arbitrary vhost as default_server.
- name: Port-80 default vhost (ACME + https redirect)
  template:
    src: templates/00-http-default.conf.j2
    dest: /etc/nginx/sites-enabled/00-http-default.conf
    mode: "0644"
  notify: Reload nginx

# The vhost (templates/nginx.conf.j2 / certbot's https conf) is just
# `include includes/{{ conference_name }}-*.conf;` -- these are the location
# blocks that actually route the Django apps to gunicorn (/run/gunicorn.sock)
# and the pistat WebSocket to daphne. They were lost in the monorepo split
# (tweed still carried the 2025 copies by hand).
- name: Nginx location includes for the Django apps
  template:
    src: "includes/{{ item }}.conf.j2"
    dest: "/etc/nginx/includes/{{ conference_name }}-{{ item }}.conf"
    mode: "0644"
  loop:
    - pibfpgas
    - pistat
    - pibup
    - snmp_switch
  notify: Reload nginx

- name: Nginx location include for the fleet pages
  template:
    src: includes/fleet.conf.j2
    dest: "/etc/nginx/includes/{{ conference_name }}-fleet.conf"
    mode: "0644"
  when: fleet_broker | default(false)
  notify: Reload nginx
