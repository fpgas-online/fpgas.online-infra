# gunicorn (uvicorn worker) behind /run/gunicorn.sock; pip install is in
# fpgas-online-site.yml.
---
- name: copy gunicorn socket file to /etc/systemd/system/gunicorn.socket
  template:
    src: templates/gunicorn.socket.j2
    dest: /etc/systemd/system/gunicorn.socket
  notify: restart gunicorn

- name: copy gunicorn systemd file to /etc/systemd/system/gunicorn.service
  template:
    src: templates/gunicorn.service.j2
    dest: /etc/systemd/system/gunicorn.service
  notify: restart gunicorn
  tags:
    - django

- name: Enable services
  systemd:
    service: "{{ item }}"
    daemon_reload: true
    enabled: true
    state: started
  with_items:
    - gunicorn.socket
    - gunicorn.service
