---
- name: Check nginx package installed
  command: dpkg -s nginx
  changed_when: false
  register: site_dpkg_nginx

- name: Assert nginx is installed
  assert:
    that: site_dpkg_nginx.rc == 0
    fail_msg: "nginx package is not installed"

- name: Check nginx service active
  command: systemctl is-active nginx
  changed_when: false
  register: site_nginx_active
  failed_when: false

- name: Assert nginx service is active
  assert:
    that: site_nginx_active.stdout == "active"
    fail_msg: "nginx service is not active (got: {{ site_nginx_active.stdout }})"

- name: Check Django venv python exists
  stat:
    path: "{{ django_dir }}/venv/bin/python"
  register: site_venv_python_stat
  tags: [verify, django]

- name: Assert Django venv python exists
  assert:
    that: site_venv_python_stat.stat.exists
    fail_msg: "Django venv python not found at {{ django_dir }}/venv/bin/python"
  tags: [verify, django]

- name: Check the Django app services are active
  command: systemctl is-active {{ item }}
  changed_when: false
  register: site_app_services
  loop: [gunicorn.socket, gunicorn.service, daphne.service, uvicorn.service, redis-server.service]
  failed_when: false
  tags: [verify, django]

- name: Assert the Django app services are active
  assert:
    that: item.stdout == "active"
    fail_msg: "{{ item.item }} is not active (got: {{ item.stdout }})"
  loop: "{{ site_app_services.results }}"
  loop_control:
    label: "{{ item.item }}"
  tags: [verify, django]

- name: Check the Django app answers through the gunicorn socket
  command: >-
    curl -s -o /dev/null -w '%{http_code}' --unix-socket /run/gunicorn.sock
    -H 'Host: {{ domain_name }}' http://localhost/fpgas/
  changed_when: false
  register: site_http_probe
  tags: [verify, django]

- name: Assert the Django app answers (2xx/3xx)
  assert:
    that: site_http_probe.stdout is match('^[23]')
    fail_msg: "GET /fpgas/ via /run/gunicorn.sock returned HTTP {{ site_http_probe.stdout }}"
  tags: [verify, django]
