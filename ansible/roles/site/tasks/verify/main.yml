---
- name: Check nginx package installed
  ansible.builtin.command: dpkg -s nginx
  changed_when: false
  register: site_dpkg_nginx

- name: Assert nginx is installed
  ansible.builtin.assert:
    that: site_dpkg_nginx.rc == 0
    fail_msg: "nginx package is not installed"

# Read-only probe (noqa: command-instead-of-module): systemd_service needs an
# action (state/enabled/masked/daemon_reload), and service_facts reports only
# running/stopped, not the ActiveState string the assert and its message use.
- name: Check nginx service active  # noqa: command-instead-of-module
  ansible.builtin.command: systemctl is-active nginx
  changed_when: false
  register: site_nginx_active
  failed_when: false

- name: Assert nginx service is active
  ansible.builtin.assert:
    that: site_nginx_active.stdout == "active"
    fail_msg: "nginx service is not active (got: {{ site_nginx_active.stdout }})"

- name: Check Django venv python exists
  ansible.builtin.stat:
    path: "{{ django_dir }}/venv/bin/python"
  register: site_venv_python_stat

- name: Assert Django venv python exists
  ansible.builtin.assert:
    that: site_venv_python_stat.stat.exists
    fail_msg: "Django venv python not found at {{ django_dir }}/venv/bin/python"

# Read-only probe (noqa: command-instead-of-module): systemd_service needs an
# action (state/enabled/masked/daemon_reload), and service_facts reports only
# running/stopped, not the ActiveState string the assert and its message use.
- name: Check the Django app services are active  # noqa: command-instead-of-module
  ansible.builtin.command: systemctl is-active {{ item }}
  changed_when: false
  register: site_app_services
  loop: [gunicorn.socket, gunicorn.service, daphne.service, uvicorn.service, redis-server.service]
  failed_when: false

- name: Assert the Django app services are active
  ansible.builtin.assert:
    that: item.stdout == "active"
    fail_msg: "{{ item.item }} is not active (got: {{ item.stdout }})"
  loop: "{{ site_app_services.results }}"
  loop_control:
    label: "{{ item.item }}"

# follow_redirects: none, like curl without -L: a 3xx is the answer. Only a
# failed connection (status -1) fails the probe itself, as curl's rc did.
- name: Check the Django app answers through the gunicorn socket
  ansible.builtin.uri:
    url: http://localhost/fpgas/
    unix_socket: /run/gunicorn.sock
    headers:
      Host: "{{ domain_name }}"
    follow_redirects: none
  register: site_http_probe
  failed_when: site_http_probe.status == -1

- name: Assert the Django app answers (2xx/3xx)
  ansible.builtin.assert:
    that: site_http_probe.status >= 200 and site_http_probe.status < 400
    fail_msg: "GET /fpgas/ via /run/gunicorn.sock returned HTTP {{ site_http_probe.status }}"

# --- under-construction banner ----------------------------------------------
# The banner is a line in local_settings.py, which nothing else validates: a
# host that silently lost it would keep serving pages that look fine. Assert
# the rendered page agrees with site_under_construction in BOTH directions, so
# this also proves ps1 is not showing a banner pointing at itself.
# Sec-Fetch-Dest: document because the middleware only banners top-level
# navigations -- curl sends no such header, and absent is treated as top level,
# but sending it keeps the probe honest about what it is asking for.

- name: Fetch /fpgas/ to check the under-construction banner
  ansible.builtin.uri:
    url: http://localhost/fpgas/
    unix_socket: /run/gunicorn.sock
    headers:
      Host: "{{ domain_name }}"
      Sec-Fetch-Dest: document
    follow_redirects: none
    return_content: true
  register: site_v_banner
  # Any HTTP status passes here, as with curl -s; the assert reads the body.
  failed_when: site_v_banner.status == -1

- name: Assert the under-construction banner matches site_under_construction
  ansible.builtin.assert:
    that: ('Under construction!' in site_v_banner.content) == (site_under_construction | bool)
    fail_msg: >-
      site_under_construction is {{ site_under_construction | bool }} but the banner is
      {{ 'present' if 'Under construction!' in site_v_banner.content else 'absent' }}
      on GET /fpgas/. Check UNDER_CONSTRUCTION in {{ django_dir }}/pib/local_settings.py.

# --- the site's time zone ----------------------------------------------------
# MANAGEMENT_TIME_ZONE is a line in local_settings.py; the dashboard names the
# zone it used in its footer. A page that says anything else (the gateway's own
# UTC, say) means the setting did not reach it.

- name: Fetch /management/fpgas/ to check the zone its times are in
  ansible.builtin.uri:
    url: http://localhost/management/fpgas/?reload=off
    unix_socket: /run/gunicorn.sock
    headers:
      Host: "{{ domain_name }}"
    follow_redirects: none
    return_content: true
  register: site_v_tz
  failed_when: site_v_tz.status != 200

- name: Assert the dashboard's times are in site_timezone
  ansible.builtin.assert:
    that: ('Times are ' ~ site_timezone ~ '.') in site_v_tz.content
    fail_msg: >-
      GET /management/fpgas/ does not say "Times are {{ site_timezone }}." Check
      MANAGEMENT_TIME_ZONE in {{ django_dir }}/pib/local_settings.py.

# --- TLS reachability on BOTH address families ------------------------------
# welland.fpgas.online spent a week serving the tinytapeout certificate to every
# IPv6 client because its vhost had `listen 443 ssl` but no `listen [::]:443
# ssl`: nginx then treats the only vhost that DOES listen there as the default
# server for that socket and hands out its certificate regardless of SNI.
# Nothing in CI noticed, so assert it here rather than in a comment.

- name: Nginx vhosts that terminate TLS on IPv4
  ansible.builtin.shell: "grep -lE '^[[:space:]]*listen[[:space:]]+443[[:space:]]+ssl' /etc/nginx/sites-enabled/*.conf"
  changed_when: false
  failed_when: false
  register: site_v_tls4

- name: Nginx vhosts that terminate TLS on IPv6
  ansible.builtin.shell: "grep -lE '^[[:space:]]*listen[[:space:]]+\\[::\\]:443[[:space:]]+ssl' /etc/nginx/sites-enabled/*.conf"
  changed_when: false
  failed_when: false
  register: site_v_tls6

- name: Assert every TLS vhost listens on IPv6 as well as IPv4
  ansible.builtin.assert:
    that: (site_v_tls4.stdout_lines | difference(site_v_tls6.stdout_lines)) | length == 0
    fail_msg: >-
      IPv4-only TLS vhost(s)
      {{ site_v_tls4.stdout_lines | difference(site_v_tls6.stdout_lines) | join(', ') }}
      -- clients reaching this host over IPv6 will be served some other vhost's
      certificate. Add `listen [::]:443 ssl;` beside `listen 443 ssl;`.

- name: Listening sockets
  ansible.builtin.command: ss -H -ltn
  changed_when: false
  register: site_v_listeners

- name: Assert nginx accepts TLS over IPv6
  ansible.builtin.assert:
    that: site_v_listeners.stdout is search('\[::\]:443')
    fail_msg: "nothing is listening on [::]:443; IPv6 clients cannot reach the site over TLS"

# End to end: shake hands over IPv6 with this host's own SNI and check which
# certificate comes back. s_client prints "subject=CN=..." on stdout, so no
# second openssl process and no discarded stderr.
- name: Certificate served over IPv6 for {{ domain_name }}
  ansible.builtin.shell: "openssl s_client -6 -connect [::1]:443 -servername {{ domain_name }} < /dev/null"
  changed_when: false
  failed_when: false
  register: site_v_v6cert

- name: Assert the IPv6 handshake serves this host's own certificate
  ansible.builtin.assert:
    that: site_v_v6cert.stdout is search('subject=.*CN[ ]*=[ ]*' ~ (domain_name | regex_escape))
    fail_msg: >-
      TLS over IPv6 for {{ domain_name }} did not serve its own certificate.
      s_client said: {{ site_v_v6cert.stdout_lines | select('search', '^(subject|issuer)=') | join('; ') | default('no certificate', true) }}

# Fleet self-registration (fpgas.online-infra#47): broker + consumer +
# pages, only on hosts that opted in via fleet_broker.
# Read-only probe (noqa: command-instead-of-module): systemd_service needs an
# action (state/enabled/masked/daemon_reload), and service_facts reports only
# running/stopped, not the ActiveState string the assert and its message use.
- name: Check the fleet broker and consumer are active  # noqa: command-instead-of-module
  ansible.builtin.command: systemctl is-active {{ item }}
  changed_when: false
  register: site_v_fleet_services
  loop: [mosquitto.service, fleet-consumer.service]
  failed_when: false
  when: fleet_broker | default(false)

- name: Assert the fleet broker and consumer are active
  ansible.builtin.assert:
    that: item.stdout == "active"
    fail_msg: "{{ item.item }} is not active (got: {{ item.stdout }})"
  loop: "{{ site_v_fleet_services.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: fleet_broker | default(false)

# Straight to gunicorn's socket: proves Django serves the fleet pages
# without depending on TLS/SNI details already asserted above.
- name: GET /fleet/ from the app server
  ansible.builtin.uri:
    url: http://localhost/fleet/
    unix_socket: /run/gunicorn.sock
    headers:
      Host: "{{ domain_name }}"
    follow_redirects: none
  register: site_v_fleet_page
  failed_when: false
  when: fleet_broker | default(false)

- name: Assert /fleet/ returns 200
  ansible.builtin.assert:
    that: site_v_fleet_page.status == 200
    fail_msg: "GET /fleet/ returned {{ site_v_fleet_page.status }}, expected 200"
  when: fleet_broker | default(false)

# --- the pages through nginx ------------------------------------------------
# The probes above go straight to gunicorn's socket, so they cannot see a
# location include that nginx lost or never had: /management/ gave 403/404 on
# the live site hosts for a day with every one of them green. These requests go
# through nginx over TLS, as a visitor's do. --resolve pins the vhost's name to
# this host, so the SNI and Host are the vhost's own and the request cannot land
# on another vhost; -k because the cert chain is asserted elsewhere (and is a
# self-signed stub on the CI VM).
# (noqa: command-instead-of-module: uri has no --resolve, and without it the
# request carries no SNI, which is exactly how another vhost gets to answer.)
- name: GET the pages through nginx  # noqa: command-instead-of-module
  ansible.builtin.command: >-
    curl -sS -k -o - -w '\n%{http_code}'
    --resolve {{ domain_name }}:443:127.0.0.1
    https://{{ domain_name }}{{ item }}
  changed_when: false
  failed_when: false
  register: site_v_nginx_pages
  loop: "{{ ['/management/', '/fpgas/', '/static/management/management.css'] + (['/fleet/'] if fleet_broker | default(false) else []) }}"

- name: Assert every page is served by Django through nginx
  ansible.builtin.assert:
    that: item.stdout_lines | last == "200"
    fail_msg: >-
      GET https://{{ domain_name }}{{ item.item }} through nginx returned
      '{{ item.stdout_lines | default([]) | last | default('no response') }}', expected 200.
      Is there a location for it in /etc/nginx/includes/{{ conference_name }}-*.conf?
      {{ item.stderr }}
  loop: "{{ site_v_nginx_pages.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Assert the management index renders its heading
  ansible.builtin.assert:
    that: "'<h1>Management</h1>' in (site_v_nginx_pages.results[0].stdout)"
    fail_msg: "GET /management/ through nginx returned 200 but not the management index (no <h1>Management</h1>)"
