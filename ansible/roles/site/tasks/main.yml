---
- {name: Install the web tier Python packages, ansible.builtin.include_tasks: apt.yml}

- {name: Configure nginx, ansible.builtin.include_tasks: nginx.yml}
- {name: Obtain the TLS certificate with certbot, ansible.builtin.include_tasks: certbot.yml}

- {name: Install the fpgas.online Django site packages, ansible.builtin.include_tasks: fpgas-online-site.yml}

- {name: Set the PoE switch management environment, ansible.builtin.include_tasks: snmp.yml}
- {name: Set up pistat, ansible.builtin.include_tasks: pistat.yml}

- {name: Install and configure the Django project, ansible.builtin.include_tasks: django.yml}

- {name: Set up the gunicorn service, ansible.builtin.include_tasks: gunicorn.yml}
- {name: Set up the uvicorn service, ansible.builtin.include_tasks: uvicorn.yml}
- {name: Set up the daphne service, ansible.builtin.include_tasks: daphne.yml}
- {name: Set up the fleet consumer service, ansible.builtin.include_tasks: fleet.yml, when: fleet_broker | default(false)}
