---
# Request a Let's Encrypt certificate for domain_name with
# `certbot certonly --webroot`.  Needs the name to resolve publicly and port 80
# to be reachable from the ACME server, so the VM test turns it off (as it does
# for ttsite_certbot) and relies on cloud-init's self-signed stub instead.
site_certbot: true

# Show the "under construction" banner on this site's pages, pointing visitors
# at the stable site when something is broken (the Django setting is
# UNDER_CONSTRUCTION, read by pibfpgas.middleware.UnderConstructionMiddleware).
# Off by default: welland opts in, ps1 is the site being pointed AT.
site_under_construction: false

# Offer a Pi on the /fpgas/ pages only when its FPGA boot check (fpgas-verify,
# roles/onpi/tasks/fpga_verify.yml) passed in the boot it is running now; the
# others still boot and take ssh, for someone to look at. The site learns the
# result from the fleet app, so only a host with fleet_broker can turn it on:
# anywhere else no Pi would ever show. Off by default.
site_require_fpga_verified: false

# pip requirement specs for the site and the PoE/switch package.  Override
# site_package with `... .git@my-branch` to deploy a site branch for testing.
site_package: "fpgas-online-site @ git+https://github.com/fpgas-online/fpgas.online-site.git"
site_poe_package: "fpgas-online-poe[cli] @ git+https://github.com/fpgas-online/fpgas.online-poe.git"
# The site package pins fpgas-online-poe to its main branch, so a poe branch
# cannot be resolved alongside it.  To test one, set this to its spec; it is
# installed on top afterwards with --no-deps (its dependencies must already
# be satisfied by main's).  Undefined in production.
# site_poe_package_override: "fpgas-online-poe[cli] @ git+https://github.com/fpgas-online/fpgas.online-poe.git@my-branch"

# Largest request body nginx accepts on the board-page upload endpoint
# (/pibup/, the pibup Django app, which SFTPs the file into ~/Uploads on the
# Pi).  Only that location gets it; the rest of the vhost keeps nginx's 1m
# default.  Sized for the biggest bitstream on the fleet (Acorn CLE-215+,
# ~9.7 MiB) plus a LiteX kernel+rootfs image with room to spare.
site_upload_max_body_size: 64m
