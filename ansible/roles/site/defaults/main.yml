---
# Request a Let's Encrypt certificate for domain_name with
# `certbot certonly --webroot`.  Needs the name to resolve publicly and port 80
# to be reachable from the ACME server, so the VM test turns it off (as it does
# for ttsite_certbot) and relies on cloud-init's self-signed stub instead.
site_certbot: true

# Show the "under construction" banner on this site's pages, pointing visitors
# at the stable site when something is broken (the Django setting is
# UNDER_CONSTRUCTION, read by pibfpgas.middleware.UnderConstructionMiddleware).
# Off by default: welland opts in, ps1 is the site being pointed AT.
site_under_construction: false

# pip requirement specs for the site and the PoE/switch package.  Override to
# deploy a branch (`... .git@my-branch`) for testing before it is merged.
site_package: "fpgas-online-site @ git+https://github.com/fpgas-online/fpgas.online-site.git"
site_poe_package: "fpgas-online-poe[cli] @ git+https://github.com/fpgas-online/fpgas.online-poe.git"
