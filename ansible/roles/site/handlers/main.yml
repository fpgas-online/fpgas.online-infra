---
- name: Restart dnsmasq
  ansible.builtin.systemd:
    name: dnsmasq
    # state: restarted

- name: Reload nginx
  ansible.builtin.systemd:
    name: nginx
    state: restarted

- name: Restart django services
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: restarted
  loop:
    - gunicorn
    - daphne
    - uvicorn

- name: Restart fleet-consumer
  ansible.builtin.systemd:
    name: fleet-consumer
    state: restarted
  when: fleet_broker | default(false)

- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true
