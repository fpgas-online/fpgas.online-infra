# Managed by ansible (fpgas.online-infra, pxe role).
# Every per-port lease event, renewals included, goes to the site as a lease record
# (/usr/local/sbin/fpgas-lease-event; it publishes on the site's MQTT broker).
dhcp-script=/usr/local/sbin/fpgas-lease-event
# the script needs no privilege: it reads its environment and runs mosquitto_pub
dhcp-scriptuser=nobody
# also run it when a lease's expiry changes (a renewal), so each DHCPACK is a heartbeat of the board
script-on-renewal
