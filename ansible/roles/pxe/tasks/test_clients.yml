---
# PXE test client support.
# Only included when pxe_test_clients is defined.
#
# Adds DHCP host entries for test clients (legacy scheme only) and their
# TFTP serial links. No key injection: the Pis' authorized_keys are the
# production ones (fixpi/userconf.yml authorizes the controller key named by
# ansible_ssh_private_key_file, which the test inventory points at the VM
# harness's key). All TFTP boot files
# (kernel, DTB, cmdline.txt, config.txt, initramfs) come from the
# production fixpi/netboot.yml setup — no test-specific overrides.

# Legacy MAC-table scheme only: hosts with `switches:` defined get their
# Pi's IP from the per-port dhcp-range in ports.conf.j2 (keyed by receiving
# VLAN interface, no MAC involved -- see pxe/tasks/main.yml), and pibs.conf
# is removed entirely in that case, so this task has nothing to append to.
- name: Add DHCP host entries for test clients
  lineinfile:
    path: /etc/dnsmasq.d/pibs.conf
    line: "dhcp-host={{ item.mac }},{{ item.name }},{{ item.ip }}"
    create: false
  with_items: "{{ pxe_test_clients }}"
  notify: Restart dnsmasq
  when: switches is not defined
  tags:
    - pxe-test
