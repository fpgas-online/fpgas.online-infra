---
# Read-only probe (noqa: command-instead-of-module): systemd_service needs an
# action (state/enabled/masked/daemon_reload), and service_facts reports only
# running/stopped, not the ActiveState string the assert and its message use.
- name: Check dnsmasq service active  # noqa: command-instead-of-module
  ansible.builtin.command: systemctl is-active dnsmasq
  changed_when: false
  register: pxe_dnsmasq_active
  failed_when: false

- name: Assert dnsmasq service is active
  ansible.builtin.assert:
    that: pxe_dnsmasq_active.stdout == "active"
    fail_msg: "dnsmasq service is not active (got: {{ pxe_dnsmasq_active.stdout }})"

- name: Check /etc/dnsmasq.d/rpi.conf exists
  ansible.builtin.stat:
    path: /etc/dnsmasq.d/rpi.conf
  register: pxe_rpi_conf_stat

- name: Assert /etc/dnsmasq.d/rpi.conf exists
  ansible.builtin.assert:
    that: pxe_rpi_conf_stat.stat.exists
    fail_msg: "/etc/dnsmasq.d/rpi.conf not found"

# Legacy MAC-table scheme (pibs.conf) — hosts with `switches:` defined
# (per-port VLAN scheme) don't render this file; see ports.conf.j2 instead.
- name: Check /etc/dnsmasq.d/pibs.conf exists
  ansible.builtin.stat:
    path: /etc/dnsmasq.d/pibs.conf
  register: pxe_pibs_conf_stat
  when: switches is not defined

- name: Assert /etc/dnsmasq.d/pibs.conf exists
  ansible.builtin.assert:
    that: pxe_pibs_conf_stat.stat.exists
    fail_msg: "/etc/dnsmasq.d/pibs.conf not found"
  when: switches is not defined

- name: Read /etc/dnsmasq.d/pibs.conf
  ansible.builtin.command: cat /etc/dnsmasq.d/pibs.conf
  changed_when: false
  register: pxe_pibs_content
  when: switches is not defined

- name: Assert pibs.conf contains dhcp-host=
  ansible.builtin.assert:
    that: "'dhcp-host=' in pxe_pibs_content.stdout"
    fail_msg: "/etc/dnsmasq.d/pibs.conf does not contain 'dhcp-host='"
  when: switches is not defined

- name: Check /srv/tftp directory exists
  ansible.builtin.stat:
    path: /srv/tftp
  register: pxe_tftp_dir_stat

- name: Assert /srv/tftp directory exists
  ansible.builtin.assert:
    that: pxe_tftp_dir_stat.stat.exists and pxe_tftp_dir_stat.stat.isdir
    fail_msg: "/srv/tftp directory not found"

# Per-port VLAN scheme: dnsmasq serves the boot partition itself (tftp_root)
# and the RPi bootloader's root fallback finds every file there.
- name: Check boot files at the TFTP root (VLAN scheme)
  ansible.builtin.stat:
    path: "{{ tftp_root }}/{{ item }}"
  register: pxe_tftp_root_files
  loop: [start4.elf, fixup4.dat, config.txt, cmdline.txt, kernel8.img]
  when: switches is defined

- name: Assert boot files at the TFTP root (VLAN scheme)
  ansible.builtin.assert:
    that: item.stat.exists
    fail_msg: "{{ tftp_root }}/{{ item.item }} not found"
  loop: "{{ pxe_tftp_root_files.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: switches is defined

- name: Assert dnsmasq serves TFTP from tftp_root (VLAN scheme)
  ansible.builtin.command: grep -qx "tftp-root={{ tftp_root }}" /etc/dnsmasq.d/base.conf
  changed_when: false
  when: switches is defined

# Check TFTP serial directories — these are symlinks to nfs_root/boot
# created by fixpi/netboot.yml for each Pi in switch.nos (legacy MAC-table
# scheme only; per-port VLAN hosts have no switch.nos, see (D)).
- name: Check TFTP serial directories exist
  ansible.builtin.stat:
    path: "/srv/tftp/{{ item.sn }}"
  register: pxe_serial_dir_stat
  with_items: "{{ switch.nos }}"
  when: switches is not defined

- name: Assert TFTP serial directories exist
  ansible.builtin.assert:
    that: item.stat.exists
    fail_msg: "/srv/tftp/{{ item.item.sn }} not found"
  with_items: "{{ pxe_serial_dir_stat.results }}"
  when: switches is not defined

- name: Check kernel8.img accessible via TFTP path
  ansible.builtin.stat:
    path: "/srv/tftp/{{ item.sn }}/kernel8.img"
  register: pxe_kernel_stat
  with_items: "{{ switch.nos }}"
  when: switches is not defined

- name: Assert kernel8.img exists
  ansible.builtin.assert:
    that: item.stat.exists
    fail_msg: "/srv/tftp/{{ item.item.sn }}/kernel8.img not found"
  with_items: "{{ pxe_kernel_stat.results }}"
  when: switches is not defined

- name: Check cmdline.txt accessible via TFTP path
  ansible.builtin.stat:
    path: "/srv/tftp/{{ item.sn }}/cmdline.txt"
  register: pxe_cmdline_stat
  with_items: "{{ switch.nos }}"
  when: switches is not defined

- name: Assert cmdline.txt exists and contains nfsroot
  ansible.builtin.assert:
    that: item.stat.exists
    fail_msg: "/srv/tftp/{{ item.item.sn }}/cmdline.txt not found"
  with_items: "{{ pxe_cmdline_stat.results }}"
  when: switches is not defined

# --- lease events and port lease release (per-port hosts; roles/pxe/tasks/lease_events.yml) ---

- name: Check the lease scripts are root's and executable
  ansible.builtin.stat:
    path: "/usr/local/sbin/{{ item }}"
  register: pxe_v_lease_scripts
  loop: [fpgas-lease-event, fpgas-release-port-lease]
  when: switches is defined

- name: Assert the lease scripts are root's and executable
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.pw_name == "root"
      - item.stat.mode == "0755"
    fail_msg: "/usr/local/sbin/{{ item.item }} is missing or not root:0755"
  loop: "{{ pxe_v_lease_scripts.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: switches is defined

- name: Read the lease release sudoers rule
  ansible.builtin.command: /usr/sbin/visudo -cf /etc/sudoers.d/fpgas-lease-release
  changed_when: false
  register: pxe_v_sudoers
  failed_when: pxe_v_sudoers.rc != 0
  when: switches is defined

- name: Read the lease release sudoers rule's text
  ansible.builtin.slurp:
    src: /etc/sudoers.d/fpgas-lease-release
  register: pxe_v_sudoers_text
  when: switches is defined

- name: Assert the rule allows that one script and nothing else
  vars:
    pxe_v_sudoers_rule: " ALL=(root) NOPASSWD: /usr/local/sbin/fpgas-release-port-lease\n"
  ansible.builtin.assert:
    that: (pxe_v_sudoers_text.content | b64decode) == (user_name ~ pxe_v_sudoers_rule)
    fail_msg: "/etc/sudoers.d/fpgas-lease-release is not the one-script rule: {{ pxe_v_sudoers_text.content | b64decode }}"
  when: switches is defined

- name: Check the release refuses an interface that is not a port's
  ansible.builtin.command: /usr/local/sbin/fpgas-release-port-lease eth-local --cause link-down
  changed_when: false
  register: pxe_v_refused
  failed_when: pxe_v_refused.rc != 2
  when: switches is defined

- name: Check dnsmasq runs the lease event script and not send_stat.py
  ansible.builtin.stat:
    path: "/etc/dnsmasq.d/{{ item }}"
  register: pxe_v_lease_conf
  loop: [lease-events.conf, send_stat.conf]
  when: switches is defined

- name: Assert lease-events.conf is there and send_stat.conf is not
  ansible.builtin.assert:
    that:
      - pxe_v_lease_conf.results[0].stat.exists
      - not pxe_v_lease_conf.results[1].stat.exists
    fail_msg: "expected /etc/dnsmasq.d/lease-events.conf and no send_stat.conf (#194)"
  when: switches is defined

# #194's acceptance: no "failed to execute" from dnsmasq since its last start.
- name: Read dnsmasq's journal since it last started
  ansible.builtin.shell: >-
    set -o pipefail &&
    journalctl -u dnsmasq --no-pager -o cat
    --since "$(systemctl show -p ActiveEnterTimestamp --value dnsmasq)"
    | grep -c "failed to execute" || true
  args:
    executable: /bin/bash
  changed_when: false
  register: pxe_v_failed_exec
  when: switches is defined

- name: Assert dnsmasq has not failed to run its script since it started
  ansible.builtin.assert:
    that: pxe_v_failed_exec.stdout | trim == "0"
    fail_msg: "dnsmasq logged {{ pxe_v_failed_exec.stdout | trim }} 'failed to execute' lines since it started"
  when: switches is defined
