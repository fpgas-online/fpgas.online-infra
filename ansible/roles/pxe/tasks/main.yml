---
- name: Install dnsmasq
  ansible.builtin.apt:
    name:
      - dnsmasq

- name: Configure dnsmasq base (DHCP, TFTP)
  ansible.builtin.template:
    src: templates/dnsmasq-base.conf.j2
    dest: /etc/dnsmasq.d/base.conf
    mode: "0644"
  notify: Restart dnsmasq

# Serve NTP to the Pi LAN: Pis have no internet (forward policy drop) and
# systemd-timesyncd is client-only, so without a LAN time source every Pi
# sits on its fake-hwclock date forever (tweed rebuild C2-2; the old server
# ran chrony configured out-of-band). dnsmasq-base advertises this server
# via dhcp-option ntp-server; fixpi additionally pins the NFS root's
# timesyncd at the server.
- name: Install chrony (LAN NTP server)
  ansible.builtin.apt:
    name: chrony

- name: Allow the Pi LAN to query chrony
  ansible.builtin.copy:
    content: |
      # Managed by ansible (fpgas.online-infra, pxe role)
      allow {{ pib_network | default('10.21') }}.0.0/16
    dest: /etc/chrony/conf.d/fpgas-lan.conf
    mode: "0644"
  notify: Restart chrony

- name: Enable Raspberry Pi Boot
  ansible.builtin.copy:
    src: files/rpi.conf
    dest: /etc/dnsmasq.d/
    mode: "0644"
  notify: Restart dnsmasq

- name: Create dnsmasq.d pib.conf (legacy MAC-table hosts)
  ansible.builtin.template:
    src: templates/pibs.conf.j2
    dest: /etc/dnsmasq.d/pibs.conf
    mode: "0644"
  notify: Restart dnsmasq
  when: switches is not defined

- name: Create dnsmasq.d switch.conf (legacy MAC-table hosts)
  ansible.builtin.template:
    src: templates/switch.conf.j2
    dest: /etc/dnsmasq.d/switch.conf
    mode: "0644"
  notify: Restart dnsmasq
  when: switches is not defined

- name: Create dnsmasq.d ports.conf (per-port hosts)
  ansible.builtin.template:
    src: templates/ports.conf.j2
    dest: /etc/dnsmasq.d/ports.conf
    mode: "0644"
  notify: Restart dnsmasq
  when: switches is defined

# Router advertisements on the per-port interfaces come from radvd, not
# from dnsmasq: templates/radvd.conf.j2 says why. radvd's package starts
# nothing until /etc/radvd.conf exists, and the file is checked by radvd
# itself before it replaces the one in use.
- name: Install radvd (router advertisements on the per-port interfaces)
  ansible.builtin.apt:
    name: radvd
  when: switches is defined

# radvd takes a file with a value outside its limits (--configtest checks
# only the syntax), says so in its log when it starts, and then advertises
# nothing on that interface: it would be running, and every board would
# lose its default route. So the limits are checked here.
- name: Check the router advertisement timing is within radvd's limits
  ansible.builtin.assert:
    that:
      - pxe_ra_interval | int >= 10
      - pxe_ra_interval | int <= 1800
      - pxe_ra_lifetime | int >= pxe_ra_interval | int
      - pxe_ra_lifetime | int <= 9000
    fail_msg: >-
      pxe_ra_interval={{ pxe_ra_interval }} must be between 10 and 1800 and
      pxe_ra_lifetime={{ pxe_ra_lifetime }} between the interval and 9000:
      radvd does not advertise on an interface configured outside these
    quiet: true
  when: switches is defined

- name: Configure radvd (one interface per switch port)
  ansible.builtin.template:
    src: templates/radvd.conf.j2
    dest: /etc/radvd.conf
    mode: "0644"
    validate: radvd --configtest --config %s
  notify: Reload radvd
  when: switches is defined

- name: Enable and start radvd
  ansible.builtin.systemd:
    name: radvd
    enabled: true
    state: started
  when: switches is defined

# local.conf is the hand-written pre-VLAN flat-scheme config (a bare
# dhcp-range on eth-local plus `bind-interfaces`). It is not generated by
# any template, so a fresh VM never has it, but real gateways do -- and its
# `bind-interfaces` conflicts with base.conf's `bind-dynamic` (dnsmasq
# refuses to start with both). The per-port base.conf/ports.conf supersede
# it entirely, so remove it on per-port hosts.
- name: Remove legacy MAC-table configs (per-port hosts)
  ansible.builtin.file:
    path: "/etc/dnsmasq.d/{{ item }}"
    state: absent
  loop: [pibs.conf, switch.conf, local.conf]
  when: switches is defined
  notify: Restart dnsmasq

- name: Configure PXE test clients
  ansible.builtin.include_tasks: test_clients.yml
  when: pxe_test_clients is defined
