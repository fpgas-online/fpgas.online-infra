---
- name: Restart dnsmasq
  ansible.builtin.systemd:
    name: dnsmasq
    state: restarted

- name: Restart chrony
  ansible.builtin.systemd:
    name: chrony
    state: restarted

# A reload: radvd reads the file again and carries on, with every
# interface's timer running.
- name: Reload radvd
  ansible.builtin.systemd:
    name: radvd
    state: reloaded
