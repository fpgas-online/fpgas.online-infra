---
# Pull the prebuilt Pi NFS root from GHCR (issue #34). The image is
# produced by .github/workflows/nfsroot-build.yml; the site layer (fixpi
# userconf, ssh host keys, tt catalogue, per-site config) is applied on
# top by the roles that run after img in site.yml.
#
# Extraction rsyncs --delete into the live NFS export, so only run it with
# the fleet powered off or between boots — the same constraint a full
# rebuild has today (a changed root under a running Pi means stale NFS
# handles). A re-run with an unchanged image digest skips extraction.

- name: Install podman and rsync
  ansible.builtin.apt:
    name:
      - podman
      - rsync
    install_recommends: false
  tags:
    - img

# prefetch.yml started the download early in site.yml; wait for it here.
# Its outcome is not trusted: the pull below is what must succeed.
- name: Wait for the background pull started by prefetch.yml
  ansible.builtin.async_status:
    jid: "{{ img_prefetch.ansible_job_id }}"
  register: img_prefetch_job
  until: img_prefetch_job.finished
  retries: "{{ ((img_pull_retries | int + 1) * (img_pull_delay | int + 300)) // 5 }}"
  delay: 5
  when: img_prefetch.ansible_job_id is defined
  tags:
    - img

- name: Pull the nfsroot image
  ansible.builtin.command: podman pull {{ img_nfsroot_image }}
  register: img_pull
  until: img_pull.rc == 0 or not (img_pull.stderr is search(img_pull_retryable))
  retries: "{{ img_pull_retries }}"
  delay: "{{ img_pull_delay }}"
  changed_when: false
  tags:
    - img

- name: Read the pulled image digest
  ansible.builtin.command: >-
    podman image inspect --format {% raw %}{{.Digest}}{% endraw %}
    {{ img_nfsroot_image }}
  register: img_digest
  changed_when: false
  tags:
    - img

- name: Read the extraction stamp
  ansible.builtin.command: cat {{ nfs_root }}/.image-digest
  register: img_stamp
  failed_when: false
  changed_when: false
  tags:
    - img

- name: Create the NFS root directory
  ansible.builtin.file:
    path: "{{ nfs_root }}"
    state: directory
  tags:
    - img

- name: Extract the nfsroot image
  when: img_stamp.stdout | default('') != img_digest.stdout
  tags:
    - img
  block:
    - name: Mount the image
      ansible.builtin.command: podman image mount {{ img_nfsroot_image }}
      register: img_mnt

    # root/etc/nfsroot-watchdog/ holds the server-side protocol files of
    # fpgas-online/nfsroot-watchdog (update.lock, generation, inhibit). They
    # are never in the image and must survive a pull: deleting generation
    # mid-run would make every board see a change and start rebooting,
    # deleting update.lock drops the hold, and deleting inhibit silently undoes
    # a person's fleet-wide stop. Excluded paths are also exempt from --delete.
    #
    # --checksum: rsync replaces every file it transfers with a temp file
    # renamed into place, i.e. a NEW inode, and every replaced inode goes
    # ESTALE on the booted boards' overlayroot until they reboot. Without it
    # the quick check (size + mtime) re-transfers every file whose mtime moved
    # in a CI rebuild even though its bytes did not; with it an identical
    # file keeps its inode and only its attributes are updated. It also stops the quick check from skipping
    # a changed file whose size and mtime second happen to match. The cost is
    # reading both trees once per new image digest.
    - name: Rsync boot/ and root/ from the image
      ansible.builtin.command: >-
        rsync -aHAX --delete --numeric-ids --checksum
        {{ '--exclude=/etc/nfsroot-watchdog/' if item == 'root' else '' }}
        {{ img_mnt.stdout }}/{{ item }}/ {{ nfs_root }}/{{ item }}/
      loop:
        - boot
        - root

    - name: Record the extraction stamp
      ansible.builtin.copy:
        content: "{{ img_digest.stdout }}\n"
        dest: "{{ nfs_root }}/.image-digest"
        mode: "0644"
  always:
    - name: Unmount the image
      ansible.builtin.command: podman image umount {{ img_nfsroot_image }}
      failed_when: false
      changed_when: false
