---
# Start downloading the Pi NFS root image in the background, early in
# site.yml, so the multi-GB pull overlaps the server roles instead of
# holding them up. pull.yml (run later, where the root is extracted) waits
# for this job, then runs its own `podman pull`, which is the authoritative
# one: it finds the image already local and fails the play if the pull
# really failed.
#
# The loop retries like pull.yml does (img_pull_retries/img_pull_delay):
# the VM test starts before the image it pulls has been published.

# The first apt install in site.yml (right after netif), so it refreshes
# the package lists: a freshly installed server may have none yet.
- name: Install podman and rsync
  apt:
    name:
      - podman
      - rsync
    install_recommends: false
    update_cache: true
    cache_valid_time: 3600

- name: Start pulling the nfsroot image in the background
  # Retries only the errors img_pull_retryable names, like pull.yml.
  shell: |
    for attempt in $(seq {{ img_pull_retries | int + 1 }}); do
      err=$(podman pull --quiet {{ img_nfsroot_image }} 2>&1 >/dev/null) && exit 0
      echo "$err" >&2
      echo "$err" | grep -Eq {{ img_pull_retryable | quote }} || exit 1
      sleep {{ img_pull_delay }}
    done
    exit 1
  async: "{{ (img_pull_retries | int + 1) * (img_pull_delay | int + 300) }}"
  poll: 0
  register: img_prefetch
  changed_when: false
