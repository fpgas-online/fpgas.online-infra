---
# The Pi NFS root always arrives prebuilt: CI builds and publishes it
# (.github/workflows/nfsroot-build.yml, issue #34) and every server pulls
# it. build.yml is NOT part of this flow — it is the raspios
# download/extract step that only ansible/ci-nfsroot.yml uses to produce
# the image in the first place.
- import_tasks: pull.yml
