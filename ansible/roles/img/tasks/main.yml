---
# Dispatch on nfsroot_source: 'build' (default) provisions the root from
# the RasPiOS image on this server via the nspawn chroot plays; 'pull'
# extracts the CI-prebuilt image from GHCR (issue #34 phase 3, design in
# docs/superpowers/specs/2026-08-31-ci-nfsroot-build-design.md).
- import_tasks: build.yml
  when: nfsroot_source == 'build'

- import_tasks: pull.yml
  when: nfsroot_source == 'pull'
