---
# Add the fpgas.online apt repository to hosts that need fpgas-online deb packages.

# The published key is ASCII-armoured; apt on the Raspbian NFS root rejected
# it as a signed-by keyring (NO_PUBKEY, issue #13), so dearmour it into a
# binary keyring.  The .asc copy is kept only as the change detector.
- name: Fetch fpgas.online apt signing key (armoured)
  ansible.builtin.get_url:
    url: "{{ fpgas_apt_url }}/pubkey.gpg"
    dest: /usr/share/keyrings/fpgas-online.asc
    mode: '0644'
  register: fpgas_apt_key

- name: Dearmour fpgas.online apt signing key
  ansible.builtin.command:
    cmd: gpg --batch --yes --dearmor -o /usr/share/keyrings/fpgas-online.gpg /usr/share/keyrings/fpgas-online.asc
  when: fpgas_apt_key.changed

# The whole file, not apt_repository: apt_repository only adds lines, so a
# URL change (upstream -> the gateway's apt cache, or back) would leave the
# old line behind and apt would keep fetching straight from upstream too.
# Owning the file also drops any pre-custom-domain github.io line.
- name: Fpgas.online apt repository
  ansible.builtin.copy:
    content: "deb [signed-by=/usr/share/keyrings/fpgas-online.gpg] {{ fpgas_apt_url }} {{ fpgas_apt_suite }} main\n"
    dest: /etc/apt/sources.list.d/fpgas-online.list
    mode: '0644'

# RP1-PIO openFPGALoader / OpenOCD builds from mithro/rp1-jtag.
- name: Add the rp1-jtag apt repository
  ansible.builtin.include_tasks: rp1-jtag.yml

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
