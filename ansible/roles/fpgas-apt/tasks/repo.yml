---
# Add one mithro / fpgas-online apt repository. Every one of them follows the
# same convention (docs/conventions.md in mithro/apt-repo-action): for GitHub
# repository <repo>, the site publishes a BINARY keyring <repo>.gpg, and each
# suite is a flat repository at <url>/<suite>/ ./ -- so the key, the keyring
# /etc/apt/keyrings/<repo>.gpg and the source file <repo>.list share one name.
#
# Parameters: repo_name, repo_url, repo_suite, repo_key_fingerprint.
#
# The key is fetched to a staging path and only copied to the path signed-by
# points at once both asserts have passed, so a rotated or re-armoured key
# never reaches a path apt trusts -- including on a root that already carries
# the source from an earlier run. The format is asserted, not assumed:
# bookworm's apt verifies with gpgv, which rejects an armoured keyring as an
# unsupported filetype and then treats the repository as unsigned, and apt
# never re-fetches a keyring that is already on disk.

- name: Ensure /etc/apt/keyrings exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

# get_url fails on any non-2xx, so a retired repo is a hard error rather than
# a silent empty keyring -- worth saying because this host answers a 404 with
# a full HTML error page, not an empty body. A 200 that is not a keyring at
# all still fails: gpg --show-keys exits non-zero on it, and the assert below
# catches a keyring that parses but is the wrong one.
- name: Fetch the apt signing key (binary, not armoured) of {{ repo_name }}
  ansible.builtin.get_url:
    url: "{{ repo_url }}/{{ repo_name }}.gpg"
    dest: "/etc/apt/keyrings/{{ repo_name }}.gpg.fetched"
    mode: '0644'

- name: Read the fetched key's fingerprint for {{ repo_name }}
  ansible.builtin.command:
    cmd: gpg --batch --with-colons --show-keys /etc/apt/keyrings/{{ repo_name }}.gpg.fetched
  register: fpgas_apt_repo_key_info
  changed_when: false

- name: Assert the key is the pinned one for {{ repo_name }}
  ansible.builtin.assert:
    # The first fpr: record is the primary key's (subkeys follow their pub).
    that: >-
      (fpgas_apt_repo_key_info.stdout_lines
       | select('match', '^fpr:')
       | map('regex_replace', '[^0-9A-F]', '')
       | first | default('')) == repo_key_fingerprint
    fail_msg: >-
      {{ repo_url }}/{{ repo_name }}.gpg is not signed by the pinned primary
      key {{ repo_key_fingerprint }}
      (got {{ fpgas_apt_repo_key_info.stdout_lines | select('match', '^fpr:') | list }}).
      If {{ repo_name }} rotated its signing key, update its fingerprint in
      roles/fpgas-apt/defaults/main.yml.

# gpg --show-keys above reads armour and binary alike, so it cannot catch an
# armoured file. Armour always starts "-----BEGIN"; a binary keyring starts
# with a packet tag byte, which is never 0x2d ('-').
- name: Read the first byte of the fetched key for {{ repo_name }}
  ansible.builtin.command:
    cmd: od -An -tx1 -N1 /etc/apt/keyrings/{{ repo_name }}.gpg.fetched
  register: fpgas_apt_repo_key_first_byte
  changed_when: false

- name: Assert the key is a binary keyring, not armour, for {{ repo_name }}
  ansible.builtin.assert:
    that: fpgas_apt_repo_key_first_byte.stdout | trim not in ['', '2d']
    fail_msg: >-
      {{ repo_url }}/{{ repo_name }}.gpg is ASCII-armoured (first byte
      {{ fpgas_apt_repo_key_first_byte.stdout | trim }}). gpgv, which apt uses
      on bookworm, rejects an armoured signed-by keyring and treats the
      repository as unsigned.

- name: Install the keyring for {{ repo_name }}
  ansible.builtin.copy:
    src: "/etc/apt/keyrings/{{ repo_name }}.gpg.fetched"
    dest: "/etc/apt/keyrings/{{ repo_name }}.gpg"
    remote_src: true
    mode: '0644'

# The whole file, not apt_repository: apt_repository only adds lines, so a
# URL change (upstream -> the gateway's apt cache, or back) would leave the
# old line behind and apt would keep fetching straight from upstream too.
- name: Add the apt repository {{ repo_name }}
  ansible.builtin.copy:
    content: "deb [signed-by=/etc/apt/keyrings/{{ repo_name }}.gpg] {{ repo_url }}/{{ repo_suite }}/ ./\n"
    dest: "/etc/apt/sources.list.d/{{ repo_name }}.list"
    mode: '0644'
