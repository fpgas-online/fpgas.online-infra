---
# Retire the mithro/rp1-jtag apt repository.
#
# mithro/rp1-jtag stopped building Debian packages (its #20, 2026-09-23): its
# apt repository is frozen at 0.0.post87 and is being replaced by a pointer
# page, after which it serves no Packages or Release files at all. A root
# still carrying its sources line would then fail every `apt update` --
# including the one at the end of this role -- and the NFS root's own nightly
# upgrade.
#
# Nothing needs it. openfpgaloader-fpgasonline / openocd-fpgasonline from
# fpga-tools.yml supersede the -rp1pio packages (same rp1pio cable, librp1jtag
# linked in statically) and declare Conflicts/Replaces on them, so
# roles/onpi/tasks/apt.yml swaps them in one transaction and the autoremove
# task there collects the orphaned librp1jtag0. Nothing on the Pis builds
# against librp1jtag, so librp1jtag-dev is not wanted either.
#
# Files rather than apt_repository state=absent: that module only removes a
# line it can reproduce exactly, and roots set up by hand from the upstream
# instructions, or by earlier revisions of this role, carry the line under
# either mithro.github.io/rp1-jtag or mith.ro/rp1-jtag. The file name and the
# keyring paths are the same in every case.

- name: Remove the rp1-jtag apt sources line
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/rp1-jtag.list
    state: absent

- name: Remove the rp1-jtag apt signing key
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/keyrings/rp1-jtag.gpg
    - /etc/apt/keyrings/rp1-jtag.asc
