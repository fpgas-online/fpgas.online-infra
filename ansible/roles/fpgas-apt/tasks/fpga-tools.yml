---
# Add the fpgas.online-fpga-tools apt repository: openfpgaloader-fpgasonline
# and openocd-fpgasonline, which roles/onpi/tasks/apt.yml installs in place of
# Debian's openocd / openfpgaloader (and in place of the older
# openfpgaloader-rp1pio / openocd-rp1pio from mithro/rp1-jtag).
#
# Same shape as rp1-jtag.yml above, with one deliberate difference: the key
# this repo publishes is a BINARY OpenPGP keyring, not an ASCII-armoured one
# (`file` reports "OpenPGP Public Key Version 4"), so there is nothing to
# dearmour -- it is fetched straight to the path signed-by points at.
#
# It is fetched to a staging path first, though. rp1-jtag.yml gets that for
# free: it asserts on the .asc and only dearmours into the trusted .gpg once
# the assert has passed, so a rotated key never reaches a path apt trusts.
# Fetching a binary key directly to the signed-by path would lose that, on a
# root that already carries the sources.list.d line from an earlier run.
#
# These tasks run under the role's fpgas-apt tag (site.yml / ci-nfsroot.yml
# tag the whole role), which is also what the VM integration test skips
# (tests/vm/run_tests.py, issue #49). The onpi install and the verify-pi
# checks for these packages carry fpgas-apt too, so skipping the source
# skips everything that needs it.

- name: Ensure /etc/apt/keyrings exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

# get_url fails on any non-2xx, so a retired repo is a hard error rather than
# a silent empty keyring -- worth saying because this host answers a 404 with
# a full HTML error page, not an empty body. A 200 that is not a keyring at
# all still fails: gpg --show-keys exits non-zero on it, and the assert below
# catches a keyring that parses but is the wrong one.
- name: Fetch fpgas.online-fpga-tools apt signing key (binary, not armoured)
  ansible.builtin.get_url:
    url: "{{ fpga_tools_apt_url }}/{{ fpga_tools_apt_key_name }}"
    dest: "{{ fpga_tools_apt_keyring }}.fetched"
    mode: '0644'

- name: Read the fetched fpgas.online-fpga-tools key's fingerprint
  ansible.builtin.command:
    cmd: gpg --batch --with-colons --show-keys {{ fpga_tools_apt_keyring }}.fetched
  register: fpga_tools_apt_key_info
  changed_when: false

- name: Assert the fpgas.online-fpga-tools key is the pinned one
  ansible.builtin.assert:
    # The first fpr: record is the primary key's (subkeys follow their pub).
    that: >-
      (fpga_tools_apt_key_info.stdout_lines
       | select('match', '^fpr:')
       | map('regex_replace', '[^0-9A-F]', '')
       | first | default('')) == fpga_tools_apt_key_fingerprint
    fail_msg: >-
      {{ fpga_tools_apt_url }}/{{ fpga_tools_apt_key_name }} is not signed by
      the pinned primary key {{ fpga_tools_apt_key_fingerprint }}
      (got {{ fpga_tools_apt_key_info.stdout_lines | select('match', '^fpr:') | list }}).
      If fpgas.online-fpga-tools rotated its signing key, update
      fpga_tools_apt_key_fingerprint in roles/fpgas-apt/defaults/main.yml.

- name: Install the fpgas.online-fpga-tools keyring
  ansible.builtin.copy:
    src: "{{ fpga_tools_apt_keyring }}.fetched"
    dest: "{{ fpga_tools_apt_keyring }}"
    remote_src: true
    mode: '0644'

- name: Add fpgas.online-fpga-tools apt repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by={{ fpga_tools_apt_keyring }}] {{ fpga_tools_apt_url }}/{{ fpga_tools_apt_suite }}/ ./"
    state: present
    filename: fpgas-online-fpga-tools
