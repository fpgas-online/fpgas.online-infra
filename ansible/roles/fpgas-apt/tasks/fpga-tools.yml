---
# Add the fpgas.online-fpga-tools apt repository: openfpgaloader-fpgasonline-git
# and openocd-fpgasonline-git, which roles/onpi/tasks/apt.yml installs in place of
# Debian's openocd / openfpgaloader (and in place of the older
# openfpgaloader-rp1pio / openocd-rp1pio from the retired mithro/rp1-jtag).
#
# Fetched, pinned, format-checked and installed by tasks/repo.yml under the
# repository's name, fpgas.online-fpga-tools (key, keyring and source).
#
# These tasks run under the role's fpgas-apt tag (site.yml / ci-nfsroot.yml
# tag the whole role), which is also what the VM integration test skips
# (tests/vm/run_tests.py, issue #49). The onpi install and the verify-pi
# checks for these packages carry fpgas-apt too, so skipping the source
# skips everything that needs it.

- name: Add the fpgas.online-fpga-tools apt repository (tasks/repo.yml)
  ansible.builtin.include_tasks: repo.yml
  vars:
    repo_name: fpgas.online-fpga-tools
    repo_url: "{{ fpga_tools_apt_url }}"
    repo_suite: "{{ fpga_tools_apt_suite }}"
    repo_key_fingerprint: "{{ fpga_tools_apt_key_fingerprint }}"
