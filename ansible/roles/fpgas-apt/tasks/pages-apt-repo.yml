---
# Add one signed, flat, per-suite apt repository published on GitHub Pages
# with mithro/apt-repo-action (<url>/<suite>/ ./, keys <stem>.gpg binary and
# <stem>.asc armoured), with its signing key pinned by fingerprint.
#
# Include with a `pages_apt` dict:
#   name:        for task names and messages
#   url:         the repository root (canonical https, or the apt cache's
#                remap of it -- never a URL that redirects)
#   suite:       the Debian release directory under url
#   key_name:    the BINARY keyring's file name under url (<stem>.gpg)
#   keyring:     where it is installed; signed-by points here
#   fingerprint: the pinned primary key fingerprint
#   filename:    the sources.list.d file name (without .list)
#
# The key is fetched as the BINARY keyring the site publishes, so there is
# nothing to dearmour. The format is asserted, not assumed: bookworm's apt
# verifies with gpgv, which rejects an armoured keyring as an unsupported
# filetype and then treats the repository as unsigned, and apt never
# re-fetches a keyring that is already on disk.
#
# It is fetched to a staging path and only copied to the path signed-by
# points at once both asserts have passed, so a rotated or re-armoured key
# never reaches a path apt trusts -- including on a root that already carries
# the sources.list.d line from an earlier run.

- name: Ensure /etc/apt/keyrings exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

# get_url fails on any non-2xx, so a retired repo is a hard error rather than
# a silent empty keyring -- worth saying because this host answers a 404 with
# a full HTML error page, not an empty body. A 200 that is not a keyring at
# all still fails: gpg --show-keys exits non-zero on it, and the assert below
# catches a keyring that parses but is the wrong one.
- name: Fetch {{ pages_apt.name }} apt signing key (binary, not armoured)
  ansible.builtin.get_url:
    url: "{{ pages_apt.url }}/{{ pages_apt.key_name }}"
    dest: "{{ pages_apt.keyring }}.fetched"
    mode: '0644'

- name: Read the fetched {{ pages_apt.name }} key's fingerprint
  ansible.builtin.command:
    cmd: gpg --batch --with-colons --show-keys {{ pages_apt.keyring }}.fetched
  register: pages_apt_key_info
  changed_when: false

- name: Assert the {{ pages_apt.name }} key is the pinned one
  ansible.builtin.assert:
    # The first fpr: record is the primary key's (subkeys follow their pub).
    that: >-
      (pages_apt_key_info.stdout_lines
       | select('match', '^fpr:')
       | map('regex_replace', '[^0-9A-F]', '')
       | first | default('')) == pages_apt.fingerprint
    fail_msg: >-
      {{ pages_apt.url }}/{{ pages_apt.key_name }} is not signed by
      the pinned primary key {{ pages_apt.fingerprint }}
      (got {{ pages_apt_key_info.stdout_lines | select('match', '^fpr:') | list }}).
      If {{ pages_apt.name }} rotated its signing key, update its pinned
      fingerprint in roles/fpgas-apt/defaults/main.yml.

# gpg --show-keys above reads armour and binary alike, so it cannot catch an
# armoured file. Armour always starts "-----BEGIN"; a binary keyring starts
# with a packet tag byte, which is never 0x2d ('-').
- name: Read the first byte of the fetched {{ pages_apt.name }} key
  ansible.builtin.command:
    cmd: od -An -tx1 -N1 {{ pages_apt.keyring }}.fetched
  register: pages_apt_key_first_byte
  changed_when: false

- name: Assert the {{ pages_apt.name }} key is a binary keyring, not armour
  ansible.builtin.assert:
    that: pages_apt_key_first_byte.stdout | trim not in ['', '2d']
    fail_msg: >-
      {{ pages_apt.url }}/{{ pages_apt.key_name }} is ASCII-armoured
      (first byte {{ pages_apt_key_first_byte.stdout | trim }}). gpgv, which
      apt uses on bookworm, rejects an armoured signed-by keyring and treats
      the repository as unsigned. Fetch the binary keyring, or dearmour it
      before it is installed.

- name: Install the {{ pages_apt.name }} keyring
  ansible.builtin.copy:
    src: "{{ pages_apt.keyring }}.fetched"
    dest: "{{ pages_apt.keyring }}"
    remote_src: true
    mode: '0644'

- name: Add the {{ pages_apt.name }} apt repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by={{ pages_apt.keyring }}] {{ pages_apt.url }}/{{ pages_apt.suite }}/ ./"
    state: present
    filename: "{{ pages_apt.filename }}"
