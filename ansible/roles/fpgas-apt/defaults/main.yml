---
# The fpgas-online apt repo is a GitHub Pages site. The org site carries the
# custom domain fpgas.online, so every project page -- including
# fpgas-online.github.io/apt -- 301s to http://fpgas.online/<repo>, which apt
# refuses to follow (https -> http). Use the canonical https URL directly.
fpgas_apt_upstream_url: https://fpgas.online/apt

# The "Pi" here is the NFS root on a gateway, so the gateway's apt cache
# (roles/apt-cache publishes apt_cache_url) is read from the first nbp host's
# vars -- the same pattern as onpi/tasks/tt.yml. Empty (no nbp group, as in
# ci-nfsroot.yml, or the cache disabled) falls back to upstream.
fpgas_apt_cache_url: "{{ hostvars[groups['nbp'][0]].apt_cache_url | default('') if groups['nbp'] | default([]) else '' }}"
fpgas_apt_url: "{{ (fpgas_apt_cache_url ~ '/fpgas-online') if fpgas_apt_cache_url else fpgas_apt_upstream_url }}"
fpgas_apt_suite: bookworm

# fpgas-online/fpgas.online-fpga-tools publishes the fpgas.online patch-series
# builds of openFPGALoader and OpenOCD (roles/onpi installs the -git track,
# openfpgaloader-fpgasonline-git / openocd-fpgasonline-git; the same source
# carries the stable pair) -- the rp1pio cable through the shared librp1jtag0
# it also publishes, plus the netv2 / tt_fpga boards and --flash-info, none of which
# the retired mithro/rp1-jtag builds carried. One flat apt repository per
# Debian release (bookworm / trixie / sid, arm64 + armhf) under a GitHub
# Pages site, signed per suite, so the suite follows the NFS root's release.
# The URL is the canonical https one on the custom domain: the
# fpgas-online.github.io project page 301s to http://fpgas.online/<repo>,
# which apt will not follow. Like fpgas_apt_url, clients go through the
# gateway's apt cache when there is one (remap fpgatools in
# roles/apt-cache/defaults/main.yml); apt-cache's verify fails any NFS root
# source that bypasses it.
#
# The site publishes the key twice: fpgas-online-fpga-tools.asc (armoured)
# and fpgas-online-fpga-tools.gpg (a binary keyring). The binary one is
# fetched, because bookworm's apt verifies with gpgv, which rejects an
# armoured keyring as an unsupported filetype and then treats the repository
# as unsigned (Debian 13's sqv accepts both, which hides the problem there).
# roles/fpgas-apt/tasks/fpga-tools.yml asserts the format as well as the
# fingerprint, so an upstream change to either fails the build instead of
# being trusted.
fpga_tools_apt_upstream_url: https://fpgas.online/fpgas.online-fpga-tools
fpga_tools_apt_url: "{{ (fpgas_apt_cache_url ~ '/fpgas-online-fpga-tools') if fpgas_apt_cache_url else fpga_tools_apt_upstream_url }}"
fpga_tools_apt_suite: "{{ dist }}"
fpga_tools_apt_key_name: fpgas-online-fpga-tools.gpg
fpga_tools_apt_keyring: /etc/apt/keyrings/fpgas-online-fpga-tools.gpg
fpga_tools_apt_key_fingerprint: A0F376D2174A0A54C6F13AAA02E06C0592A2EA30
