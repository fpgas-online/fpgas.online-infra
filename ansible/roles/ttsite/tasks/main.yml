---
# tinytapeout.fpgas.online on the web server: the catalogue (words about
# boards, by USB serial) -> Django, ttsite settings, the Commander embed bundle
# and the nginx vhost with ONE internal location that proxies a board's serial
# WebSocket to whichever Pi Django says carries the board now. Nothing here
# says which board is on which switch port (fpgas.online-tt issue #14).
# Spec: docs/superpowers/specs/2026-08-22-tinytapeout-fpgas-online-design.md
- name: Assert embed pin is complete
  ansible.builtin.assert:
    that:
      - (tt_commander_embed_version | length == 0) or (tt_commander_embed_sha256 | length == 64)
      - (tt_commander_legacy_embed_version | length == 0) or (tt_commander_legacy_embed_sha256 | length == 64)
    fail_msg: "tt_commander_(legacy_)embed_sha256 must be the 64-hex sha256 when the matching version is set"

- {name: Load the TT board catalogue, ansible.builtin.include_tasks: boards.yml}
- {name: Configure the ttsite Django settings, ansible.builtin.include_tasks: django.yml}
- {name: Install the Commander embed bundles, ansible.builtin.include_tasks: embed.yml}
- {name: Configure the ttsite nginx vhost and certificate, ansible.builtin.include_tasks: nginx.yml}
