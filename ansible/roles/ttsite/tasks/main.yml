---
# tinytapeout.fpgas.online on the web server: board catalogue -> Django,
# ttsite settings, the Commander embed bundle and the nginx vhost with one
# WebSocket proxy per live board to the Pi-side fpgas-tt daemon.
# Spec: docs/superpowers/specs/2026-08-22-tinytapeout-fpgas-online-design.md
- name: assert embed pin is complete
  assert:
    that: (tt_commander_embed_version | length == 0) or (tt_commander_embed_sha256 | length == 64)
    fail_msg: "tt_commander_embed_sha256 must be the 64-hex sha256 when tt_commander_embed_version is set"
  tags: [ttsite]

- {include_tasks: boards.yml, tags: [ttsite, ttsite-boards]}
- {include_tasks: django.yml, tags: [ttsite, ttsite-django]}
- {include_tasks: embed.yml, tags: [ttsite, ttsite-embed]}
- {include_tasks: nginx.yml, tags: [ttsite, ttsite-nginx]}
