---
- name: tt-boards.yaml present
  stat:
    path: "{{ ttsite_boards_path }}"
  register: ttsite_v_boards

- name: Assert tt-boards.yaml present
  assert:
    that: ttsite_v_boards.stat.exists
    fail_msg: "{{ ttsite_boards_path }} missing"

- name: vhost present
  stat:
    path: "/etc/nginx/sites-enabled/{{ ttsite_domain }}.conf"
  register: ttsite_v_vhost

- name: Assert vhost present
  assert:
    that: ttsite_v_vhost.stat.exists
    fail_msg: "/etc/nginx/sites-enabled/{{ ttsite_domain }}.conf missing"

- name: count ws-boards locations
  command: grep -c "location = /ws/board/" "/etc/nginx/includes/{{ ttsite_domain }}-ws-boards.conf"
  register: ttsite_v_ws
  changed_when: false
  failed_when: false

- name: live boards
  set_fact:
    ttsite_v_live: "{{ tt_boards | selectattr('port', 'defined') | rejectattr('port', 'none') | rejectattr('enabled', 'defined') | list
                       + tt_boards | selectattr('port', 'defined') | rejectattr('port', 'none') | selectattr('enabled', 'defined') | selectattr('enabled') | list }}"

- name: Assert one ws location per live board
  assert:
    that: (ttsite_v_ws.stdout | int) == (ttsite_v_live | length)
    fail_msg: "ws-boards include has {{ ttsite_v_ws.stdout }} locations, expected {{ ttsite_v_live | length }}"

- name: nginx config valid
  command: nginx -t
  changed_when: false

- name: landing page answers on the TT host
  uri:
    url: "http://127.0.0.1/"
    headers:
      Host: "{{ ttsite_domain }}"
    status_code: [200, 301, 302]
    return_content: true
  register: ttsite_v_index

- name: Assert TT landing page
  assert:
    that: "'Tiny Tapeout' in (ttsite_v_index.content | default('')) or ttsite_v_index.status in [301, 302]"
    fail_msg: "tinytapeout landing page did not render"

- name: embed bundle present when pinned
  stat:
    path: "{{ static_dir }}/tt-commander/{{ tt_commander_embed_version }}/tt-commander-embed.js"
  register: ttsite_v_embed
  when: tt_commander_embed_version | length > 0

- name: Assert embed bundle present
  assert:
    that: ttsite_v_embed.stat.exists
    fail_msg: "Commander embed bundle {{ tt_commander_embed_version }} not unpacked"
  when: tt_commander_embed_version | length > 0

- name: live fpga boards
  set_fact:
    ttsite_v_fpga_boards: "{{ ttsite_v_live | selectattr('kind', 'defined') | selectattr('kind', 'equalto', 'fpga') | list }}"

- name: first live fpga board slug ('' when none)
  set_fact:
    ttsite_v_fpga: "{{ ttsite_v_fpga_boards[0].slug if ttsite_v_fpga_boards | length > 0 else '' }}"

# Phase 2: the site proxies /api/board/<slug>/designs to the Pi's daemon. 200 =
# the daemon answered; 502 = the Pi is unreachable (the VM has none) but the
# proxy route exists and answers JSON either way.
- name: designs API answers on the TT host
  uri:
    url: "http://127.0.0.1/api/board/{{ ttsite_v_fpga }}/designs"
    headers:
      Host: "{{ ttsite_domain }}"
    status_code: [200, 502]
    return_content: true
  register: ttsite_v_designs
  when: ttsite_v_fpga | length > 0

- name: Assert designs API returns JSON
  assert:
    that: "'designs' in ttsite_v_designs.json or 'error' in ttsite_v_designs.json"
    fail_msg: "/api/board/{{ ttsite_v_fpga }}/designs did not return designs/error JSON"
  when: ttsite_v_fpga | length > 0
