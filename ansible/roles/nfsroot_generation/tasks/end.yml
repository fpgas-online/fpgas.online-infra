---
# End of a site.yml run: if the root changed, bump the generation marker, then
# release the update lock (`nfsroot-generation end` does both, marker
# first). Each netbooted board then reboots itself in its own stagger slot.

- name: Find the Pi NFS root
  ansible.builtin.stat:
    path: "{{ nfs_root }}/root/etc"
  register: nfsroot_generation_root

- name: Finish the Pi NFS root update
  when: nfsroot_generation_root.stat.isdir | default(false)
  block:
    - name: Publish the Pi NFS root update (bump if changed, then unlock)
      ansible.builtin.command: >-
        {{ nfsroot_generation_cmd }} end {{ nfs_root }}/root
        --bump {{ nfsroot_generation_bump | quote }}
        {% for p in nfsroot_generation_ignore %}--ignore={{ p | quote }} {% endfor %}
      register: nfsroot_generation_end
      changed_when: (nfsroot_generation_end.stdout | from_json).bumped
      when: not ansible_check_mode

    - name: Show what changed in the Pi NFS root
      ansible.builtin.debug:
        msg: >-
          {{ (nfsroot_generation_end.stdout | from_json).reason }}
          {{ (nfsroot_generation_end.stdout | from_json).sample }}
          -> {{ (nfsroot_generation_end.stdout | from_json).generation
                | default('generation unchanged') }}
      when: not ansible_check_mode
