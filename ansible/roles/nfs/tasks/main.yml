---
- name: Install packages
  apt:
    name:
      - nfs-kernel-server
    install_recommends: true
  tags:
    - nfs

# The role must create every path /etc/exports references: exportfs runs
# via flush_handlers at the END OF THIS ROLE, and on a fresh host the
# boot/root trees are only populated by later roles (fixpi/netboot) —
# exportfs fails with "Failed to stat" on missing paths (rebuild #2 P2-3,
# caught by CI before it hit hardware).
- name: create some dirs
  file:
    path: "{{ item }}"
    state: directory
  loop:
    - "{{ nfs_root }}"
    - "{{ nfs_root }}/boot"
    - "{{ nfs_root }}/root"

- name: nfs only on internal nic
  lineinfile:
    path: /etc/default/nfs-kernel-server
    regexp: '^host='
    line: "host={{ eth_local_address }}"

- name: write etc/exports
  template:
    src: templates/exports.j2
    dest: /etc/exports
  notify: exportfs

- name: enable and start server service rpcbind
  systemd:
    name: rpcbind
    enabled: true
    state: started

- name: enable and start server service nfs-kernel-server
  systemd:
    name: nfs-kernel-server
    enabled: true
    state: started

# Apply exports (and any other notified reloads) NOW: a later-role failure
# aborts the play and eats notified handlers — the tweed rebuild ran 11
# converges with /etc/exports written but the kernel export table EMPTY
# (rpc.mountd "unmatched host" on every Pi mount), because run 1 failed
# after this role and no later run re-notified (C1-4, 2026-08-26; same
# class as vlan-ports/C1-1).
- meta: flush_handlers
