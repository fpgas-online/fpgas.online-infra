---
# Restart, not reload: acng only applies Remap-*/backend changes on a full
# restart (a reload leaves remapped paths answering 503; ten64 apt_proxy).
- name: Restart apt-cacher-ng (apt-cache)
  ansible.builtin.systemd_service:
    name: apt-cacher-ng
    state: restarted

- name: Reload nginx (apt-cache)
  ansible.builtin.systemd_service:
    name: nginx
    state: reloaded
