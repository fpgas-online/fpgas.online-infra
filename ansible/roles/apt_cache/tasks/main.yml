---
# The cache service. The NFS root's apt sources are pointed at it by
# tasks/nfsroot.yml, which site.yml runs right after img extracts the root (a
# fresh extract restores the image's upstream sources). Not gated on
# apt_cache_enabled: with the cache disabled it renders the upstream URLs, so
# turning the cache off really does take it out of the path.
# Design: docs/superpowers/specs/2026-09-08-tweed-apt-cache-design.md
- name: Apt cache facts
  ansible.builtin.import_tasks: facts.yml
  tags: [always]

- name: Apt cache service
  when: apt_cache_enabled | bool
  tags: [apt-cache]
  block:
    - name: Apt-cacher-ng
      ansible.builtin.import_tasks: server.yml

    - name: Nginx front end and certificate
      ansible.builtin.import_tasks: tls.yml

# acng must already be serving the remaps, and nginx the vhost, before the
# first client (the gateway itself, later in this play) uses them. (Outside
# the block: flush_handlers does not take a `when`.)
- name: Apply apt cache config before any client uses it
  ansible.builtin.meta: flush_handlers
  tags: [apt-cache]
