---
# apt caching proxy on the gateway. Design:
# docs/superpowers/specs/2026-09-08-tweed-apt-cache-design.md

# Escape hatch per host: false leaves every apt client on its upstream URL.
apt_cache_enabled: true

# Public name, with its own Let's Encrypt lineage. Needs a public DNS record
# (the fpgas.online zone on ns1) before the certificate can issue; until then
# clients use the plain-http address below. See README.md.
apt_cache_host: "apt.{{ domain_name }}"

apt_cache_port: 3142

# acng BindAddress. Empty = listen on every address, which is deliberate: an
# explicit list is bound once at start-up, so an address that is not up yet
# (eth-local under networkd at boot) is silently never listened on -- ten64's
# acng carries five BindAddress entries and listens on 127.0.0.1 only. The
# firewall's input chain is what keeps 3142 off the uplink.
apt_cache_bind_addresses: ""

# Chain upstream through another cache, e.g. ten64's: http://10.99.21.1:3142.
# Empty = fetch directly. LIMITATION: acng reaches https:// backends through
# a proxy with CONNECT, and ten64's acng refuses CONNECT (403), so while this
# is set the https remaps below (fpgasonline, fpgatools, nfsrootwatchdog)
# fail; the http ones (raspbian, raspberrypi, debian) work.
apt_cache_upstream_proxy: ""

apt_cache_dir: /var/cache/apt-cacher-ng

# Request the certificate. The VM test has no public DNS or inbound port 80,
# so it follows site_certbot (false there).
apt_cache_certbot: "{{ site_certbot | default(true) }}"

# Every repository the Pi NFS root uses. acng will not CONNECT-tunnel HTTPS,
# so a repo that is not listed here cannot be cached: add it here BEFORE
# pointing a client at {{ apt_cache_url }}/<path>/.
#   name:    Remap-<name>; also the cache directory name under apt_cache_dir.
#   path:    the URL prefix clients use.
#   aliases: upstream host/paths that map onto the same cache directory.
#   backend: where acng actually fetches from (the canonical URL, never a
#            redirect: fpgas.online/apt and mithro.github.io/* both 301).
#            Raspbian in particular is archive.raspbian.org, NOT the image's
#            raspbian.raspberrypi.com: that host is a MirrorBrain redirector
#            that answers index files itself but 302s every pool file to a
#            per-region mirror, and through it the PR #78 VM run got 54
#            "503 Connection closed" -- every one a package whose name has an
#            escaped + or ~. ten64's acng has always used archive.raspbian.org.
#   probe:   a Release file under path; verify fetches it through the cache.
#            (A Release fetch never exercises a pool-file redirect.)
apt_cache_remaps:
  - name: raspbian
    path: /raspbian
    aliases:
      - archive.raspbian.org/raspbian
      - raspbian.raspberrypi.com/raspbian
      - mirrordirector.raspbian.org/raspbian
    backend: http://archive.raspbian.org/raspbian/
    probe: dists/bookworm/Release
  - name: raspberrypi
    path: /raspberrypi
    aliases:
      - archive.raspberrypi.com/debian
      - archive.raspberrypi.org/debian
    backend: http://archive.raspberrypi.com/debian/
    probe: dists/bookworm/Release
  # GitHub Pages: see "Range hazard" in README.md.
  - name: fpgasonline
    path: /fpgas-online
    aliases:
      - apt.fpgas.online
      - fpgas.online/apt
    backend: https://apt.fpgas.online/
    probe: bookworm/Release
  # GitHub Pages, flat per-suite repo (clients use
  # /fpgas-online-fpga-tools/<suite>/ ./): fpgas_apt/tasks/fpga-tools.yml.
  # fpgas.online/<repo> is the canonical URL; the github.io one 301s to it.
  - name: fpgatools
    path: /fpgas-online-fpga-tools
    aliases:
      - fpgas.online/fpgas.online-fpga-tools
    backend: https://fpgas.online/fpgas.online-fpga-tools/
    probe: bookworm/Release
  # GitHub Pages, flat per-suite repo (clients use
  # /nfsroot-watchdog/<suite>/ ./): fpgas_apt/tasks/nfsroot-watchdog.yml.
  - name: nfsrootwatchdog
    path: /nfsroot-watchdog
    aliases:
      - fpgas.online/nfsroot-watchdog
    backend: https://fpgas.online/nfsroot-watchdog/
    probe: bookworm/Release

# Remaps that are gone from the list above. Their backend files are removed,
# so /etc/apt-cacher-ng holds only what apt_cache_remaps configures.
#   rp1jtag: mithro/rp1-jtag no longer publishes packages (its #25,
#            2026-09-25) and mith.ro/rp1-jtag serves no apt repository; the
#            roots dropped its source already (fpgas_apt/tasks/rp1-jtag.yml).
apt_cache_retired_remaps:
  - rp1jtag

# Stock acng.conf remaps the NFS root also uses (Remap-debrep, for fixpi's
# Debian armmp kernel source; Remap-secdeb). Not configured here: the paths
# are exposed through nginx, and the probes are fetched by verify.
apt_cache_stock_paths:
  - /debian
  - /debian-security
apt_cache_stock_probes:
  - /debian/dists/bookworm/Release

# Stock Debian archives the pulled NFS root image may name (fixpi's armmp
# source): acng serves them under its built-in debrep/secdeb remaps, i.e. the
# paths in apt_cache_stock_paths. Used by tasks/nfsroot.yml's rewrite.
apt_cache_nfsroot_stock_prefixes:
  - {prefix: deb.debian.org/debian, path: /debian}
  - {prefix: security.debian.org/debian-security, path: /debian-security}
