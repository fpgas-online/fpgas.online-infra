---
# The NFS root's two stock sources (from the RPi OS image) now belong to this
# role; they previously pointed straight at upstream. The other sources are
# owned by the roles that add them and derive their URL from apt_cache_url
# too: fixpi (debian-armmp.sources) and fpgas-apt (fpgas-online.list).
# verify/main.yml asserts that EVERY source in the root goes through the cache.
- name: Raspbian source in the NFS root
  ansible.builtin.template:
    src: sources.list.j2
    dest: "{{ nfs_root }}/root/etc/apt/sources.list"
    mode: "0644"

- name: Raspberry Pi source in the NFS root
  ansible.builtin.template:
    src: raspi.list.j2
    dest: "{{ nfs_root }}/root/etc/apt/sources.list.d/raspi.list"
    mode: "0644"
