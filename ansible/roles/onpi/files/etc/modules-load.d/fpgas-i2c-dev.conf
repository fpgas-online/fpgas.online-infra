# The I2C character devices /dev/i2c-N for every bus the kernel has
# (fpgas.online-infra issue #200): i2ctransfer/i2cget and the Orange Pis' HAT
# ID EEPROM read need them. Nothing else loads i2c-dev in this root: Debian's
# udev i2c rules do not, and Raspberry Pi OS's raspi-config does it only when
# its I2C option is switched on, which a netbooted root never runs.
i2c-dev
