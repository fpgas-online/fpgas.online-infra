# networkd starts only once fpgas-uplink-network has written the uplink's
# .network (KeepConfiguration=yes: never drop the NFS root's address), and not
# at all if it failed. Without that file, networkd would treat the live NFS
# link as an ordinary interface. On the blades at ps1 (a trixie root, overlay
# over NFS) a DHCP-only .network without KeepConfiguration made networkd drop
# the kernel's address as soon as it started; the NFS root became
# unreachable and the hardware watchdog reset the boards in a loop
# (systemd/systemd #44156).
# Requires= also passes a stop or restart of fpgas-uplink-network on to
# networkd; that is harmless (KeepConfiguration=yes keeps the address), and
# nothing on the Pi restarts either.
[Unit]
Requires=fpgas-uplink-network.service
After=fpgas-uplink-network.service
