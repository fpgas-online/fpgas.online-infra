# fpgas-network-state publishes boot events to the site, and the site drops
# events from a machine it has not seen register: start after the fleet agent,
# which is ready once the broker has acknowledged its registration
# (fpgas-online-setup-pi fleet-agent.service). The states networkd reached
# before this point still give a record each: Debian runs the dispatcher with
# --run-startup-triggers (/etc/default/networkd-dispatcher).
[Unit]
After=fpgas-fleet-agent.service
