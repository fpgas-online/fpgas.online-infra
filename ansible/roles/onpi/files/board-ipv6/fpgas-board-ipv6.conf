# dhcpcd settings for fpgas-board-ipv6.service: take this board's per-port
# IPv6 address from the gateway by DHCPv6. dhcpcd is started with this file
# instead of /etc/dhcpcd.conf, on the one interface the NFS root is mounted
# over (/usr/local/sbin/fpgas-board-ipv6.sh).
#
# Besides adding the address, dhcpcd changes one kernel setting of that
# interface, whatever this file says: net.ipv6.conf.<interface>.addr_gen_mode
# goes from 0 to 1, and stays 1 after dhcpcd has stopped. With it the kernel
# makes no link-local address the next time the interface is brought up; the
# link-local address the interface has is kept, and a netbooted board never
# takes this interface down. tests/test_board_ipv6_netns.py reads the setting
# before and after, with the others named below.
#
# Installed by fpgas.online-infra, roles/onpi/tasks/ipv6.yml. The same file
# on every board: nothing here names a board, a port or an interface.

# IPv4 on this interface belongs to the kernel (ip=dhcp on the command
# line) and carries the NFS root: never look at it, never change it.
ipv6only

# Leave router advertisements to the kernel, which takes the default route
# from them (the gateway sends them on every port, periodically:
# roles/pxe's radvd.conf.j2). With this set dhcpcd neither sends router
# solicitations nor changes the interface's accept_ra and autoconf settings.
noipv6rs

# Ask for one address (an IA_NA). Naming it here also makes dhcpcd start
# DHCPv6 at once instead of waiting for a router advertisement to tell it to.
ia_na

# The client identifier is this interface's MAC address (DUID-LL): the same
# at every boot of a board, different between boards. The default would
# be time-based and stored under /var/lib/dhcpcd, which is a fresh tmpfs
# overlay at each boot, so the board would be a new client every time and
# the gateway, whose range for the port holds one address, would refuse it
# until the lease of the previous boot ran out. This is only a hint for a
# board that has no /var/lib/dhcpcd/duid yet: the image must not carry one
# (ansible/ci-nfsroot.yml checks).
duid ll

# Keep the address if dhcpcd stops: ssh sessions over it stay up.
persistent

# Run no hook scripts: the lease must not rewrite /etc/resolv.conf, the
# hostname or the time servers.
script ""

# One named interface: no udev bookkeeping for others that come and go.
nodev
