---

- name: apt update/upgrade
  apt:
    # name: "*"
    upgrade: true
    state: latest
    update_cache: true
    cache_valid_time: 86400

# something odd here...
# dpkg-divert: error: rename involves overwriting '/usr/share/vim/vim82/doc/help.txt.vim-tiny' with different file '/usr/share/vim/vim82/doc/help.txt', not allowed
# so remove it
- name: apt remove tiny-vim
  apt:
    name:
      - vim-tiny
    state: absent

- name: Install packages
  apt:
    name:
      - overlayroot
      - ssh-import-id
      - software-properties-common
      - vim
      - tmux
      - screen
      - tio
      - minicom
      - uhubctl
      - picocom
      - git
      - sshfs
      - rsync
      - atftpd
      - atftp
      - nmap
      - tree
      - ack
      - tcpdump
      - i2c-tools
      # Advertises this Pi's hostname on its link so the switch's LLDP
      # neighbour table names which Pi is on which port -- confirms the
      # assumed cabling instead of trusting it (fpgas.online-setup-pi#6;
      # the server half is the lldp role). A running Pi only picks this up
      # after a reboot: the NFS root is a read-only lower layer.
      - lldpd
      - openocd
      - fxload
      - openwince-jtag
      - python3-full
      - python3-venv
      - python3-pip
      - python3-tqdm
      - python3-numpy
      - python3-rpi.gpio
      - python3-serial
      - pipx
      - dkms
      - python3-dev
      - libfreetype6-dev
      - libjpeg-dev
      - build-essential
    install_recommends: true
  tags:
    - img

# openFPGALoader on the Pis comes from mithro/rp1-jtag rather than Debian. It is
# built with -DENABLE_RP1_PIO=ON, so on a Pi 5 / CM5 it drives JTAG from the RP1's
# PIO block instead of bit-banging GPIOs through libgpiod, and it is new enough to
# have --read-dna / --read-xadc / --read-register (Debian's 0.10.0 has none of
# them, which is why FPGA DNA could not be read on the welland boards).
#
# Debian's `openfpgaloader` ships the same /usr/bin/openFPGALoader and the rp1pio
# package declares no Conflicts/Replaces, so dpkg refuses to unpack over it. It
# has to be removed first, and staying removed is what makes ours the default.
- name: Remove Debian's openfpgaloader
  ansible.builtin.apt:
    name: openfpgaloader
    state: absent
  tags:
    - img
    - openfpgaloader
    - fpgas-apt

- name: Install openFPGALoader with RP1 PIO acceleration
  ansible.builtin.apt:
    name: openfpgaloader-rp1pio
    state: present
  tags:
    - img
    - openfpgaloader
    - fpgas-apt

#      - raspberrypi-kernel-headers

- name: Remove useless packages from the cache
  apt:
    autoclean: true

- name: Remove dependencies that are no longer required
  apt:
    autoremove: true

# Pin the pipx locations: bare `pipx install` places venvs wherever the
# invoking environment points it (the old tweed chroot build: /root/.local/
# pipx; the CI runner chroot: /opt/pipx) and puts the binaries on no user's
# PATH. /opt/pipx + /usr/local/bin is deterministic and reachable by every
# user (issue #34 CI-vs-tweed manifest comparison).
- name: install mpremote via pipx
  command: "pipx install mpremote"
  args:
    creates: /usr/local/bin/mpremote
  environment:
    PIPX_HOME: /opt/pipx
    PIPX_BIN_DIR: /usr/local/bin
  tags:
    - mp

- name: install uv via pipx
  command: "pipx install uv"
  args:
    creates: /usr/local/bin/uv
  environment:
    PIPX_HOME: /opt/pipx
    PIPX_BIN_DIR: /usr/local/bin
  tags:
    - mp
