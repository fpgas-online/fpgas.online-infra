---

- name: apt update/upgrade
  apt:
    # name: "*"
    upgrade: true
    state: latest
    update_cache: true
    cache_valid_time: 86400

# something odd here...
# dpkg-divert: error: rename involves overwriting '/usr/share/vim/vim82/doc/help.txt.vim-tiny' with different file '/usr/share/vim/vim82/doc/help.txt', not allowed
# so remove it
- name: apt remove tiny-vim
  apt:
    name:
      - vim-tiny
    state: absent

- name: Install packages
  apt:
    name:
      - overlayroot
      - ssh-import-id
      - software-properties-common
      - vim
      - tmux
      - screen
      - tio
      - minicom
      - uhubctl
      - picocom
      - git
      - sshfs
      - rsync
      - atftpd
      - atftp
      - nmap
      - tree
      - ack
      - tcpdump
      - i2c-tools
      # Advertises this Pi's hostname on its link so the switch's LLDP
      # neighbour table names which Pi is on which port -- confirms the
      # assumed cabling instead of trusting it (fpgas.online-setup-pi#6;
      # the server half is the lldp role). A running Pi only picks this up
      # after a reboot: the NFS root is a read-only lower layer.
      - lldpd
      # openocd / openfpgaloader: the RP1-PIO builds, below.
      - fxload
      - openwince-jtag
      - python3-full
      - python3-venv
      - python3-pip
      - python3-tqdm
      - python3-numpy
      - python3-rpi.gpio
      - python3-serial
      - pipx
      - dkms
      - python3-dev
      - libfreetype6-dev
      - libjpeg-dev
      - build-essential
    install_recommends: true
  tags:
    - img

# openFPGALoader and OpenOCD on the Pis come from mithro/rp1-jtag rather than
# Debian. Both are built against librp1jtag, so on a Pi 5 / CM5 they drive
# JTAG from the RP1's PIO block instead of bit-banging GPIOs through libgpiod,
# and the openFPGALoader is new enough to have --read-dna / --read-xadc /
# --read-register (Debian's 0.10.0 has none of them, which is why FPGA DNA
# could not be read on the welland boards).
#
# Both packages declare Provides/Conflicts/Replaces on the Debian package
# they stand in for, so a root that already has Debian's openocd or
# openfpgaloader (every root built before this task) is swapped in place:
# the apt module runs `apt-get -y install` without --no-remove
# (fail_on_autoremove is false), and apt resolves the Conflicts by removing
# the stock package in the same transaction. Debian's names must stay out
# of the "Install packages" list above, or the next run would swap them
# back.
#
# The source is roles/fpgas-apt/tasks/rp1-jtag.yml, which runs under the
# fpgas-apt tag; this task carries fpgas-apt too so the VM integration test,
# which skips that tag (issue #49), skips the install along with the source.
- name: Install the RP1-PIO openFPGALoader and OpenOCD
  ansible.builtin.apt:
    name:
      - openfpgaloader-rp1pio
      - openocd-rp1pio
    state: present
  tags:
    - img
    - rp1-jtag
    - fpgas-apt

#      - raspberrypi-kernel-headers

- name: Remove useless packages from the cache
  apt:
    autoclean: true

- name: Remove dependencies that are no longer required
  apt:
    autoremove: true

# Pin the pipx locations: bare `pipx install` places venvs wherever the
# invoking environment points it (the old tweed chroot build: /root/.local/
# pipx; the CI runner chroot: /opt/pipx) and puts the binaries on no user's
# PATH. /opt/pipx + /usr/local/bin is deterministic and reachable by every
# user (issue #34 CI-vs-tweed manifest comparison).
- name: install mpremote via pipx
  command: "pipx install mpremote"
  args:
    creates: /usr/local/bin/mpremote
  environment:
    PIPX_HOME: /opt/pipx
    PIPX_BIN_DIR: /usr/local/bin
  tags:
    - mp

- name: install uv via pipx
  command: "pipx install uv"
  args:
    creates: /usr/local/bin/uv
  environment:
    PIPX_HOME: /opt/pipx
    PIPX_BIN_DIR: /usr/local/bin
  tags:
    - mp
