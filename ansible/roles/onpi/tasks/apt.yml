---

# A run that died mid-upgrade (an aborted play, a postinst that failed in
# the chroot) leaves packages half-configured, and apt then refuses to do
# anything until dpkg has finished them. Do that first, so the role can
# always be re-run to repair the root.
- name: finish any interrupted dpkg configuration
  command: dpkg --configure -a
  register: onpi_dpkg_configure
  changed_when: onpi_dpkg_configure.stdout | trim | length > 0

- name: apt update/upgrade
  apt:
    # name: "*"
    upgrade: true
    state: latest
    update_cache: true
    cache_valid_time: 86400

# something odd here...
# dpkg-divert: error: rename involves overwriting '/usr/share/vim/vim82/doc/help.txt.vim-tiny' with different file '/usr/share/vim/vim82/doc/help.txt', not allowed
# so remove it
- name: apt remove tiny-vim
  apt:
    name:
      - vim-tiny
    state: absent

- name: Install packages
  apt:
    name:
      - overlayroot
      - ssh-import-id
      - software-properties-common
      - vim
      - tmux
      - screen
      - tio
      - minicom
      - uhubctl
      - picocom
      - git
      - sshfs
      - rsync
      - atftpd
      - atftp
      - nmap
      - tree
      - ack
      - tcpdump
      - i2c-tools
      # Advertises this Pi's hostname on its link so the switch's LLDP
      # neighbour table names which Pi is on which port -- confirms the
      # assumed cabling instead of trusting it (fpgas.online-setup-pi#6;
      # the server half is the lldp role). A running Pi only picks this up
      # after a reboot: the NFS root is a read-only lower layer.
      - lldpd
      # openocd / openfpgaloader: the fpgas.online builds, below.
      - fxload
      - openwince-jtag
      - python3-full
      - python3-venv
      - python3-pip
      - python3-tqdm
      - python3-numpy
      - python3-rpi.gpio
      - python3-serial
      - pipx
      - dkms
      - python3-dev
      - libfreetype6-dev
      - libjpeg-dev
      - build-essential
    install_recommends: true
  tags:
    - img

# openFPGALoader and OpenOCD on the Pis come from fpgas.online-fpga-tools
# rather than Debian. They carry the fpgas.online patch series: the rp1pio
# cable (JTAG through the Pi 5 / CM5 RP1 PIO block instead of bit-banging
# GPIOs through libgpiod -- librp1jtag is linked in statically here, so there
# is no librp1jtag0 dependency), the netv2 / tt_fpga boards, --flash-info,
# and an upstream base new enough to have --read-dna / --read-xadc /
# --read-register (Debian's 0.10.0 has none of them, which is why FPGA DNA
# could not be read on the welland boards).
#
# These replace the older openfpgaloader-rp1pio / openocd-rp1pio from
# mithro/rp1-jtag. No explicit removal task is needed: each package declares
#   Conflicts/Replaces: openfpgaloader, openfpgaloader-fpgasonline-git,
#                       openfpgaloader-rp1pio
# (and the openocd equivalents), and the apt module runs `apt-get -y install`
# without --no-remove (fail_on_autoremove is false), so apt resolves the
# Conflicts by removing the superseded package in the same transaction.
# That covers Debian's stock openocd / openfpgaloader too, on every root
# built before any of this existed. Neither Debian's names nor the -rp1pio
# names may go in the "Install packages" list above, or the next run would
# swap them back. librp1jtag0, left orphaned by the -rp1pio removal, is
# cleaned up by the autoremove task below.
#
# state: latest, not present. The "apt update/upgrade" task above is
# upgrade: true, which is aptitude safe-upgrade (or `apt-get upgrade
# --with-new-pkgs`) -- it never removes a package, so any future revision of
# these two whose dependencies are dropped or renamed is silently held back,
# and `state: present` would then never touch an already-installed version
# again. The patch-set revision (the ...post<N> suffix) is the whole point of
# these packages, and a root is rebuilt rarely enough that a stale one is
# hard to notice, so these two are pinned to the archive's newest rather than
# to whatever landed first. This does not make the play less deterministic
# than it already is: the blanket dist-upgrade above has the same property.
#
# The source is roles/fpgas-apt/tasks/fpga-tools.yml, which runs under the
# fpgas-apt tag; this task carries fpgas-apt too so the VM integration test,
# which skips that tag (issue #49), skips the install along with the source.
- name: Install the fpgas.online openFPGALoader and OpenOCD  # noqa: package-latest
  ansible.builtin.apt:
    name:
      - openfpgaloader-fpgasonline
      - openocd-fpgasonline
    state: latest
  tags:
    - img
    - rp1-jtag
    - fpgas-apt

#      - raspberrypi-kernel-headers

- name: Remove useless packages from the cache
  apt:
    autoclean: true

- name: Remove dependencies that are no longer required
  apt:
    autoremove: true

# Pin the pipx locations: bare `pipx install` places venvs wherever the
# invoking environment points it (the old tweed chroot build: /root/.local/
# pipx; the CI runner chroot: /opt/pipx) and puts the binaries on no user's
# PATH. /opt/pipx + /usr/local/bin is deterministic and reachable by every
# user (issue #34 CI-vs-tweed manifest comparison).
- name: install mpremote via pipx
  command: "pipx install mpremote"
  args:
    creates: /usr/local/bin/mpremote
  environment:
    PIPX_HOME: /opt/pipx
    PIPX_BIN_DIR: /usr/local/bin
  tags:
    - mp

- name: install uv via pipx
  command: "pipx install uv"
  args:
    creates: /usr/local/bin/uv
  environment:
    PIPX_HOME: /opt/pipx
    PIPX_BIN_DIR: /usr/local/bin
  tags:
    - mp
