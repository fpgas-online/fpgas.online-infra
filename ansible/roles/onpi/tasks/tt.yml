---
# Tiny Tapeout bridge daemon (fpgas-online-tt) and the FPGA demo bitstreams
# (fpgas-online-tt-demos, /usr/share/fpgas-tt/demos) baked into the shared Pi
# NFS root: every Pi runs the daemon; a Pi without a /dev/ttboard just waits
# for one. The daemon learns what its board is from the board (its USB serial
# and the boot check's report on the Pi), so no catalogue goes into the root
# (fpgas.online-tt issue #14); it keeps the demos on the Pi and loads one into
# an FPGA board when asked.
# tt_boards lives on the build host (the Pi "host" is the CI build's
# chroot), so read it from the first nbp host's vars when this host has
# none of its own: here it only says "this site runs the Tiny Tapeout site".
# The role keeps its copy in onpi_tt_boards rather than setting a tt_boards
# fact over the inventory variable.
- name: Tt_boards from the server host
  ansible.builtin.set_fact:
    onpi_tt_boards: "{{ tt_boards if tt_boards is defined else hostvars[groups['nbp'][0]].tt_boards }}"
  when: tt_boards is defined or hostvars[groups['nbp'][0]].tt_boards is defined

# The daemon + demo debs are generic fleet content, so the CI nfsroot build
# (issue #34) bakes them with tt_install: true even though it has no
# tt_boards; the service enablement stays keyed to tt_boards and is applied
# by the consuming server (a service enabled everywhere would change
# behaviour on sites without the Tiny Tapeout site).
- name: Tiny Tapeout bridge packages (generic)
  when: tt_install | default(onpi_tt_boards is defined)
  block:
    # Both debs are rolling releases from the fpgas-online apt repo:
    # `latest` so re-running the pi play picks up a newer daemon/demo set.
    # (noqa: that upgrade on every run is the point, not an accident.)
    - name: Install fpgas-online-tt + the FPGA demo bitstreams  # noqa: package-latest
      ansible.builtin.apt:
        name:
          - fpgas-online-tt
          - fpgas-online-tt-demos
        state: latest
        update_cache: true
        cache_valid_time: 600

    - name: Create /etc/fpgas-online
      ansible.builtin.file:
        path: /etc/fpgas-online
        state: directory
        mode: "0755"

- name: Tiny Tapeout bridge enabled (when this site runs the Tiny Tapeout site)
  when: onpi_tt_boards is defined
  block:
    # The bridge that reads no catalogue is fpgas-online-tt 0.0.post64 and later
    # (it has identity.py, which reads the boot check's report). An older bridge
    # reads the catalogue at every start: taking the file from under it would
    # leave every Tiny Tapeout board a plain serial bridge.
    - name: Look for the bridge that reads no catalogue in the Pi root
      ansible.builtin.stat:
        path: /usr/lib/python3/dist-packages/fpgas_tt/identity.py
      register: onpi_tt_identity

    - name: Assert the Pi root's bridge reads no catalogue
      ansible.builtin.assert:
        that: onpi_tt_identity.stat.exists
        fail_msg: >-
          The Pi root's fpgas-online-tt is older than 0.0.post64 (no fpgas_tt/identity.py): it still reads
          /etc/fpgas-online/tt-boards.yaml. Update the root before this layer takes the file away.

    - name: No Tiny Tapeout catalogue in the Pi root (a root from before the bridge stopped reading one)
      ansible.builtin.file:
        path: /etc/fpgas-online/tt-boards.yaml
        state: absent

    - name: Enable fpgas-tt.service
      ansible.builtin.systemd:
        name: fpgas-tt.service
        enabled: true
