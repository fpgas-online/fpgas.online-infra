---
# Reboot a board by itself once the NFS root has changed underneath it:
# fpgas-online/nfsroot-watchdog, whose README explains the stale-handle
# problem, the triggers and the stagger. roles/nfsroot-generation is the
# server half that marks a finished root update.
#
# The package depends on busybox-static (the watchdog runs from /run under
# it, so a stale libc cannot stop it), which replaces the root's dynamic
# busybox and regenerates its initramfs images once. It enables its own
# units. Its apt source comes from roles/fpgas-apt, hence the fpgas-apt tag.

- name: install nfsroot-watchdog
  ansible.builtin.apt:
    name: nfsroot-watchdog
    state: latest  # noqa: package-latest -- rolling release, like fpga-tools
  tags: [fpgas-apt]

# A conffile the package ships all-commented: replacing it is the intended
# way to configure it, and dpkg keeps this copy across upgrades.
- name: nfsroot-watchdog settings for fpgas.online
  ansible.builtin.template:
    src: nfsroot-watchdog.default.j2
    dest: /etc/default/nfsroot-watchdog
    mode: "0644"
  tags: [fpgas-apt]
