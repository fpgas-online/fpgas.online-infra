---
- name: Upgrade and install the NFS root packages
  ansible.builtin.include_tasks: apt.yml

# Install the fpgas-online-setup-pi deb which provides:
# - zsh/tmux shell environment
# - profile.d scripts, SSH/keyboard config
# - pistat reporter scripts and systemd services
# - arty board detection services
# - network interface naming (.link files)
- name: Install fpgas-online-setup-pi
  ansible.builtin.apt:
    name: fpgas-online-setup-pi
    state: present

# NOT FOR MERGE (VM proof for #299): setup-pi#18's 11-eth-uplink.link before
# its deb is published, so this branch's VM test boots it.
- name: VM proof only - setup-pi#18's 11-eth-uplink.link
  ansible.builtin.copy:
    src: vmproof/11-eth-uplink.link
    dest: /etc/systemd/network/11-eth-uplink.link
    mode: "0644"

- name: Let the kernel pick the NFS version
  ansible.builtin.include_tasks: nonfs.yml
- {name: Install the Tiny Tapeout bridge and site catalogue, ansible.builtin.include_tasks: tt.yml}
- {name: Enable the fleet agent units, ansible.builtin.include_tasks: fleet.yml}
- {name: Configure the Pi tftpd, ansible.builtin.include_tasks: tftpd.yml}
- {name: "Let systemd-networkd manage the network, IPv4 and IPv6", ansible.builtin.include_tasks: networkd.yml}
- {name: Give every I2C bus its /dev node, ansible.builtin.include_tasks: i2c.yml}
# No ssh keys here: the site owns the root's authorized_keys (fixpi
# authorized_keys.yml), and the image ships none.
- {name: "Create the pi user's upload and download directories", ansible.builtin.include_tasks: tweeks.yml}
# Before the boot check: its Acorn tools recommend the driver, and a prebuilt module already in the root is
# what keeps apt from choosing the DKMS package (tasks/litepcie.yml).
- name: Install the prebuilt LitePCIe driver for the Acorn DMA test
  ansible.builtin.include_tasks: litepcie.yml
  when: onpi_litepcie_modules
- {name: Install and enable the FPGA boot check, ansible.builtin.include_tasks: fpga_verify.yml}
- {name: Install and configure nfsroot-watchdog, ansible.builtin.include_tasks: stale_root.yml}
