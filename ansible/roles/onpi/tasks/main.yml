---
- name: Upgrade and install the NFS root packages
  ansible.builtin.include_tasks: apt.yml

# Install the fpgas-online-setup-pi deb which provides:
# - zsh/tmux shell environment
# - profile.d scripts, SSH/keyboard config
# - pistat reporter scripts and systemd services
# - arty board detection services
# - network interface naming (.link files)
- name: Install fpgas-online-setup-pi
  ansible.builtin.apt:
    name: fpgas-online-setup-pi
    state: present
  tags:
    - fpgas-apt

- name: Let the kernel pick the NFS version
  ansible.builtin.include_tasks: nonfs.yml
- {name: Install the Tiny Tapeout bridge and site catalogue, ansible.builtin.include_tasks: tt.yml, tags: [fpgas-apt]}
- {name: Enable the fleet agent units, ansible.builtin.include_tasks: fleet.yml, tags: [fpgas-apt]}
- {name: Configure the Pi tftpd, ansible.builtin.include_tasks: tftpd.yml}
# No ssh keys here: the site owns the root's authorized_keys (fixpi
# authorized_keys.yml), and the image ships none.
- {name: "Create the pi user's upload and download directories", ansible.builtin.include_tasks: tweeks.yml}
- {name: Install and enable the FPGA boot check, ansible.builtin.include_tasks: fpga_verify.yml, tags: [fpgas-apt]}
- {name: Install and configure nfsroot-watchdog, ansible.builtin.include_tasks: stale_root.yml}
