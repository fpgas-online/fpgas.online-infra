---
# Stale-NFS-root watchdog (tasks/stale_root.yml): the nfsroot-watchdog
# package from fpgas-online/nfsroot-watchdog, configured for this fleet.
# Every setting is documented in the package's /etc/default/nfsroot-watchdog;
# these are the ones fpgas.online sets.

# Files a root rebuild is known to replace (measured 2026-09-24 on
# pi-sw2-p33: all three answered ESTALE through the overlay; the stale
# authorized_keys is what broke key-based ssh fleet-wide). The package adds
# its generation marker itself.
onpi_nfsroot_watchdog_probes:
  - /var/lib/dpkg/status
  - /etc/ld.so.cache
  - /home/pi/.ssh/authorized_keys
  - /root/.ssh/authorized_keys

# Stagger by switch placement: pi-sw<S>-p<P> -> slot (S-1)*48 + (P-1), so
# no two boards on a site share a slot. 96 slots x 20 s: a two-switch site
# is done within ~33 min.
onpi_nfsroot_watchdog_slot_sed: 's/^pi-sw([0-9]+)-p([0-9]+)$/\1 \2/'
onpi_nfsroot_watchdog_slot_stride: 48
onpi_nfsroot_watchdog_slot_base: 49
onpi_nfsroot_watchdog_slots: 96
onpi_nfsroot_watchdog_spacing: 20

# true: the boards only log "would reboot" (journal + netconsole).
onpi_nfsroot_watchdog_dry_run: false

# FPGA boot check (tasks/fpga_verify.yml): the fpgas-verify mode package baked into the root. The root is
# shared by every Pi at a site, so by default it checks whichever boards are attached. A site with one kind
# of board can name that board's package instead (fpgas-online-acorn, -arty, -netv2, -fomu or -tt-fpga):
# it installs only that board's tools, and a Pi without that board fails its check.
onpi_fpga_verify_package: fpgas-online-all-boards

# The prebuilt LitePCIe driver for the Acorn PCIe SoC (tasks/litepcie.yml): litepcie.ko for every kernel in
# the root that a Pi 5 boots, which fpgas-verify's Acorn `dma` test needs. The fpgas.online apt repository
# serves fpgas-online-acorn-litepcie-modules-<kernel> since 2026-10-04 (fpgas.online-test-designs releases
# them, and fpgas-online/apt collects them like its other packages). The root's build fails at the install
# for a Pi 5 kernel that has no module package; set this false only for a root no Pi 5 or CM5 boots.
#
# OFF since 2026-10-05, until the role handles a kernel without a modules package: a from-scratch root
# carries 6.6.31+rpt-rpi-v8 beside the kernel the boards boot, and the build stopped with
#   No package matching 'fpgas-online-acorn-litepcie-modules-6.6.31+rpt-rpi-v8:arm64' is available
# (vm-test run 37213351442). Nothing needs the driver yet: the boot check does not load it. verify-pi
# takes what to expect from the root, so a root without the driver passes its check.
onpi_litepcie_modules: false
