---
# Add the fpgas.online apt repository to hosts that need fpgas-online deb packages.

# fpgas-online/apt: the platform's own packages (fpgas-online-setup-pi, -cam,
# -tt, ...). Key, keyring and source are all named after the repository,
# "apt" (docs/conventions.md in mithro/apt-repo-action); tasks/repo.yml.
- name: Add the fpgas.online apt repository
  ansible.builtin.include_tasks: repo.yml
  vars:
    repo_name: apt
    repo_url: "{{ fpgas_apt_url }}"
    repo_suite: "{{ fpgas_apt_suite }}"
    repo_key_fingerprint: "{{ fpgas_apt_key_fingerprint }}"

# mithro/rp1-jtag no longer publishes packages and its apt repository is
# going away; roots that still carry it would fail `apt update` below.
- name: Retire the rp1-jtag apt repository
  ansible.builtin.include_tasks: rp1-jtag.yml

# fpgas.online patch-series openFPGALoader / OpenOCD builds, which replace
# the rp1-jtag ones in roles/onpi/tasks/apt.yml.
- name: Add the fpgas.online-fpga-tools apt repository
  ansible.builtin.include_tasks: fpga-tools.yml

# The stale-NFS-root watchdog, which roles/onpi installs.
- name: Add the nfsroot-watchdog apt repository
  ansible.builtin.include_tasks: nfsroot-watchdog.yml

# The same two repositories under their names before the apt repository
# convention (2026-09-24): pubkey.gpg dearmoured to /usr/share/keyrings/
# fpgas-online.gpg with a dists/<suite> main source in fpgas-online.list, and
# fpgas-online-fpga-tools.{gpg,list}. Removed after the renamed ones above are
# written; the old dists/ archive stops being served once every root moved.
- name: Remove the pre-convention fpgas.online apt sources and keyrings
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/sources.list.d/fpgas-online.list
    - /usr/share/keyrings/fpgas-online.gpg
    - /usr/share/keyrings/fpgas-online.asc
    - /etc/apt/sources.list.d/fpgas-online-fpga-tools.list
    - /etc/apt/keyrings/fpgas-online-fpga-tools.gpg
    - /etc/apt/keyrings/fpgas-online-fpga-tools.gpg.fetched

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
