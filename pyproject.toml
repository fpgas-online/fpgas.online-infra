[project]
name = "fpgas-online-infra"
version = "0.1.0"
description = "Ansible infrastructure for fpgas.online — test harness"
requires-python = ">=3.11"
dependencies = [
    "ansible-core",
    "paramiko",
]

[dependency-groups]
dev = [
    "ansible-lint==26.9.0",
    "pytest",
    "yamllint==1.38.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tests"]
